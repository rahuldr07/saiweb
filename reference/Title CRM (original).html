const typeUsage=k=>{
 const held=COUNTIES.filter(c=>c.links[k]&&c.links[k].u).length;
 return {held,missing:COUNTIES.length-held,
  bad:COUNTIES.filter(c=>c.links[k]&&BADSTATES.includes(c.links[k].s)).length};
};
function manageLinkTypes(){
 if(!isAdmin()) return openModal('Link types',
  `<div class="bnr r"><span class="bi">🔒</span><div><div class="bt">Company admins only</div>
   Adding a link type changes every county in the workspace, so it is kept to admins.</div></div>`);
 openModal('Link types',
  `<p class="gr" style="font-size:12.5px;margin-bottom:14px">Every county holds one link of each type. Adding a type gives all ${COUNTIES.length} counties a new empty slot, and the checker picks it up on its next run.</p>
   <div class="rows">${LINKTYPES.map((t,i)=>{const u=typeUsage(t.k);
    return `<div class="rw" style="grid-template-columns:1fr auto">
     <span><b>${esc(t.n)}</b>${t.req?chip('Required','b'):''}
      <div class="sd">${esc(t.note||'')}</div>
      <div class="sd" style="margin-top:3px">${u.held} of ${COUNTIES.length} counties have one${u.bad?` · <span class="bad">${u.bad} not working</span>`:''}${u.missing?` · ${u.missing} missing`:''}</div></span>
     <span style="display:flex;gap:5px">
      <button class="btn g sm" onclick="moveLinkType('${t.k}',-1)" ${i===0?'disabled':''} aria-label="Move ${esc(t.n)} up">↑</button>

   <div id="lt-err" style="margin-top:12px"></div>`,
  `<button class="btn g" onclick="closeModal()">Close</button><button class="btn" onclick="editLinkType()">＋ Add a link type</button>`);
}
function editLinkType(k){
 const t=LINKTYPES.find(x=>x.k===k)||{n:'',note:'',req:false};
 const u=k?typeUsage(k):null;
 openModal(k?`Edit ${t.n}`:'Add a link type',
  `<div id="lt-err"></div>
   <div class="frm">
    <div class="fld"><label for="lt-n">Name</label><input class="inp" id="lt-n" value="${esc(t.n)}" placeholder="e.g. Municipal lien"></div>
    <div class="fld"><label for="lt-r">Required</label>
     <select class="inp" id="lt-r"><option value="1"${t.req?' selected':''}>Yes — a county without it counts as a gap</option>
      <option value="0"${t.req?'':' selected'}>No — nice to have</option></select></div>
    <div class="fld" style="grid-column:1/-1"><label for="lt-d">What it is for</label>
     <input class="inp" id="lt-d" value="${esc(t.note||'')}" placeholder="One line, shown to whoever fills it in"></div>
   </div>
   ${k?`<div class="bnr b" style="margin:16px 0 0"><span class="bi">◔</span><div style="font-size:12.5px">
     <b>${u.held} of ${COUNTIES.length}</b> counties have this link${u.bad?`, and ${u.bad} of those are not working`:''}.</div></div>`
    :`<div class="bnr b" style="margin:16px 0 0"><span class="bi">◈</span><div style="font-size:12.5px">
     <div class="bt" style="font-size:12.5px">All ${COUNTIES.length} counties get an empty slot</div>
     Nothing is invented — each one shows as <b>no link on file</b> until someone fills it in, and the checker starts covering it on the next run.</div></div>`}`,
  `<button class="btn g" onclick="manageLinkTypes()">Back</button>
   ${k&&!t.req?`<button class="btn d" onclick="removeLinkType('${k}')">Remove</button>`:k?`<button class="btn d" onclick="removeLinkType('${k}')">Remove</button>`:''}
   <button class="btn" onclick="saveLinkType(${k?`'${k}'`:'null'})">${k?'Save':'Add link type'}</button>`);
}
function ltErr(m){const e=document.getElementById('lt-err');
 if(e)e.innerHTML=`<div class="bnr d" style="margin-bottom:14px"><span class="bi">⚑</span><div style="font-size:12.5px">${esc(m)}</div></div>`;}
function ltKey(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'link';}
function saveLinkType(k){
 const n=val('lt-n'), note=val('lt-d'), req=val('lt-r')==='1';
 if(!n){ ltErr('A name is required.'); return; }
 if(LINKTYPES.some(x=>x.k!==k&&x.n.toLowerCase()===n.toLowerCase())){ ltErr(`There is already a link type called ${n}.`); return; }
 const rec=LINKTYPES.find(x=>x.k===k);
 if(rec) Object.assign(rec,{n,note,req});
 else{
  let key=ltKey(n), b=2; while(LINKTYPES.some(x=>x.k===key)) key=ltKey(n)+(b++);
  LINKTYPES.push({k:key,n,note,req});
  COUNTIES.forEach(c=>{ if(!c.links[key]) c.links[key]={u:'',s:'none'}; });   // an empty slot, not an invented link
 }
 manageLinkTypes();
}
function removeLinkType(k){
 const t=LINKTYPES.find(x=>x.k===k); if(!t) return;
 const u=typeUsage(k);
 openModal(`Remove ${t.n}?`,
  `<p style="font-size:13.5px">${u.held
    ? `<b>${u.held} ${u.held===1?'county has':'counties have'}</b> a ${t.n} link on file. Removing the type discards ${u.held===1?'that address':'those addresses'}.`
    : 'No county has one on file, so nothing is lost.'}</p>
   ${LINKTYPES.length<=1?`<div class="bnr d" style="margin-top:14px"><span class="bi">⚑</span><div style="font-size:12.5px">
    This is the last link type. A county with no links is not much use.</div></div>`:''}`,
  `<button class="btn g" onclick="manageLinkTypes()">Cancel</button>
   <button class="btn d" onclick="reallyRemoveLinkType('${k}')" ${LINKTYPES.length<=1?'disabled':''}>Remove ${esc(t.n)}</button>`);
}
function reallyRemoveLinkType(k){
 LINKTYPES.splice(LINKTYPES.findIndex(x=>x.k===k),1);
 COUNTIES.forEach(c=>{delete c.links[k];});
 manageLinkTypes();
}
function moveLinkType(k,dir){
 const i=LINKTYPES.findIndex(x=>x.k===k), j=i+dir;
 if(i<0||j<0||j>=LINKTYPES.length) return;
 [LINKTYPES[i],LINKTYPES[j]]=[LINKTYPES[j],LINKTYPES[i]];
 manageLinkTypes();
}

function countyErr(m){const e=document.getElementById('cy-err');
 if(e)e.innerHTML=`<div class="bnr d" style="margin-bottom:14px"><span class="bi">⚑</span><div style="font-size:12.5px">${esc(m)}</div></div>`;}
function saveCounty(n,stt){
 const name=val('cy-n'), state=val('cy-s').toUpperCase();
 if(!name){ countyErr('A county name is required.'); return; }
 if(!/^[A-Z]{2}$/.test(state)){ countyErr('Use a two-letter state code.'); return; }
 const dup=COUNTIES.find(c=>c.n.toLowerCase()===name.toLowerCase()&&c.st===state&&!(c.n===n&&c.st===stt));
 if(dup){ countyErr(`${name}, ${state} is already on file.`); return; }
 const idxv=parseInt(val('cy-i'),10);
 const rec=n?findCounty(n,stt):null;
 const links={};
 LINKTYPES.forEach(t=>{
  const k=t.k, u=val('cy-'+k).trim();
  const prev=rec?rec.links[k]:null;
  if(!u) links[k]={u:'',s:'none'};
  else if(prev&&prev.u===u) links[k]=prev;            // unchanged — keep its health and history
  else links[k]={u,s:'unchecked'};                    // new or edited — needs checking again
 });
 if(rec) Object.assign(rec,{n:name,st:state,idx:idxv||null,links});
 else COUNTIES.push({n:name,st:state,idx:idxv||null,links});
 closeModal(); go('counties');
}
function removeCounty(n,stt){
 const i=COUNTIES.findIndex(c=>c.n===n&&c.st===stt);
 if(i>=0)COUNTIES.splice(i,1);
 closeModal(); go('counties');
}

/* ══════════ HOW A PERSON PERFORMED ══════════
   A quality score on its own is half a picture. Someone can hold a 5.00 by taking
   twice the time they were given, and someone fast can be quietly leaving defects.
   These two things have to be read together, so they are computed together. */
function stageWorkOf(dels){
 const m={};
 dels.forEach(d=>{
  const plan=checkpoints(d.slaH,d.pr);
  ASSIGN_STAGES.forEach(st=>{
   const name=d.byName&&d.byName[st]; if(!name) return;
   const c=plan.find(y=>y.stage===st); if(!c||!c.hours) return;
   const h=d.st[st];
   (m[name]=m[name]||{n:name,items:[],stages:{}});
   const rec={d,st,h,budget:c.hours,ratio:h/c.hours,over:h>c.hours};
   m[name].items.push(rec);
   (m[name].stages[st]=m[name].stages[st]||[]).push(rec);
  });
 });
 /* Departments are not equally hard to hit. RTS almost never overruns; Search
    routinely does. Judging a searcher against an RTS clerk's percentage would be
    a comparison of job, not of person — so each person is measured against the
    departments they actually worked in. */
 const dept={};
 Object.values(m).forEach(p=>p.items.forEach(x=>{
   (dept[x.st]=dept[x.st]||{n:0,over:0}); dept[x.st].n++; if(x.over) dept[x.st].over++;}));
 Object.keys(dept).forEach(k=>dept[k].rate=Math.round((dept[k].n-dept[k].over)/dept[k].n*100));
 Object.values(m).forEach(p=>{
  p.c=p.items.length;
  p.over=p.items.filter(x=>x.over).length;
  p.onBudget=Math.round((p.c-p.over)/p.c*100);
  p.ratio=median(p.items.map(x=>x.ratio));
  /* only counts against the person if their own stage was the one that overran */
  p.causedLate=p.items.filter(x=>x.over&&x.d.late).length;
  /* what someone doing this exact mix of stages would typically manage */
  p.expected=Math.round(ASSIGN_STAGES.reduce((a,st)=>{
    const n=(p.stages[st]||[]).length; return a+n*((dept[st]||{rate:100}).rate);},0)/p.c);
  p.vsPeers=p.onBudget-p.expected;
  /* a good median with a poor hit rate means variance, not slowness */
  p.erratic=p.ratio<=1.02&&p.onBudget<65;
 });
 m._dept=dept;
 return m;
}
const median=a=>{if(!a.length)return 0;const x=[...a].sort((p,q)=>p-q);
  return x.length%2?x[(x.length-1)/2]:(x[x.length/2-1]+x[x.length/2])/2;};

/* the plain-English read of the two axes together */
function standing(q,vsPeers,teamQ){
 const clean=q>=teamQ-0.03, quick=vsPeers>=-5;      // measured against peers doing the same stages
 if(clean&&quick)  return ['Fast and clean','v','Hits the budget and the quality bar. Nothing to do.'];
 if(clean&&!quick) return ['Careful but slow','r','Quality holds up; the time does not — and not just because of the stages they are given, since this compares them with others doing the same ones.'];
 if(!clean&&quick) return ['Quick, but marks come off','r','Faster than their peers and below the quality line — the classic trade, being made without anyone deciding to make it.'];
 return ['Behind on both','d','Below the quality line and over the budget. This is the one to look at first.'];
}

/* ── On time: measured against the promise, not against a feeling ── */

 const med=median;

 const pct=Math.round(onTime/d.length*1000)/10;
 const avg=d.reduce((a,x)=>a+x.hrs,0)/d.length;

 });
 const totMed=stages.reduce((a,x)=>a+x.med,0)||1;
 stages.forEach(x=>x.share=Math.round(x.med/totMed*100));

 /* week by week, so a bad fortnight is visible as a fortnight */

 for(let end=new Date(r.to); end>=r.from; end=new Date(end.getFullYear(),end.getMonth(),end.getDate()-7)){

   }

     <p class="gr" style="font-size:12.5px;margin-top:12px">Measured against each order's own promise, so a 48-hour full search and a 4-hour rush can sit in the same bar.</p></div>
     <h2 class="sec">Slowest first</h2>
     ${delRow(d.slice().sort((a,b)=>(b.hrs/b.slaH)-(a.hrs/a.slaH)).slice(0,40))}
     <p class="gr" style="font-size:12.5px;margin-top:10px">Top 40 by share of the promise used.</p>`;
  })())
 +(of!=='all'?'':`

  <div class="card p" style="margin-top:18px"><div class="lb">Where the time goes — median hours per department, against the budget it was given</div>
   <p class="gr" style="font-size:12.5px;margin:6px 0 14px">The pale bar is the budget from <button class="lnk" onclick="openCo('Turnaround &amp; SLA','Stage budgets')">Company → Stage budgets</button>; the solid bar is what actually happened.</p>
   ${stages.map(x=>`<div style="display:grid;grid-template-columns:118px 1fr 150px;gap:12px;align-items:center;padding:7px 0;font-size:12.5px">

   <p class="gr" style="font-size:12.5px;margin-top:12px"><b>${esc(worst.st)}</b> misses its checkpoint on ${worst.overPct}% of orders — ${worst.overPct>25

S._qualityReport=()=>{
 const r=qcRange();
 const dels=DELIVERIES.filter(x=>inRange(x.d,r));
 const rows=QCLOG.filter(x=>inRange(x.d,r));
 const opportunities=dels.length*2;                    // two QC stages per delivery
 const cover=opportunities?Math.round(rows.length/opportunities*100):0;
 const avg=k=>rows.length?rows.reduce((a,x)=>a+x[k],0)/rows.length:0;
 const overall=rows.length?rows.reduce((a,x)=>a+x.avg,0)/rows.length:0;
 const defects=rows.filter(x=>x.defect);
 const spread=[...new Set(rows.map(x=>Math.round(x.avg)))].length;

 /* per person — keyed on the name stored at rating time, so leavers still appear */
 const by={};
 rows.forEach(x=>{const k=x.onName; (by[k]=by[k]||{n:k,c:0,acc:0,comp:0,fmt:0,def:0});
  const p=by[k]; p.c++; p.acc+=x.acc; p.comp+=x.comp; p.fmt+=x.fmt; if(x.defect)p.def++;});
 const TW=stageWorkOf(dels);                            // how they did against the clock
 const TWP=Object.entries(TW).filter(([k])=>k!=='_dept').map(([,v])=>v);
 const people=Object.values(by).map(p=>{const t=TW[p.n];
   return {...p, a:p.acc/p.c, cm:p.comp/p.c, f:p.fmt/p.c, o:(p.acc+p.comp+p.fmt)/(3*p.c),
     tw:t||null};})
   .sort((x,y)=>y.c-x.c);

 /* coverage week by week — the reason a range is worth having */
 const weeks=[];
 for(let end=new Date(r.to); end>=r.from; end=new Date(end.getFullYear(),end.getMonth(),end.getDate()-7)){
  const st=new Date(end.getFullYear(),end.getMonth(),end.getDate()-6);
  const w={from:st<r.from?r.from:st,to:end};
  const d2=DELIVERIES.filter(x=>inRange(x.d,w)).length*2;
  const g=QCLOG.filter(x=>inRange(x.d,w));
  weeks.unshift({...w,pct:d2?Math.round(g.length/d2*100):0,n:g.length,
    avg:g.length?g.reduce((a,x)=>a+x.avg,0)/g.length:0});
  if(weeks.length>14) break;
 }

 const rb=rangeBar('q');

 if(SEL.qstaff) return rb+qcStaffDetail(SEL.qstaff,rows,r,overall,people,stageWorkOf(dels));

 if(!dels.length) return rb+`<div class="empty" style="padding:40px 10px"><span class="ei">★</span>
   <p>No deliveries in this range, so there is nothing to score.</p>
   <button class="btn g sm" onclick="setQPreset('30')">Back to the last 30 days</button></div>`;

 return rb
 +`<div class="bnr r"><span class="bi">★</span><div><div class="bt">${spread<=2?'These scores are not separating anyone':'Coverage is the weak point, not the scale'}</div>
   ${cover}% of the work in this range was rated at all, and the average is ${overall.toFixed(2)} out of 5${spread<=2?' with almost no spread':''}. A measure where everyone is near-perfect ranks nobody.
   <div class="bs">Making a rating mandatory before delivery, and scoring three criteria instead of one, fixes both.</div></div>
   <div class="ba"><button class="btn g sm" onclick="pick('qsub','How scoring works')">How scoring works</button></div></div>

  ${(()=>{const f=SEL.qtf||'all';
   const card=(key,title,val,sub,cls,vcls)=>{const on=f===key;
    return `<div class="kpi ${cls} ${on?'sel':''}" role="button" tabindex="0" aria-pressed="${on}"
      onclick="setQTF('${on?'all':key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setQTF('${on?'all':key}')}"
      title="${on?'Back to everyone':'Open the detail behind this'}">
     <div class="t">${esc(title)}</div><div class="v ${vcls}">${val}</div>
     <div class="d gr">${sub} <span class="${on?'brand':'gr'}" style="font-size:10.5px">· ${on?'showing these':'click to see'}</span></div></div>`;};
   return `<div class="kpis">
    ${card('delivered','Delivered',dels.length.toLocaleString(),esc(r.label),'','')}
    ${card('unrated','Rated',cover+'%',`${rows.length.toLocaleString()} of ${opportunities.toLocaleString()} checks`,cover<90?'warnk':'',cover<90?'warn':'ok')}
    ${card('spread','Average score',overall.toFixed(2),spread<=2?'no spread':`${spread} distinct levels`,'',spread<=2?'warn':'')}
    ${card('defects','Defects logged',defects.length,'a 3 or below on any criterion',defects.length?'alert':'','')}
   </div>`;})()}
  ${(SEL.qtf||'all')!=='all'?qcTeamFocus(SEL.qtf,dels,rows,defects,r,people,overall):`

  <div class="card p" style="margin-top:18px"><div class="lb">Coverage week by week — is rating becoming a habit?</div>
   <div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin:14px 0 4px">
   ${weeks.map(wk=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px" title="${fmtDate(wk.from)} – ${fmtDate(wk.to)}: ${wk.pct}% rated, ${wk.n} checks">
     <span class="mono gr" style="font-size:10.5px;text-align:center">${wk.pct}%</span>
     <span style="background:${wk.pct>=90?'var(--ok)':wk.pct>=70?'var(--brand2)':'var(--warn)'};border-radius:5px 5px 0 0;height:${Math.max(3,wk.pct)}%"></span>
     <span class="mono gr" style="font-size:9.5px;text-align:center">${pad(wk.to.getMonth()+1)}/${pad(wk.to.getDate())}</span></div>`).join('')}</div>
   <p class="gr" style="font-size:12.5px;margin-top:10px">Bars are the share of checks actually filled in, week ending. Amber is below 70%. The scores themselves barely move — coverage is the variable worth watching.</p></div>

  <div class="card" style="margin-top:18px"><div class="ch"><h2>By person</h2>
    <div class="r gr" style="font-size:12.5px">${people.length} rated in this range · click a row for the detail</div></div>
   <div class="tsc"><table class="mat" style="min-width:860px">
    <thead><tr><th>Staff</th><th style="text-align:right">Rated</th><th style="text-align:right">Defects</th>
     <th style="text-align:right">Quality</th>
     <th style="text-align:right" title="Stages of work they did in this range">Stages</th>
     <th style="text-align:right" title="How often they finished inside budget, next to what others doing the same stages manage">On budget</th>
     <th style="text-align:right" title="Median time taken as a multiple of the budget">vs budget</th>
     <th>Standing</th></tr></thead>
    <tbody>${people.map(p=>{const t=p.tw, sd=t?standing(p.o,t.vsPeers,overall):null;
     return `<tr class="clk" role="button" tabindex="0" onclick="openQCStaff('${esc(p.n).replace(/'/g,"&#39;")}')" onkeydown="if(event.key==='Enter')openQCStaff('${esc(p.n).replace(/'/g,"&#39;")}')" title="Open ${esc(p.n)} — ratings, reasons and time against budget">
      <td><b>${esc(p.n)}</b>${STAFF.some(x=>x.n===p.n)?'':' <span class="chip n">no longer here</span>'}</td>
      <td class="n mono">${p.c}</td>
      <td class="n mono ${p.def?'warn':'gr'}">${p.def||'—'}</td>
      <td class="n mono">${p.o.toFixed(2)}</td>
      <td class="n mono gr">${t?t.c:'—'}</td>
      <td class="n mono ${t?(t.vsPeers>=-5?'ok':t.vsPeers>=-15?'warn':'bad'):'gr'}">${t?`${t.onBudget}%`:'—'}
       ${t?`<div class="s gr">peers ${t.expected}%</div>`:''}</td>
      <td class="n mono ${t?(t.ratio<=1?'ok':'warn'):'gr'}">${t?t.ratio.toFixed(2)+'×':'—'}</td>
      <td>${sd?chip(sd[0],sd[1]):'<span class="gr">—</span>'} <span class="gr">›</span></td></tr>`}).join('')}
     <tr><td style="font-weight:700">Everyone</td><td class="tot">${rows.length}</td><td class="tot">${defects.length}</td>
      <td class="tot">${overall.toFixed(2)}</td>
      <td class="tot">${TWP.reduce((a,x)=>a+x.c,0)}</td>
      <td class="tot">${(()=>{const all=TWP; const c=all.reduce((a,x)=>a+x.c,0);
        return c?Math.round((c-all.reduce((a,x)=>a+x.over,0))/c*100)+'%':'—';})()}</td>
      <td class="tot">${median(TWP.map(x=>x.ratio)).toFixed(2)}×</td>
      <td></td></tr>
    </tbody></table></div></div>
  ${(()=>{
   const qlo=Math.min(...people.map(p=>p.o)), qhi=Math.max(...people.map(p=>p.o));
   const vs=people.filter(p=>p.tw).map(p=>p.tw.vsPeers);
   const outliers=people.filter(p=>p.tw&&p.tw.vsPeers<-5);
   const dept=TW._dept||{};
   const weak=Object.entries(dept).filter(([,v])=>v.rate<70).sort((a,b)=>a[1].rate-b[1].rate);
   return `<div class="bnr r" style="margin-top:14px"><span class="bi">◷</span><div>
    <div class="bt">Neither column ranks people on its own</div>
    Quality runs ${qlo.toFixed(2)} to ${qhi.toFixed(2)} — a spread of ${(qhi-qlo).toFixed(2)}, which is noise.
    Against peers on the same stages, hit rates run ${Math.min(...vs)} to +${Math.max(...vs)} points, and
    ${outliers.length?`only ${outliers.map(p=>esc(p.n)).join(' and ')} sit${outliers.length===1?'s':''} meaningfully below.`
      :'nobody sits meaningfully below.'}
    <div class="bs">Raw on-budget percentages would have been unfair — someone doing Search is judged against a department that misses ${100-(dept['Search']||{rate:100}).rate}% of the time, someone on RTS against one that almost never does. The peers figure corrects for that.</div></div></div>
   ${weak.length?`<div class="bnr d"><span class="bi">⚑</span><div>
    <div class="bt">${weak.map(([k,v])=>`${esc(k)} is missed by everyone ${100-v.rate}% of the time`).join(' · ')}</div>
    When a whole department misses its budget this often, it is the budget or the staffing that is wrong — not the people in it. No amount of coaching moves a number that everyone shares.
    <div class="bs">Either widen ${esc(weak[0][0])}'s share of the clock, or put more people in it.</div></div>
    <div class="ba"><button class="btn g sm" onclick="openCo('Turnaround &amp; SLA','Stage budgets')">Stage budgets</button></div></div>`:''}`;})()}
  <p class="gr" style="font-size:12.5px;margin-top:10px">Every figure is computed from the ${rows.length.toLocaleString()} ratings in range, so the table and the four cards above cannot disagree. Someone who has left the company still appears against the work they did — the name is recorded on the rating, not looked up afterwards.</p>`}`;
};

/* ══════════ what a headline card opens ══════════ */
function setQTF(v){SEL.qtf=v; go(view);}
function qcTeamFocus(f,dels,rows,defects,r,people,overall){
 const back=`<div class="bnr b" style="margin-top:14px"><span class="bi">▤</span><div>
   <div class="bt">${f==='delivered'?`The ${dels.length} deliveries behind that number`
     :f==='unrated'?'The checks that were never filled in'
     :f==='spread'?'Every mark that made up that average'
     :`All ${defects.length} defect${defects.length===1?'':'s'} in this range`}</div>
   ${esc(fmtDate(r.from))} to ${esc(fmtDate(r.to))}. The rest of the report is hidden while you are looking at this.</div>
   <div class="ba"><button class="btn g sm" onclick="setQTF('all')">Back to everyone</button></div></div>`;

 if(f==='delivered'){
  const late=dels.filter(x=>x.late);
  return back+`<h2 class="sec">Delivered — ${dels.length}, of which ${late.length} late</h2>
  <div class="card" id="qcFocusList"><div class="tsc"><div style="min-width:900px">
   <div class="trow h" style="grid-template-columns:110px 150px 150px 110px 110px 130px 1fr">
    <span>Date</span><span>Order</span><span>Client</span><span>Promise</span><span>Took</span><span>Outcome</span><span>Rated</span></div>
   <div class="tb">${dels.slice().sort((a,b)=>b.d-a.d).map(x=>{
     const rated=rows.filter(y=>y.order===x.id);
     return `<div class="trow" style="grid-template-columns:110px 150px 150px 110px 110px 130px 1fr">
      <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(x.dk)}</div></div>
      <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(x.id)}</div><div class="s">${esc(x.pr)}</div></div>
      <div class="cell"><div class="v" style="font-size:12.5px">${esc(x.cl)}</div></div>
      <div class="cell"><div class="v mono">${x.slaH}h</div></div>
      <div class="cell"><div class="v mono ${x.late?'bad':'ok'}">${hh(x.hrs)}</div></div>
      <div class="cell">${x.late?chip('Late','d'):chip('On time','v')}</div>
      <div class="cell"><div class="v" style="font-size:12.5px">${rated.length===2?'<span class="ok">both checks rated</span>'
        :rated.length===1?`<span class="warn">1 of 2 — ${esc(rated[0].stage)} only</span>`:'<span class="bad">neither check rated</span>'}</div></div></div>`}).join('')}</div>
  </div></div></div>
  <p class="gr" style="font-size:12.5px;margin-top:10px">Two checks are expected on every delivery — one on the search, one on the typing. The right-hand column is where the ${Math.round(rows.length/(dels.length*2)*100)}% coverage figure comes from.</p>`;
 }

 if(f==='unrated'){
  const gaps=[];
  dels.forEach(d=>['Search','Typing'].forEach(st=>{
    if(!rows.some(y=>y.order===d.id&&y.stage===st))
      gaps.push({d,st,who:(d.byName||{})[st]||'unknown'});}));
  const byWho={}; gaps.forEach(g=>byWho[g.who]=(byWho[g.who]||0)+1);
  return back+`<h2 class="sec">${gaps.length} checks were never filled in</h2>
  <div class="bnr d"><span class="bi">⚑</span><div>
   <div class="bt">This is the gap, and it is bigger than any score on the page</div>
   ${gaps.length} of ${dels.length*2} checks have no rating at all. Nothing was recorded, so nothing can be reviewed — and every average on this report is drawn from the ${Math.round(rows.length/(dels.length*2)*100)}% that were.
   <div class="bs">Making a rating mandatory before an order can be marked Sent closes this without asking anyone to work differently.</div></div>
   <div class="ba"><button class="btn g sm" onclick="pick('qsub','How scoring works')">The rule that fixes it</button></div></div>
  <div class="card p" style="margin-top:14px"><div class="lb">Whose work went unchecked</div>
   ${Object.entries(byWho).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([n,c])=>`
    <div style="display:grid;grid-template-columns:190px 1fr 70px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px">
     <span>${esc(n)}</span><span class="bar"><i style="width:${Math.round(c/Math.max(...Object.values(byWho))*100)}%;background:var(--warn)"></i></span>
     <span class="mono gr" style="text-align:right">${c}</span></div>`).join('')}
   <p class="gr" style="font-size:12.5px;margin-top:12px">Spread fairly evenly, which says the gap is a process problem rather than one person being skipped.</p></div>
  <h2 class="sec">Every unrated check</h2>
  <div class="card" id="qcFocusList"><div class="tsc"><div style="min-width:760px">
   <div class="trow h" style="grid-template-columns:110px 160px 150px 130px 1fr">
    <span>Delivered</span><span>Order</span><span>Client</span><span>Stage</span><span>Whose work</span></div>
   <div class="tb">${gaps.sort((a,b)=>b.d.d-a.d.d).map(g=>`<div class="trow" style="grid-template-columns:110px 160px 150px 130px 1fr">
     <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(g.d.dk)}</div></div>
     <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(g.d.id)}</div><div class="s">${esc(g.d.pr)}</div></div>
     <div class="cell"><div class="v" style="font-size:12.5px">${esc(g.d.cl)}</div></div>
     <div class="cell"><div class="v" style="font-size:12.5px">${esc(g.st)}</div></div>
     <div class="cell"><div class="v" style="font-size:12.5px">${esc(g.who)}</div></div></div>`).join('')}</div>
  </div></div></div>`;
 }

 if(f==='spread'){
  const marks=[]; rows.forEach(x=>marks.push(x.acc,x.comp,x.fmt));
  const dist=[5,4,3,2,1].map(v=>({v,n:marks.filter(m=>m===v).length}));
  const sorted=people.slice().sort((a,b)=>b.o-a.o);
  return back+`<h2 class="sec">Every one of the ${marks.length.toLocaleString()} marks behind ${overall.toFixed(2)}</h2>
  <div class="card p"><div class="lb">How the marks fall</div>
   ${dist.map(d=>`<div style="display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:6px 0;font-size:12.5px">
     <span>${chip(`${d.v} · ${esc((QCSCALE.find(q=>q[0]===d.v)||[])[1]||'')}`,(QCSCALE.find(q=>q[0]===d.v)||[])[2]||'n')}</span>
     <span class="bar"><i style="width:${Math.round(d.n/marks.length*100)}%;background:${d.v>=4?'var(--ok)':'var(--warn)'}"></i></span>
     <span class="mono gr" style="text-align:right">${d.n.toLocaleString()} · ${(d.n/marks.length*100).toFixed(1)}%</span></div>`).join('')}
   <p class="gr" style="font-size:12.5px;margin-top:12px"><b>${(dist[0].n/marks.length*100).toFixed(0)}% of all marks are a 5.</b> An average built from that cannot rank anyone — the question is not who scores lower, it is whether raters are willing to give a 3.</p></div>
  <h2 class="sec">Everyone, best to worst — and how little separates them</h2>
  <div class="card p">
   ${sorted.map(p=>{const lo=Math.min(...sorted.map(x=>x.o)), hi=Math.max(...sorted.map(x=>x.o));
     const pos=hi===lo?50:((p.o-lo)/(hi-lo))*100;
     return `<div style="display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px">
      <span>${esc(p.n)}</span>
      <span style="position:relative;height:14px;background:var(--rail);border-radius:5px">
       <span style="position:absolute;left:calc(${pos}% - 5px);top:2px;width:10px;height:10px;border-radius:50%;background:var(--brand)"></span></span>
      <span class="mono" style="text-align:right">${p.o.toFixed(2)}</span></div>`}).join('')}
   <p class="gr" style="font-size:12.5px;margin-top:12px">The dots span the full width, but the scale underneath runs only from ${Math.min(...sorted.map(x=>x.o)).toFixed(2)} to ${Math.max(...sorted.map(x=>x.o)).toFixed(2)}. Stretching a ${(Math.max(...sorted.map(x=>x.o))-Math.min(...sorted.map(x=>x.o))).toFixed(2)} range across a chart is how a flat measure gets mistaken for a meaningful one.</p></div>`;
 }

 const list=defects.slice().sort((a,b)=>b.d-a.d);
 const byReason={}; list.forEach(x=>{if(x.note) byReason[x.note]=(byReason[x.note]||0)+1;});
 return back+`<h2 class="sec">What the ${list.length} defect${list.length===1?'':'s'} were</h2>
  ${Object.keys(byReason).length?`<div class="card p" style="margin-bottom:14px"><div class="lb">Grouped by reason</div>
   <div class="rows" style="border:none;border-radius:0;margin-top:6px">
   ${Object.entries(byReason).sort((a,b)=>b[1]-a[1]).map(([why,n])=>`<div class="rw">
     <span class="${n>1?'warn':'gr'}" style="font-size:14.5px">${n>1?'⚑':'·'}</span>
     <span><b>${esc(why)}</b>${n>1?`<div class="sd warn">seen ${n} times across the team — worth fixing in the process, not with one person</div>`:''}</span>
     <span class="mono gr">${n}</span></div>`).join('')}</div></div>`:''}
  <div class="card" id="qcFocusList"><div class="tsc"><div style="min-width:900px">
   <div class="trow h" style="grid-template-columns:105px 150px 140px 120px 110px 1fr">
    <span>Date</span><span>Order</span><span>Who</span><span>Stage</span><span>Marks</span><span>What the rater said</span></div>
   <div class="tb">${list.map(x=>`<div class="trow" style="grid-template-columns:105px 150px 140px 120px 110px 1fr">
     <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(x.dk)}</div></div>
     <div class="cell"><div class="v mono" style="font-size:12.5px">${esc(x.order)}</div><div class="s">${esc(x.cl)} · ${esc(x.pr)}</div></div>
     <div class="cell"><button class="lnk" style="font-size:12.5px" onclick="event.stopPropagation();openQCStaff('${esc(x.onName).replace(/'/g,"&#39;")}')">${esc(x.onName)}</button>
      <div class="s">by ${esc(x.byName)}</div></div>
     <div class="cell"><div class="v" style="font-size:12.5px">${esc(x.stage)}</div></div>
     <div class="cell"><div class="v mono" style="font-size:12.5px">
       <span class="${x.acc<4?'bad':x.acc<5?'warn':'ok'}">${x.acc}</span>·<span class="${x.comp<4?'bad':x.comp<5?'warn':'ok'}">${x.comp}</span>·<span class="${x.fmt<4?'bad':x.fmt<5?'warn':'ok'}">${x.fmt}</span></div></div>
     <div class="cell"><div class="v bad" style="font-size:12.5px">${esc(x.note||'no reason recorded')}</div>
      ${x.crit?`<div class="s">${esc(x.crit)}</div>`:''}</div></div>`).join('')}</div>
  </div></div></div>
  <p class="gr" style="font-size:12.5px;margin-top:10px">Click a name to see everything about that person. A reason appearing more than once is a process problem — the same mistake made by different people is not a coincidence.</p>`;
}

 const sel=SEL.dw||'all';

       <div class="s">${x.pct}% complete</div>`:`<span class="gr" style="font-size:12.5px">not auto-assigned</span>`}</div>
     <div class="cell"><div class="v mono ok">${x.done||'—'}</div></div>

 }

 const items=r.items.filter(i=>f==='all'?true:f==='done'?i.fin:!i.fin);
 const ppl=Object.entries(r.people).map(([id,v])=>({id,...v,tot:v.done+v.pend})).sort((a,b)=>b.tot-a.tot);
 const cu=r.cap?Math.round(r.load/r.cap*100):0;
 return `<button class="btn g sm" style="margin-bottom:14px" onclick="pick('dw','all')">← All departments</button>`
 +wHead(r.d,`${r.staff.length} member${r.staff.length===1?'':'s'} · ${r.avail} available today · ${r.auto?'part of the automatic pass':'exception branch, assigned on demand'}`,

 +(r.avail<=1?`<div class="bnr d"><span class="bi">⚠</span><div>

 +`<div class="kpis">

 go(view);

function saveRule(id){
 const d=ruleFromForm();
 const err=m=>{document.getElementById('ru-err').innerHTML=
   `<div class="bnr r" style="margin:14px 0 0"><span class="bi">⚠</span><div>${m}</div></div>`;};
 if(!d.n) return err('A name — it is what appears in the trace when this rule decides something.');
 if(RULES.some(x=>x.id!==id&&x.n.toLowerCase()===d.n.toLowerCase()))
  return err(`<b>${esc(d.n)}</b> already exists. Two rules with one name makes a trace unreadable.`);
 if(d.k!=='block'&&!d.pool.length)
  return err('Nobody is ticked, so every order this matches would become an exception. Tick at least one person, or make it a <b>Blocks</b> rule if that is what you mean.');
 if(!Object.keys(d.cond).length&&d.k!=='prefer')
  return err('No condition set, so this would apply to every order at every stage. Choose at least a stage, product or state.');
 const ex=RULES.find(x=>x.id===id);
 if(ex){
  if(ex.lock) Object.assign(ex,{n:d.n,cond:d.cond,pool:d.pool});   // locked: name and condition only
  else Object.assign(ex,{n:d.n,k:d.k,on:d.on,cond:d.cond,pool:d.pool,when:undefined,then:undefined});
 } else {
  /* new rules go in before the tie-break, which has to stay last */
  const at=RULES.findIndex(x=>x.k==='prefer');
  RULES.splice(at<0?RULES.length:at,0,
    {id:'ru'+Date.now().toString(36),n:d.n,k:d.k,on:d.on,cond:d.cond,pool:d.pool});
 }
 closeModal(); recompute(); toast(ex?`${d.n} saved`:`${d.n} added`); go('assign');
}

}

function openNewOrder(){SEL.no=null;SEL.noErr=null;go('neworder');}
const noDefaults=()=>({addr:'Address redacted, Bengaluru',county:'',st:'PA',parcel:'',client:CLIENTS.filter(c=>c.active!==false)[0]?.n||'',
 product:'PRLP',ref:'',eff:fmtDate(NOW),buyer:'',seller:'',instr:'',tier:'standard'});
function noSet(k,v){SEL.no=Object.assign(noDefaults(),SEL.no||{},{[k]:v});SEL.noErr=null;go('neworder');}

/* the SLA that would apply, and the due date it produces */
function slaFor(client,product){
 return SLA.find(s=>s.cl===client&&s.pr===product)
     || SLA.find(s=>s.cl===client&&s.pr==='Any')
     || {cl:'default',pr:'Any',h:prod(product).h};
}
function dueFor(f){
 const base=slaFor(f.client,f.product).h, t=tierOf(f.tier);
 return {h:Math.max(1,Math.round(base*t.mult)), at:hrs(Math.max(1,Math.round(base*t.mult))), base};
}
/* who would take each stage, using the live rules and today's load — without committing anything */
function previewAssign(o){
 const load={...RUN.load}, onOrder={}, out={};
 for(const stage of ASSIGN_STAGES){
  let pool=STAFF.filter(s=>s.dep.includes(stage));
  if(!pool.length){ out[stage]={err:'nobody in the department'}; continue; }
  for(const r of RULES.filter(x=>x.k==='route'&&x.on&&x.match)) if(r.match(o,stage)) pool=pool.filter(s=>r.pool.includes(s.id));
  if(ruleOn('r2')) pool=pool.filter(s=>s.avail==='ok'&&s.active!==false);
  if(!pool.length){ out[stage]={err:'nobody available'}; continue; }
  if(ruleOn('r3')) pool=pool.filter(s=>load[s.id]<s.cap);
  if(!pool.length){ out[stage]={err:'everyone at their target'}; continue; }
  const paired=PAIRS[stage];
  if(ruleOn('r4')&&paired) pool=pool.filter(s=>onOrder[paired]!==s.id);
  if(!pool.length){ out[stage]={err:'would be self-review'}; continue; }
  pool.sort((a,b)=>(load[a.id]/a.cap)-(load[b.id]/b.cap));
  const p=pool[0]; load[p.id]++; onOrder[stage]=p.id; out[stage]={who:p.id};
 }
 return out;
}

 const preview=previewAssign({pr:f.product,st:f.st,cl:f.client});

 return `<button class="btn g sm" style="margin-bottom:14px" onclick="go('orders')">← Orders</button>`

 if(!f.client){ SEL.noErr='Choose a client.'; go('neworder'); return; }
 const p=prod(f.product), t=tierOf(f.tier), d=dueFor(f);
 const preview=previewAssign({pr:f.product,st:f.st,cl:f.client});
 const a={}; STAGES.forEach(s=>a[s]=null);
 Object.entries(preview).forEach(([s,v])=>{ if(v.who){a[s]=v.who; RUN.load[v.who]=(RUN.load[v.who]||0)+1;} });
 const id=`41934${String(10+ORDERS.length).padStart(2,'0')}-1`;
 ORDERS.unshift({id,cl:f.client,pr:f.product,stt:'search',st:f.st,co:f.county.trim(),
  prop:f.addr.trim(),a,due:d.at,recv:new Date(NOW),fee:r2(p.fee+t.up),age:'just arrived',
  ref:f.ref,buyer:f.buyer,seller:f.seller,instr:f.instr,parcel:f.parcel,eff:f.eff});
 SEL.no=null;SEL.noErr=null;
 openOrder(id);

/* ══════════ QC HISTORY ══════════
   90 days of deliveries and the ratings against them. Generated once from a fixed
   seed so every figure is stable and reconciles; the report computes everything
   from this log rather than carrying numbers of its own.

   The rated person's NAME is stored on the record, not just their id — a quality
   history has to survive someone leaving the company. */
const QCDAYS=90;
/* Not every department behaves the same. Search carries the variance; the QC
   stages are short and predictable. These shape the generated history. */
const STAGEPRESSURE={'Search':0.92,'Search QC':0.72,'Typing':0.84,'Typing QC':0.70,'RTS':0.62};
const STALL={'Search':0.035,'Search QC':0.010,'Typing':0.022,'Typing QC':0.008,'RTS':0.006};
/* What a rater actually writes when a score drops — real abstracting defects,
   grouped by the criterion they belong to. */
/* A defect list tells someone what went wrong. It does not tell them what to do
   differently — so each reason carries the practice that prevents it, written for
   the work rather than as generic advice. */
const QCFIX={
 'Book/Page transposed from the index':'Read the reference off the recorded instrument itself, not the index entry. The index is a finding aid, keyed by hand, and transposition is the most common error in it.',
 'Grantee spelled from the deed, not the recorded index':'Where the deed and the index disagree on a name, the index governs what a searcher will find. Record the index spelling and note the variance.',
 'Consideration taken from the wrong instrument':'Check the instrument number on the page you are reading before copying a figure. Consecutive recordings on one page is where this happens.',
 'Mortgage amount out by a digit':'Read the amount twice — once from the figures, once from the words. Any instrument that states both gives you a free check.',
 'Instrument # belongs to the assignment, not the mortgage':'When a mortgage has been assigned, the original recording is the one that goes in the chain. Follow the assignment back before recording the number.',
 'Effective date read as the execution date':'Execution is when it was signed, effective is when it was recorded. Only the recording date affects priority.',
 'Open 2019 mortgage not reported':'Work the chain forward from the prior effective date and account for every mortgage you meet — an open one is only closed by a release you can point to.',
 'Judgment search missing for the co-borrower':'Run every name on the vesting deed separately, including middle initials and any former name shown.',
 'Prior effective date not carried forward on an update':'An update starts where the last search ended. Take the prior effective date from the previous report, never from the order.',
 'Current tax year not shown':'Report the most recent assessed year even when nothing is owed. Silence reads as "not checked".',
 'Legal description truncated at the metes call':'Copy the description to its close, including the point of beginning. A description that does not close cannot be relied on.',
 'Assignment chain stops before the current holder':'Follow assignments to the last one recorded. The chain ends at the current holder or it has not been searched.',
 'Dates entered DD/MM in a US report':'This company records dates MM/DD/YYYY everywhere. Set it once under Company and read it back on anything ambiguous below the 13th.',
 'Money written without cents':'Two decimal places always, even on a round figure. It is how a reader knows the cents were checked rather than dropped.',
 'Names in caps where this client wants Title Case':'Check the client format before typing. It is on the client record, and it is the cheapest defect on this list to avoid.',
 'Book/Page given where the client uses Instrument #':'Some counties give both; the client decides which is authoritative. Their preference is on their record.',
 'County name omitted from the property address':'A street address without a county is ambiguous in most states. Include it every time.',
 'Not Available written as N/A':'Write "Not Available" in full. N/A is read as "not applicable", which is a different claim.'};
const QCREASONS={
 Accuracy:['Book/Page transposed from the index',
   'Grantee spelled from the deed, not the recorded index',
   'Consideration taken from the wrong instrument',
   'Mortgage amount out by a digit',
   'Instrument # belongs to the assignment, not the mortgage',
   'Effective date read as the execution date'],
 Completeness:['Open 2019 mortgage not reported',
   'Judgment search missing for the co-borrower',
   'Prior effective date not carried forward on an update',
   'Current tax year not shown',
   'Legal description truncated at the metes call',
   'Assignment chain stops before the current holder'],
 Formatting:['Dates entered DD/MM in a US report',
   'Money written without cents',
   'Names in caps where this client wants Title Case',
   'Book/Page given where the client uses Instrument #',
   'County name omitted from the property address',
   'Not Available written as N/A']};
let _qseed=20260803;
const qrnd=()=>{_qseed=(_qseed*1664525+1013904223)%4294967296; return _qseed/4294967296;};
const pickOf=a=>a[Math.floor(qrnd()*a.length)];
let QCLOG=[], DELIVERIES=[];
function makeQCLog(){
 const log=[], dels=[];
 const inDept=d=>STAFF.filter(s=>s.dep.includes(d));
 const pairs=[['Search QC','Search'],['Typing QC','Typing']]
   .filter(([q,w])=>inDept(q).length&&inDept(w).length);
 if(!pairs.length) return {log,dels};
 /* Skewed hard towards 5, because that is what your system actually shows. The
    point of the report is that this distribution ranks nobody. */
 const score=()=>{const r=qrnd(); return r<0.95?5:r<0.99?4:r<0.997?3:2;};
 let n=0;
 for(let back=QCDAYS-1;back>=0;back--){
  const d=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-back,14,0);
  const count=5+Math.floor(qrnd()*8);
  for(let i=0;i<count;i++,n++){
   const cl=pickOf(CLIENTMIX), pr=pickOf(PRODMIX);
   /* The promise is captured at order time, the way a real system records it —
      editing the SLA table later must not rewrite history. */
   const slaH=slaHours({cl,pr});
   const plan=checkpoints(slaH,pr);
   /* Who did each stage is recorded once, so a person's quality score and their
      turnaround refer to the same work on the same order. */
   const by={}, byName={};
   ASSIGN_STAGES.forEach(g=>{const pool=inDept(g);
     if(pool.length){const p=pickOf(pool); by[g]=p.id; byName[g]=p.n;}});
   const st={}; let total=0;
   plan.forEach(c=>{
    /* Most stages come in under budget. Search runs hottest — it is the stage with
       the real-world variance, and the one that eats everyone else's slack. */
    const p=STAGEPRESSURE[c.stage]!==undefined?STAGEPRESSURE[c.stage]:0.80;
    const f=qrnd()<STALL[c.stage] ? 1.5+qrnd()*1.6 : p*(0.6+qrnd()*0.75);
    const h=c.hours*f; st[c.stage]=h; total+=h;
   });
   if(qrnd()<0.022) total+=slaH*(0.15+qrnd()*0.45);   // a doc request, waiting on the client
   const del={id:`41${String(80000+n)}-1`,d,dk:fmtDate(d),cl,pr,
     slaH, st, by, byName, hrs:total, late:total>slaH};
   dels.push(del);
   pairs.forEach(([qstage,wstage])=>{
    const worker=STAFF.find(x=>x.id===del.by[wstage])||pickOf(inDept(wstage));
    const rater=pickOf(inDept(qstage).filter(x=>x.id!==worker.id))||pickOf(inDept(qstage));
    if(qrnd()>0.67) return;                           // a third of the work is never rated
    const acc=score(), comp=score(), fmt=score();
    const lowest=[['Accuracy',acc],['Completeness',comp],['Formatting',fmt]]
      .sort((a,b)=>a[1]-b[1])[0];
    log.push({d,dk:fmtDate(d),order:del.id,cl,pr,stage:wstage,
      on:worker.id,onName:worker.n, by:rater.id,byName:rater.n,
      acc,comp,fmt, avg:(acc+comp+fmt)/3, defect:Math.min(acc,comp,fmt)<=3,
      /* a score below 5 without a reason teaches nobody anything */
      crit: lowest[1]<5?lowest[0]:null,
      note: lowest[1]<5?pickOf(QCREASONS[lowest[0]]):null});
   });
  }
 }
 return {log,dels};
}
(()=>{const r=makeQCLog(); QCLOG=r.log; DELIVERIES=r.dels;})();

/* ── date ranges ──
   One engine, keyed by a prefix, so Quality and Turnaround can be scoped
   independently — you often want quality over 90 days and turnaround over 7. */
const QPRESETS=[['7','Last 7 days',7],['30','Last 30 days',30],['90','Last 90 days',90],['mtd','This month',null]];
function rangeOf(k){
 const p=SEL[k+'preset']||'30', f=SEL[k+'from'], t=SEL[k+'to'];
 if(p==='custom'&&f&&t) return {from:parseIso(f),to:parseIso(t),label:'custom range',preset:'custom',k};
 if(p==='mtd') return {from:new Date(NOW.getFullYear(),NOW.getMonth(),1),to:NOW,label:'this month',preset:'mtd',k};
 const days=(QPRESETS.find(x=>x[0]===p)||QPRESETS[1])[2];
 return {from:new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-(days-1)),to:NOW,
   label:`last ${days} days`,preset:p,k};
}
const inRange=(d,r)=>d>=new Date(r.from.getFullYear(),r.from.getMonth(),r.from.getDate())
                  && d<=new Date(r.to.getFullYear(),r.to.getMonth(),r.to.getDate(),23,59,59);
function setPreset(k,p){SEL[k+'preset']=p;
 if(p==='custom'){const r=rangeOf(k); SEL[k+'from']=SEL[k+'from']||iso(r.from); SEL[k+'to']=SEL[k+'to']||iso(r.to);}
 go(view);}
function setRangeDate(k,which,v){if(!v)return;
 SEL[k+which]=v; SEL[k+'preset']='custom';
 if(SEL[k+'from']&&SEL[k+'to']&&SEL[k+'from']>SEL[k+'to']){ if(which==='from') SEL[k+'to']=v; else SEL[k+'from']=v; }
 go(view);}

}

S._qc=o=>{

     ${n?`<span class="chip ${lab[2]}">${n} · ${esc(lab[1])}</span>`:''}
     <span style="margin-left:auto;display:flex;gap:4px" role="group" aria-label="Rate ${esc(who(o.a[s]))}">
      ${[1,2,3,4,5].map(i=>`<button aria-label="${i} — ${esc(QCSCALE[i-1][1])}" title="${i} · ${esc(QCSCALE[i-1][1])}"
        ${o.done||!can('qc')?'disabled':`onclick="setStar('${o.id}','${s}',${i})"`}
        style="font-size:19px;line-height:1;color:${i<=n?'var(--warn)':'var(--rail)'};background:none;cursor:${o.done||!can('qc')?'default':'pointer'}">${i<=n?'★':'☆'}</button>`).join('')}
     </span></div>`}).join('')}
  </div>
  <div class="cb" style="padding-top:0">
   <div class="fld"><label for="qcNote">Notes</label>
    <textarea class="inp" id="qcNote" rows="3" placeholder="Enter your notes here..." ${o.done?'disabled':''} onchange="setRateNote('${o.id}',this.value)">${esc(o.done?(o.qcNote||''):(RATENOTE[o.id]||''))}</textarea>
    <div class="hint">One note for the order. A score on its own says how it went; the note says why.</div></div>
  </div>`
  :`<div class="empty"><span class="ei">◔</span><p>Nobody is assigned yet, so there is nothing to rate.</p><button class="btn g sm" onclick="pick('otab','Assignment')">Go to assignment</button></div>`}
  ${worked.length&&!o.done?`<div class="cb" style="border-top:1px solid var(--hair);display:flex;gap:9px;flex-wrap:wrap">
    <button class="btn" ${can('qc')?'':'disabled style="opacity:.45" title="Your account cannot enter ratings"'} onclick="saveRatings('${o.id}')">Save ratings</button>
    <button class="btn g" onclick="logDefect('${o.id}')">Log a defect instead</button>
    <span class="gr" style="font-size:12.5px;margin-left:auto;align-self:center">${rated.length} of ${worked.length} rated</span></div>`:''}
 </div>`;};

/* ══════════ documents ══════════ */
S._docs=o=>`<div class="card">
 <div class="ch"><h2>Documents in the package</h2><div class="r"><button class="btn g sm" onclick="notBuilt('Upload','somewhere to put the file')">Upload</button><button class="btn sm" onclick="addDocRow('${o.id}')">＋ Add</button></div></div>
 <div class="tsc"><div style="min-width:840px">
 <div class="trow h" style="grid-template-columns:1.1fr 120px 130px 150px 130px 150px"><span>Doc type</span><span>Recorded</span><span>Book/Page</span><span>Instrument no</span><span>Image</span><span>Extraction</span></div>
 <div class="tb">
 ${[['Mortgage','12/17/2025','736/935','2025-002688','ok','verified'],
    ['Administrator’s Deed','12/17/2025','736/932','2025-002687','ok','verified'],
    ['Scrivener’s Affidavit','01/14/2026','738/76','2026-000096','ok','review'],
    ['','','','','none','none']]
  .map(d=>`<div class="trow" style="grid-template-columns:1.1fr 120px 130px 150px 130px 150px">
   <div class="cell">${d[0]?`<div class="v">${esc(d[0])}</div>`:`<select class="inp" aria-label="Document type"><option>— choose type —</option><option>Deed</option><option>Mortgage</option><option>Assignment</option><option>Judgment</option><option>Tax</option><option>Plat</option></select>`}</div>
   <div class="cell">${d[1]?`<div class="v mono">${esc(d[1])}</div>`:`<input class="inp mono" aria-label="Recording date" placeholder="MM/DD/YYYY">`}</div>
   <div class="cell">${d[2]?`<div class="v mono">${esc(d[2])}</div>`:`<input class="inp mono" aria-label="Book and page">`}</div>
   <div class="cell">${d[3]?`<div class="v mono">${esc(d[3])}</div>`:`<input class="inp mono" aria-label="Instrument number">`}</div>
   <div class="cell">${d[4]==='ok'?`<button class="btn g sm" onclick="notBuilt('Opening the scan','the original document files')">View</button>`:`<span class="gr" style="font-size:12.5px">no image</span>`}</div>
   <div class="cell">${d[5]==='verified'?chip('Verified','v'):d[5]==='review'?chip('Needs review','r'):`<span class="gr" style="font-size:12.5px">—</span>`}</div>
  </div>`).join('')}
 </div></div></div></div>
 <p class="gr" style="font-size:12.5px;margin-top:12px">An empty row shows <b>no</b> extraction status. A document is only "Verified" once a person has confirmed the reading against the image.</p>`;

/* ══════════ ORDER DETAIL ══════════ */
function openOrder(id){SEL.order=id;SEL.otab='Details';go('order');}
/* Edits on an order stick, and the ones that change the promise say so. */
function setOrder(k,v){
 const o=ORDERS.find(x=>x.id===SEL.order)||ORDERS[0];
 v=String(v);
 if(k==='stt'){ o.stt=v; o.done=v==='sent'; }
 else if(k==='pr'){
   o.pr=v; o.fee=(PRODUCTS.find(p=>p.id===v)||{}).fee??o.fee;
   o.due=new Date(o.recv.getTime()+slaHours(o)*36e5);   // the promise follows the product
 }
 else o[k]=v;
 go(view);
}
S.order=()=>{
 const o=ORDERS.find(x=>x.id===SEL.order)||ORDERS[0];
 if(!o) return gone('order','orders','Orders');
 if(!can('all')&&!Object.values(o.a).includes(ME.id))
  return backTo('My work','mywork')
   +pageHead('Not one of yours',`${esc(meRec().n)} is not on any stage of ${esc(o.id)}.`)
   +`<div class="card p" style="max-width:560px"><p style="font-size:13.5px;margin:0">
     Your account sees the orders you are working. If this one should be yours, whoever runs your department can assign it.</p>
     <div style="margin-top:14px"><button class="btn" onclick="go('mywork')">Back to my queue</button></div></div>`;
 const tab=SEL.otab||'Details';
 const sla=SLA.find(s=>s.cl===o.cl&&s.pr===o.pr)||SLA[SLA.length-1];
 let body='';

 if(tab==='Details') body=`<div class="card p"><div class="lb">Order</div><div class="frm">
   <div class="fld"><label for="o-no">Order no</label><div class="ro mono" id="o-no">${esc(o.id)}</div></div>
   <div class="fld"><label for="o-pr">Product</label>
    <select class="inp" id="o-pr" onchange="setOrder('pr',this.value)">
     ${PRODUCTS.map(p=>`<option value="${esc(p.id)}"${p.id===o.pr?' selected':''}>${esc(p.id)} — ${esc(p.n)}</option>`).join('')}</select>
    <div class="hint">Changing the product re-reads the SLA, so the due date and every stage checkpoint move with it.</div></div>
   <div class="fld"><label for="o-st">Stage</label>
    <select class="inp" id="o-st" onchange="setOrder('stt',this.value)">
     ${Object.keys(STATUS).map(k=>`<option value="${esc(k)}"${k===o.stt?' selected':''}>${esc(st(k))}</option>`).join('')}</select></div>
   <div class="fld"><label for="o-cl">Client</label><div class="ro" id="o-cl">${esc(o.cl)}</div></div>
   <div class="fld"><label for="o-bw">Borrower</label><input class="inp" id="o-bw" value="${esc(o.bw??'Sara Bahorik')}" onchange="setOrder('bw',this.value)"></div>
   <div class="fld"><label for="o-ef">Effective date</label><input class="inp mono" id="o-ef" value="${esc(o.ef??fmtDate(hrs(-24*17)))}" onchange="setOrder('ef',this.value)"></div>
   <div class="fld"><label for="o-oe">Prior effective date</label><input class="inp mono" id="o-oe" value="${esc(o.oe??fmtDate(hrs(-24*380)))}" onchange="setOrder('oe',this.value)"><div class="hint">Update searches run forward from here.</div></div>
   <div class="fld"><label for="o-pi">Parcel ID</label><input class="inp mono" id="o-pi" placeholder="not captured" value="${esc(o.pi??'')}" onchange="setOrder('pi',this.value)"></div>
   ${can('pricing')?`<div class="fld"><label for="o-la">Loan amount</label><input class="inp mono" id="o-la" value="${esc(o.la??'64,804.00')}" onchange="setOrder('la',this.value)"></div>`:''}
   <div class="fld" style="grid-column:1/-1"><label for="o-ad">Property address</label><input class="inp" id="o-ad" value="${esc(o.ad??`${o.prop}, ${o.co} County, ${o.st}`)}" onchange="setOrder('ad',this.value)"></div>
   <div class="fld" style="grid-column:1/-1"><label for="o-nr">Names run</label><input class="inp" id="o-nr" placeholder="each name indexed separately for judgment and lien" value="${esc(o.nr??'')}" onchange="setOrder('nr',this.value)"></div>
  </div></div>
  <div class="card p" style="margin-top:16px"><div class="lb">Turnaround</div>
   <div class="frm">
    <div class="fld"><label>Received</label><div class="ro mono">${fmtDT(o.recv)} ${TZ}</div></div>
    <div class="fld"><label>SLA applied</label><div class="ro">${esc(sla.cl)} × ${esc(sla.pr)} — ${sla.h}h</div></div>
    <div class="fld"><label>Due</label><div class="ro mono" style="color:${o.due<NOW?'var(--bad)':'var(--ink)'}">${fmtDT(o.due)} ${TZ}</div></div>
    <div class="fld"><label>Local time</label><div class="ro mono">${fmtDT(new Date(o.due.getTime()+9.5*3600000))} ${TZ2}</div></div>
   </div>
   ${o.flag?`<div class="bnr r" style="margin:14px 0 0"><span class="bi">◷</span><div><div class="bt">Clock paused</div>${esc(o.flag)}<div class="bs">Time waiting on the client is not counted against the SLA.</div></div></div>`:''}
  </div>
  ${(()=>{const p=orderPlan(o);
   return `<div class="card p" style="margin-top:16px"><div class="lb">Stage checkpoints</div>
   <p class="gr" style="font-size:12.5px;margin:6px 0 14px">The ${p.slaH}-hour promise divided between the departments. Each row is the latest that stage can finish and still leave the rest of the pipeline the time it needs.</p>
   ${p.doomed?`<div class="bnr r" style="margin:0 0 14px"><span class="bi">⚑</span><div>
     <div class="bt">This order cannot be delivered on time</div>
     The stages still to run need <b>${hh(p.needs)}</b> of work and only <b>${p.remaining>0?hh(p.remaining):'no time'}</b> remains — short by <b>${hh(p.short)}</b>.
     <div class="bs">Tell the client now, or move it to someone who can compress the remaining stages. Waiting does not make this better.</div></div></div>`
    :p.behind?`<div class="bnr r" style="margin:0 0 14px"><span class="bi">◷</span><div>
     <div class="bt">Behind its internal checkpoint</div>
     Still deliverable — ${hh(p.remaining)} left against ${hh(p.needs)} of remaining work — but the slack is being spent.</div></div>`
    :''}
   <div class="rows" style="border:none;border-radius:0">
   ${p.rows.map(r=>`<div class="rw">
     <span class="${r.done?'ok':r.behind?'bad':r.current?'warn':'gr'}" style="font-size:14.5px">${r.done?'\u2713':r.behind?'\u2691':r.current?'\u25f7':'\u00b7'}</span>
     <span><b>${esc(r.stage)}</b>
      <div class="sd">${r.done?'done':r.behind?`overdue \u2014 should have finished by ${fmtDT(r.at)} ${TZ}`
        :r.current?`in progress \u2014 due by ${fmtDT(r.at)} ${TZ}`:`by ${fmtDT(r.at)} ${TZ}`}</div></span>
     <span class="mono gr" style="font-size:11.5px">${r.pct}% \u00b7 ${hh(r.hours)}</span></div>`).join('')}
   <div class="rw"><span class="gr">\u00b7</span><span><b class="gr">Buffer</b>
     <div class="sd">${hh(p.slaH*BUDGET.buffer/100)} of slack before the client deadline at ${fmtDT(o.due)} ${TZ}</div></span>
     <span class="mono gr" style="font-size:11.5px">${BUDGET.buffer}%</span></div>
   </div>
   <p class="gr" style="font-size:12.5px;margin-top:12px">Set under <button class="lnk" onclick="go('sla')">Turnaround &amp; SLA \u2192 Stage budgets</button>.</p></div>`;})()}`;

 else if(tab==='Assignment') body=`<div class="card">
   <div class="ch"><h2>Who owns each stage</h2><div class="r"><button class="btn g sm" onclick="assignAll('${o.id}')">Assign all</button></div></div>
   <div class="rows" style="border:none;border-radius:0">
   ${STAGES.map(s=>{const a=o.a[s];const p=STAFF.find(x=>x.id===a);
    const clash=p&&p.conflict&&(s==='Typing'||s==='Typing QC');
    return `<div class="rw"><span>${a?`<button class="ava ${clash?'self':''}" title="Open ${esc(who(a))}" onclick="openPerson('${a}')">${initials(who(a))}</button>`:'<span class="ava none">·</span>'}</span>
    <span><b>${esc(s)}</b><div class="sd">${a?`<button class="lnk" onclick="openPerson('${a}')">${esc(who(a))}</button>`:'Unassigned'}${clash?' · <span class="bad">also assigned to the paired QC stage</span>':''}</div></span>
    <span><select class="inp" style="min-width:170px" aria-label="Assign ${esc(s)}" onchange="assignStage('${o.id}','${esc(s)}',this.value)">
      <option value="">${a?esc(who(a)):'— choose —'}</option>
      ${STAFF.filter(x=>x.dep.includes(s)&&x.id!==a&&x.active!==false).map(x=>`<option value="${x.id}">${esc(x.n)}${x.avail!=='ok'?` (${esc(AVAIL[x.avail][0].toLowerCase())})`:''}${PAIRS[s]&&o.a[PAIRS[s]]===x.id?' — did the '+esc(PAIRS[s]):''}</option>`).join('')}
      ${a?`<option value="__clear">— unassign —</option>`:''}</select></span></div>`}).join('')}
   </div></div>
  <div class="bnr b" style="margin-top:16px"><span class="bi">⚑</span><div><div class="bt">Self-review is blocked</div>
   A person cannot QC a stage they performed. Ashok S sits in both Typing and Typing QC, so he is filtered out of the QC list on any order he typed.
   <div class="bs">Configured under Quality → Segregation of duties.</div></div></div>`;

 else if(tab==='Quality') body=S._qc(o);
 else if(tab==='Documents') body=S._docs(o);
 else if(tab==='Costs') body=`<div class="card">
   <div class="ch"><h2>Pass-through costs</h2><div class="r"><button class="btn sm" onclick="addCost('${o.id}')">＋ Add cost</button></div></div>
   <div class="cb"><div class="frm">
    <div class="fld"><label for="c-dt">Date</label><input class="inp mono" id="c-dt" value="${fmtDate(NOW)}"></div>
    <div class="fld"><label for="c-us">Paid by</label><div class="ro" id="c-us">Harry Whitfield</div></div>
    <div class="fld"><label for="c-ty">Type</label><select class="inp" id="c-ty"><option>Copy fee</option><option>Certified copy</option><option>Courthouse access</option><option>Municipal search</option></select></div>
    <div class="fld"><label for="c-am">Amount</label><input class="inp mono" id="c-am" value="0.00"></div>
   </div></div>
   <div class="tsc"><div style="min-width:520px">
   <div class="trow h" style="grid-template-columns:110px 1fr 150px 110px"><span>Date</span><span>Type</span><span>Paid by</span><span>Amount</span></div>
   <div class="tb"><div class="trow" style="grid-template-columns:110px 1fr 150px 110px">
    <div class="cell"><div class="v mono">${fmtDate(hrs(-20))}</div></div>
    <div class="cell"><div class="v">Copy fee — 3 instruments</div></div>
    <div class="cell"><div class="v">Uma Sankar</div></div>
    <div class="cell"><div class="v mono">${money(6.5)}</div></div></div></div>
   </div></div>
   <div class="cb" style="border-top:1px solid var(--hair);display:flex;gap:12px;flex-wrap:wrap">
    <span class="gr" style="font-size:12.5px">Search fee ${money(o.fee)} + costs ${money(6.5)} =</span><b class="mono">${money(o.fee+6.5)}</b>
    <span class="gr" style="font-size:12.5px;margin-left:auto">Costs are reimbursed at cost — no margin applied.</span></div>
  </div>`;
 else if(tab==='History') body=`<div class="card">
   <div class="ch"><h2>Activity log</h2><div class="r">${chip('Append-only','v')}</div></div>
   <div class="rows" style="border:none;border-radius:0">
   ${[[fmtDT(o.recv),'Order created from email','system','CSSWV-635007 · Update Search Order.pdf'],
      [fmtDT(hrs(-29)),'Due date set','system',`SLA ${sla.cl} × ${sla.pr} = ${sla.h}h → ${fmtDT(o.due)} ${TZ}`],
      [fmtDT(hrs(-28)),'Assigned · Search','Harry Whitfield',o.a.Search?who(o.a.Search):'—'],
      [fmtDT(hrs(-12)),'Stage changed','Uma Sankar',`Search → ${st(o.stt)}`],
      [fmtDT(hrs(-6)),'Field edited','Uma Sankar','Loan amount 64,084.00 → 64,804.00']]
    .map(r=>`<div class="rw"><span class="gr">·</span><span><b>${esc(r[1])}</b><div class="sd">${esc(r[3])}</div></span>
     <span style="text-align:right"><div class="mono gr" style="font-size:11.5px">${esc(r[0])}</div><div class="sd">${esc(r[2])}</div></span></div>`).join('')}
   </div></div>
  <p class="gr" style="font-size:12.5px;margin-top:12px">Every create, status change, assignment, field edit, QC rating and delivery is recorded with who and when. This is the record that answers an insurer.</p>`;
 else if(tab==='Notes') body=`<div class="card">
   <div class="ch"><h2>Internal notes</h2></div>
   <div class="cb"><textarea class="inp" id="ordNote" placeholder="Add a note — visible to your team only" aria-label="Add a note"></textarea>
    <div style="margin-top:10px"><button class="btn sm" onclick="addOrderNote('${o.id}')">Add note</button></div></div>
   <div class="rows" style="border:none;border-radius:0">
    <div class="rw"><span class="ava">VS</span><span><b>Vikki Sankar</b><div class="sd">Doc req raised — deed referenced in the mortgage isn't imaged in the package.</div></span>
     <span class="gr mono" style="font-size:11.5px">${fmtDT(hrs(-11))}</span></div>
   </div></div>`;
 else {
  const cy=findCounty(o.co,o.st);
  body=`<div class="card p"><div class="lb">County research links — ${esc(o.co)}, ${esc(o.st)}</div>
   ${cy?`<div class="frm">
   ${LINKTYPES.map(t=>{const l=cy.links[t.k]||{u:'',s:'none'};
     return `<div class="fld"><label>${esc(t.n)} ${l.s==='ok'?'':`<span class="chip ${LSTATE[l.s][1]}" style="font-size:9.5px;padding:1px 7px;margin-left:4px">${esc(LSTATE[l.s][0])}</span>`}</label>
      ${l.u?`<div class="ro ${BADSTATES.includes(l.s)?'warn':''}" style="font-size:11.5px;overflow-wrap:anywhere">${esc(l.u)}</div>`
        :`<div class="ro warn">Not on file</div>`}
      ${l.err?`<div class="hint bad">${esc(l.err)} — ${l.since?days(l.since)+' days':'recently'}</div>`:''}</div>`}).join('')}
   </div>
   ${LINKTYPES.some(t=>{const l=cy.links[t.k]||{};return BADSTATES.includes(l.s)||l.s==='none';})
    ?`<div class="bnr r" style="margin:16px 0 0"><span class="bi">⚑</span><div>
      <div class="bt">The searcher is short of at least one link here</div>
      Checked every ${LINKCHECK.every} days; last run ${days(LINKCHECK.last)===0?'today':days(LINKCHECK.last)+' days ago'}.</div>
      <div class="ba"><button class="btn g sm" onclick="go('linkcheck')">Link monitor</button></div></div>`
    :`<p class="ok" style="font-size:12.5px;margin-top:12px">All ${LINKTYPES.length} links working as of the last check.</p>`}`
   :`<div class="empty"><span class="ei">◈</span><p>${esc(o.co)}, ${esc(o.st)} is not in your county record, so the searcher has no links for it.</p>
     <button class="btn g sm" onclick="go('counties')">Add the county</button></div>`}
  </div>`;
 }

 return backTo('Orders','orders')
 +pageHead(o.prop,`${o.id} · ${o.cl} · ${o.pr} · ${o.co} County, ${o.st}`,
   `${chip(st(o.stt),o.due<NOW&&!o.done?'d':'b')}${o.due<NOW&&!o.done?`<span class="due late" style="margin-left:4px">${Math.abs(Math.round((o.due-NOW)/3600000))}h overdue</span>`:''}
    <button class="btn g" onclick="go('repgen')">Open report</button><button class="btn" onclick="toast('Saved')">Save</button>`)
 +tabbar(['Details','Assignment','Quality','Documents','Costs','History','Notes','County links'],'otab',tab)
 +body;
};

boot();
</script>
