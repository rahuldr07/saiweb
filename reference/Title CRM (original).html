function setShare(pr,st,v){ _cpCache={};
 const n=Math.max(0,Math.min(100,parseFloat(v)||0));
 const sh=pr==='base'?BUDGET.base:(BUDGET.over.find(x=>x.pr===pr)||{shares:{}}).shares;
 sh[st]=n; go('sla');
}
function setBuffer(v){ _cpCache={};BUDGET.buffer=Math.max(0,Math.min(50,parseFloat(v)||0)); go('sla');}
function addOverride(){
 const free=PRODUCTS.filter(p=>!BUDGET.over.some(o=>o.pr===p.id));
 if(!free.length) return openModal('Every product already has its own split',
   `<p style="font-size:13.5px">There is nothing left to override. Remove one first if you want to start it again.</p>`,
   `<button class="btn" onclick="closeModal()">Close</button>`);
 openModal('Give a product its own split',

   <div id="ovErr"></div>`,
  `<button class="btn g" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOverride()">Create it</button>`);
}
function saveOverride(){
 const pr=document.getElementById('ovPr').value;
 /* Pushing a second override for the same product left two rows claiming to
    govern it, and the engine reading whichever came first. */
 if(BUDGET.over.some(x=>x.pr===pr)){
  const e=document.getElementById('ovErr');
  if(e) e.innerHTML=`<div class="bnr r" style="margin:12px 0 0"><span class="bi">⚠</span><div>
    <b>${esc(pr)} already has its own split.</b> Edit that one rather than adding a second — two rows for one product means the engine reads whichever it finds first.</div></div>`;
  return;
 }
 BUDGET.over.push({pr,shares:{...BUDGET.base}});
 closeModal(); SEL.bpr=pr; toast(`${pr} now has its own split`); go('sla');
}
function removeOverride(pr){
 BUDGET.over.splice(BUDGET.over.findIndex(x=>x.pr===pr),1);
 SEL.bpr='base'; go('sla');
}

function moveStatus(k,d){
 const keys=Object.keys(STATUS), i=keys.indexOf(k), j=i+d;
 if(i<0||j<0||j>=keys.length) return;
 keys.splice(j,0,keys.splice(i,1)[0]);
 const next={}; keys.forEach(x=>next[x]=STATUS[x]); STATUS=next;
 go(view);
}

 openModal(k?`Edit ${cur[0]}`:'Add a status',

   <div id="stErr"></div>`,

 if(Object.entries(STATUS).some(([x,v])=>x!==k&&v[0].toLowerCase()===n.toLowerCase()))

/* One person's ratings, and the reasons behind them. The question this answers is
   "why", so the defects and their notes come first and the averages come second. */
function qcStaffDetail(name,allRows,r,teamAvg,people,TW){
 const mine=allRows.filter(x=>x.onName===name).sort((a,b)=>b.d-a.d);
 const me=people.find(p=>p.n===name);
 const back=`<button class="btn g sm" style="margin-bottom:14px" onclick="closeQCStaff()">← Everyone</button>`;
 if(!mine.length) return back+`<div class="empty" style="padding:40px 10px"><span class="ei">★</span>
   <p><b>${esc(name)}</b> has no ratings in this range.</p>
   <p class="gr" style="font-size:12.5px">Widen the range, or check whether their work is being rated at all.</p></div>`;

 const staff=STAFF.find(x=>x.n===name);
 const dist=[5,4,3,2,1].map(v=>({v,n:mine.filter(x=>[x.acc,x.comp,x.fmt].includes(v)).length}));
 const marks=mine.length*3;
 const defects=mine.filter(x=>x.defect);
 const below=mine.filter(x=>x.crit);                       // anything short of a clean 5
 const crit=['Accuracy','Completeness','Formatting'].map(c=>({c,
   n:below.filter(x=>x.crit===c).length,
   avg:mine.reduce((a,x)=>a+x[{Accuracy:'acc',Completeness:'comp',Formatting:'fmt'}[c]],0)/mine.length}))
   .sort((a,b)=>b.n-a.n);
 /* the recurring reason matters more than any single one */
 const reasons={}; below.forEach(x=>{reasons[x.note]=(reasons[x.note]||0)+1;});
 const topReasons=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
 const raters={}; mine.forEach(x=>{const k=x.byName; (raters[k]=raters[k]||{n:k,c:0,s:0}); raters[k].c++; raters[k].s+=x.avg;});

function qcFocus(f,name,mine,defects,t,r){
 if(f==='defects'){
  const list=defects.slice().sort((a,b)=>b.d-a.d);
  const byCrit={}; list.forEach(x=>{const worst=[['Accuracy',x.acc],['Completeness',x.comp],['Formatting',x.fmt]]

  return `<h2 class="sec">What the ${list.length} defect${list.length===1?'':'s'} were</h2>
  ${Object.keys(byCrit).length?`<div class="card p" style="margin-bottom:14px"><div class="lb">By criterion</div>
   <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:9px">
    ${Object.entries(byCrit).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span class="chip ${n>1?'d':'r'}">${esc(c)} · ${n}</span>`).join('')}</div></div>`:''}
  <div class="card" id="qcRatings"><div class="tb">
  ${list.map(x=>{
    const marks=[['Accuracy',x.acc,'acc'],['Completeness',x.comp,'comp'],['Formatting',x.fmt,'fmt']];
    const failed=marks.filter(m=>m[1]<=3);
    return `<div class="trow" style="grid-template-columns:1fr;padding:15px 16px">
     <div class="cell" style="display:block">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">

       <div style="flex:1;min-width:260px">

        <div class="gr" style="font-size:12.5px">
         ${failed.map(m=>`<b class="${m[1]<=2?'bad':'warn'}">${esc(m[0])} scored ${m[1]} — ${esc((QCSCALE.find(q=>q[0]===m[1])||[])[1]||'')}</b>`).join(' · ')}
        </div>
       </div>
       <div style="text-align:right;min-width:210px">
        <div class="mono" style="font-size:12.5px">${esc(x.order)}</div>
        <div class="gr" style="font-size:11.5px">${esc(x.cl)} · ${esc(x.pr)} · ${esc(x.stage)}</div>

      </div>
     </div></div>`}).join('')}
  </div></div>
  <p class="gr" style="font-size:12.5px;margin-top:10px">A defect is any criterion scored 3 or below. The bold line is what the rater wrote — that, not the number, is the thing worth acting on.</p>`;
 }

 const items=(f==='over'?t.items.filter(x=>x.over):t.items.filter(x=>x.over&&x.d.late)).sort((a,b)=>b.ratio-a.ratio);
 return `<h2 class="sec">${f==='over'?`The ${items.length} stage${items.length===1?'':'s'} that went over budget`

let PREFIX={};
const prefixesOf=c=>PREFIX[c.n]||(PREFIX[c.n]=[c.dn+'MI-',c.dn+'PA-',c.dn+'FL-',c.dn+'WV-']);
function addPrefix(cn){
 const c=CLIENTS.find(x=>x.n===cn); if(!c) return;
 openModal(`Add a prefix for ${cn}`,
  `<div class="fld"><label for="pfx">Prefix</label>
    <input class="inp mono" id="pfx" placeholder="${esc(c.dn)}OH-" value="${esc(c.dn)}">
    <div class="hint">Any incoming order number starting with this resolves to ${esc(cn)}. Keep them distinct — an ambiguous prefix routes mail to the wrong client silently.</div></div>
   <div id="pfxErr"></div>`,
  `<button class="btn g" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePrefix('${esc(cn)}')">Add</button>`);
}
function savePrefix(cn){
 const v=document.getElementById('pfx').value.trim();
 const err=document.getElementById('pfxErr');
 if(!v) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>A prefix cannot be empty.</div></div>`;
 const clash=Object.entries(PREFIX).find(([n,l])=>l.some(p=>p===v||p.startsWith(v)||v.startsWith(p)));
 if(clash) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>
   <b>${esc(v)} overlaps a prefix already used by ${esc(clash[0])}.</b> Overlapping prefixes route mail to whichever matches first, which is not a decision anyone made.</div></div>`;
 prefixesOf(CLIENTS.find(x=>x.n===cn)).push(v);
 closeModal(); go(view);
}
function removePrefix(cn,p){
 const list=prefixesOf(CLIENTS.find(x=>x.n===cn));

 toast(`${p} removed — mail with that prefix now needs matching by hand`); go(view);
}

function clientErr(m){const e=document.getElementById('c-err');
 if(e)e.innerHTML=`<div class="bnr d" style="margin-bottom:14px"><span class="bi">⚑</span><div style="font-size:12.5px">${esc(m)}</div></div>`;}
function saveClient(name){
 const n=val('c-n'), dn=val('c-dn').toUpperCase(), e=val('c-e'), p=val('c-p');
 if(!n){ clientErr('A client name is required.'); const x=document.getElementById('c-n'); if(x)x.focus(); return; }
 if(!dn){ clientErr('A short code is required — it is what appears on orders.'); const x=document.getElementById('c-dn'); if(x)x.focus(); return; }
 if(!/^[A-Z0-9]{2,6}$/.test(dn)){ clientErr('The code should be 2–6 letters or numbers, no spaces.'); return; }
 if(CLIENTS.some(c=>c.n!==name&&c.n.toLowerCase()===n.toLowerCase())){ clientErr(`There is already a client called ${n}.`); return; }
 if(CLIENTS.some(c=>c.n!==name&&c.dn===dn)){ clientErr(`${dn} is already used by ${CLIENTS.find(c=>c.dn===dn).n}.`); return; }
 if(e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ clientErr('That email does not look right.'); return; }
 const terms=val('c-t')||'Net 30', active=val('c-a')!=='0';
 const rec=CLIENTS.find(x=>x.n===name);
 if(rec){ const old=rec.n; Object.assign(rec,{n,dn,e,p,terms,active});
  if(old!==n){ INVOICES.forEach(i=>{if(i.cl===old)i.cl=n;}); if(SEL.client===old)SEL.client=n; if(SEL.ivc===old)SEL.ivc=n; } }
 else CLIENTS.push({n,dn,e,p,terms,active,orders:0,inv:0,total:0,paid:0});
 recompute(); closeModal(); go(name?'client':'clients');
}
function removeClient(name){
 const c=CLIENTS.find(x=>x.n===name); if(!c) return;
 openModal(`Remove ${c.n}?`,
  `<p style="font-size:13.5px">${c.orders
    ? `They have <b>${c.orders.toLocaleString()} orders</b> and <b>${money(c.total)}</b> invoiced. Removing them takes that history with them.`
    : 'They have no orders or invoices.'}</p>
   <div class="bnr r" style="margin-top:14px"><span class="bi">⚑</span><div style="font-size:12.5px">
    <div class="bt" style="font-size:12.5px">Marking them inactive is usually better</div>
    An inactive client takes no new orders but keeps every order, invoice and report already on file.</div></div>`,
  `<button class="btn g" onclick="closeModal()">Cancel</button>
   <button class="btn g" onclick="deactivateClient('${esc(name)}')">Mark inactive</button>
   <button class="btn d" onclick="reallyRemoveClient('${esc(name)}')">Remove anyway</button>`);
}
function deactivateClient(name){const c=CLIENTS.find(x=>x.n===name); if(c)c.active=false; recompute(); closeModal(); go('clients');}
function reallyRemoveClient(name){
 const i=CLIENTS.findIndex(x=>x.n===name); if(i>=0)CLIENTS.splice(i,1);
 INVOICES=INVOICES.filter(x=>x.cl!==name);
 if(SEL.ivc===name)SEL.ivc='all';
 recompute(); closeModal(); go('clients');
}

function createLead(){
 const f=Object.assign(nlDefaults(),SEL.nl||{});
 if(!f.co.trim()){ SEL.nlErr='A company name is required.'; go('newlead'); return; }
 if(!f.cn.trim()&&!f.ce.trim()){ SEL.nlErr='Give at least a name or an email — otherwise there is nobody to contact.'; go('newlead'); return; }
 if(f.ce.trim()&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.ce.trim())){ SEL.nlErr='That email does not look right.'; go('newlead'); return; }
 if(!f.note.trim()){ SEL.nlErr='Write a first note — it is what the follow-up clock runs from.'; go('newlead'); return; }
 const id=newLeadId();
 LEADS.unshift({id,co:f.co.trim(),loc:f.loc.trim()||'—',st:f.st,own:f.own,flag:f.flag==='1'||f.flag===true,
  contacts:[{n:f.cn.trim()||'—',role:f.crole.trim()||'Contact',e:f.ce.trim(),p:f.cp.trim(),main:true}],
  notes:[{w:f.own,at:new Date(NOW),t:f.note.trim()}]});
 SEL.nl=null;SEL.nlErr=null;
 openLead(id);
}

function makeLeave(){

 STAFF.filter(p=>p.dep.length).forEach(p=>{

     by:st==='pending'?null:hpick(STAFF.filter(x=>x.r!=='staff')).n,
     at:past?from:null});

 });
 return out.sort((a,b)=>b.from-a.from);

/* A balance is earned minus taken, never a number somebody typed. */
function leaveBalance(pid){
 const out={};
 LEAVETYPES.forEach(t=>{
  const taken=LEAVE.filter(l=>l.who===pid&&l.type===t.k&&l.st==='approved').reduce((a,l)=>a+l.days,0);
  const pending=LEAVE.filter(l=>l.who===pid&&l.type===t.k&&l.st==='pending').reduce((a,l)=>a+l.days,0);
  const earned=t.k==='co'?LEAVE.filter(l=>l.who===pid&&l.type==='co').length+2
    :Math.round(t.annual*(NOW.getMonth()+1)/12);
  out[t.k]={earned,taken,pending,left:Math.max(0,earned-taken-pending),annual:t.annual};
 });
 return out;
}

/* Who else from the same department is off across these dates. A department of two
   losing both people is the failure this is here to prevent. */
function clashesWith(pid,from,to){
 const p=STAFF.find(x=>x.id===pid); if(!p) return [];
 return LEAVE.filter(l=>l.who!==pid&&['approved','pending'].includes(l.st)
   &&overlaps(from,to,l.from,l.to)
   &&(STAFF.find(x=>x.id===l.who)||{dep:[]}).dep.some(d=>p.dep.includes(d)));
}
function deptCover(pid,from,to){
 const p=STAFF.find(x=>x.id===pid); if(!p||!p.dep.length) return null;
 const d=p.dep[0];
 const team=STAFF.filter(x=>x.dep.includes(d)&&x.active!==false);
 const off=team.filter(x=>x.id===pid||LEAVE.some(l=>l.who===x.id
   &&['approved','pending'].includes(l.st)&&overlaps(from,to,l.from,l.to)));
 return {dep:d,team:team.length,off:off.length,left:team.length-off.length};
}

/* ══════════ LATE LOGINS ══════════
   A late mark is a fact, not an accusation. The shift start is known, the punch
   is timestamped, and anything past the grace period is recorded — with room to
   waive it, because a late mark that cannot be explained is one people learn to
   work around rather than fix. */
let LATELOG=[];
const LATEREASONS=['Power cut at home','Traffic — Outer Ring Road','Network down, could not punch',
 'Cab did not arrive','Unwell in the morning','Handover ran past midnight',null,null,null,null];
function makeLateLog(){
 let s=20260311; const r=()=>{s=(s*1664525+1013904223)%4294967296; return s/4294967296;};
 const out=[], list=STAFF.filter(p=>p.dep.length&&p.active!==false);
 for(let back=29;back>=0;back--){
  const d=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-back);
  if(d.getDay()===0) continue;
  if(HOLIDAYS.some(x=>x.d===fmtDate(d)&&!x.opt)) continue;
  list.forEach(p=>{
   if(r()>0.11) return;
   const sh=shiftOf(p);
   const late=3+Math.floor(r()*74);
   if(late<=TIMECFG.lateGraceMins) return;
   const at=mins(sh.from)+late;
   out.push({id:'LT'+out.length, who:p.id, d, dk:fmtDate(d), shift:sh.n, due:sh.from,
     at:pad(Math.floor(at/60)%24)+':'+pad(at%60), mins:late,
     why:LATEREASONS[Math.floor(r()*LATEREASONS.length)], waived:false});
  });
 }
 return out.sort((a,b)=>b.d-a.d);
}

  <div class="two" style="margin-top:18px">

      const led2=pettyLedger().filter(e=>e.d<=x.d);
      const should=led2.length?led2[led2.length-1].after:0;

      return `<div class="rw" style="padding:9px 0"><span class="${diff===0?'ok':'bad'}" style="font-size:14.5px">${diff===0?'✓':'⚑'}</span>

      ${['week','month'].map(x=>`<option${PETTYCFG.countEvery===x?' selected':''}>${x}</option>`).join('')}</select></div>
   </div>
  </div>`;
};
function setPetty(k,v){
 if(typeof PETTYCFG[k]==='number'){const n=parseFloat(v); if(!(n>0)) return go(view); PETTYCFG[k]=n;}
 else {v=String(v).trim(); if(!v) return go(view); PETTYCFG[k]=v;}
 go(view);
}
function addPetty(){
 openModal('Petty cash entry',
  `<div class="frm">
    <div class="fld"><label for="pe-k">Money in or out</label>
     <select class="inp" id="pe-k" onchange="pettyPreview()">

    <div class="fld"><label for="pe-a">Amount</label>
     <input class="inp mono" id="pe-a" type="number" min="1" step="1" placeholder="1240" onchange="pettyPreview()" oninput="pettyPreview()"></div>
   </div>
   <div class="fld"><label for="pe-w">What for</label><input class="inp" id="pe-w" placeholder="County copy fees — Cambria"></div>
   <div class="frm">
    <div class="fld"><label for="pe-b">Who took it</label>
     <select class="inp" id="pe-b">${STAFF.filter(x=>x.active!==false).map(x=>`<option>${esc(x.n)}</option>`).join('')}</select></div>
    <div class="fld"><label for="pe-r">Receipt or voucher number</label><input class="inp mono" id="pe-r" placeholder="CM-8841"></div>
   </div>
   <div id="pe-p"></div><div id="pe-err"></div>`,

function pettyPreview(){
 const el=document.getElementById('pe-p'); if(!el) return;
 const kind=document.getElementById('pe-k').value;
 const amt=parseFloat(document.getElementById('pe-a').value)||0;
 const bal=pettyBalance(), after=kind==='credit'?bal+amt:bal-amt;
 el.innerHTML=`<div class="rw" style="background:var(--tint);border-radius:9px;padding:12px 14px;margin-top:6px">
   <span class="gr">=</span>
   <span><b>${inr(bal)} ${kind==='credit'?'+':'−'} ${inr(amt)} = ${inr(after)}</b>
    <div class="sd gr">The balance after this entry. Worked out here so it is never carried in anyone's head.</div></span><span></span></div>`
  +(after<0?`<div class="bnr d" style="margin:10px 0 0"><span class="bi">⚑</span><div>
     <b>That would take the box below zero.</b> Either the float needs topping up first, or an earlier entry is wrong.</div></div>`:'')
  +(kind==='debit'&&amt>PETTYCFG.limit?`<div class="bnr r" style="margin:10px 0 0"><span class="bi">⚠</span><div>
     Above the ${inr(PETTYCFG.limit)} cash ceiling. This should go by bank transfer against an invoice, so there is a second record of it.</div></div>`:'');
}
function savePetty(){
 const kind=document.getElementById('pe-k').value;
 const amt=parseFloat(document.getElementById('pe-a').value)||0;
 const what=document.getElementById('pe-w').value.trim();
 const ref=document.getElementById('pe-r').value.trim();
 const err=document.getElementById('pe-err');
 if(!(amt>0)||!what) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>An amount and what it was for.</div></div>`;
 if(kind==='debit'&&pettyBalance()-amt<0) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>The box does not hold that much. Record the top-up first.</div></div>`;
 if(kind==='debit'&&!ref) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>
   <b>A receipt or voucher number.</b> Cash out with nothing to show for it is the entry nobody can explain three months later. If there genuinely is no receipt, write "none" and it will be flagged rather than hidden.</div></div>`;
 PETTY.push({id:'P'+(PETTY.length+1),d:NOW,kind,what,amt,
   by:document.getElementById('pe-b').value,ref:ref||'—',
   receipt:!!ref&&ref.toLowerCase()!=='none'});
 closeModal(); toast(`Recorded — balance ${inr(pettyBalance())}`); go(view);
}
function openCount(){
 const should=pettyBalance();
 openModal('Count the box',
  `<p style="font-size:13.5px">Count the cash physically, then type what is actually there. <b>Do not look at the ledger figure first</b> — a count that starts from the expected number is not a count.</p>
   <div class="fld"><label for="ct-a">Counted</label>
    <input class="inp mono" id="ct-a" type="number" min="0" placeholder="0" oninput="countPreview(${should})"></div>
   <div class="fld"><label for="ct-n">Note</label><input class="inp" id="ct-n" placeholder="Anything worth recording"></div>
   <div id="ct-p"></div>`,
  `<button class="btn g" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveCount(${should})">Record the count</button>`);
}
function countPreview(should){
 const el=document.getElementById('ct-p'); if(!el) return;
 const v=parseFloat(document.getElementById('ct-a').value);
 if(!isFinite(v)) return el.innerHTML='';
 const d=v-should;
 el.innerHTML = d===0
  ? `<div class="bnr v" style="margin:0"><span class="bi">✓</span><div>Matches the ledger exactly at ${inr(should)}.</div></div>`
  : `<div class="bnr d" style="margin:0"><span class="bi">⚑</span><div>
     <b>${d>0?'Over':'Short'} by ${inr(Math.abs(d))}</b> — the ledger says ${inr(should)}, you counted ${inr(v)}.
     Record it as counted. Correcting the count to match the book is how a discrepancy becomes permanent.</div></div>`;
}
function saveCount(should){
 const v=parseFloat(document.getElementById('ct-a').value);
 if(!isFinite(v)||v<0) return;
 COUNTS.unshift({id:'C'+(COUNTS.length+1),d:NOW,by:meRec().n,counted:v,
   note:document.getElementById('ct-n').value.trim()||(v===should?'Matched.':'Difference not yet explained.')});
 closeModal(); toast(v===should?'Counted — matches':'Counted — difference recorded'); go(view);
}
function exportPetty(){
 downloadCSV(`petty-cash-${dstamp()}.csv`,
  [['Date','What for','Who','Credit','Debit','Balance before','Balance after','Voucher','Receipt held'],

     e.kind==='credit'?e.amt:'',e.kind==='debit'?e.amt:'',e.before,e.after,e.ref,e.receipt?'yes':'no'])]);
}

/* ══════════ PAYROLL RUN ══════════

const payMonth=()=>PAYMONTHS.includes(SEL.pm)?SEL.pm:PAYMONTHS[PAYMONTHS.length-1];
function payTotals(mn){
 const list=paidStaff().map(p=>payslipOf(p,mn));
 return {list,
  gross:list.reduce((a,x)=>a+x.gross,0), ded:list.reduce((a,x)=>a+x.totalDed,0),
  net:list.reduce((a,x)=>a+x.net,0), pf:list.reduce((a,x)=>a+x.epf,0),
  erpf:list.reduce((a,x)=>a+x.st.epfEr,0), esi:list.reduce((a,x)=>a+x.esi,0),
  pt:list.reduce((a,x)=>a+x.pt,0), tds:list.reduce((a,x)=>a+x.tds,0),
  lop:list.filter(x=>x.a.lop>0)};
}

function lockRun(mn){

 openModal(`Lock attendance for ${mn}?`,
  `<p style="font-size:13.5px">Attendance is frozen at today's figures. Payroll is then computed against a fixed set of numbers rather than a moving one.</p>

     <b>${noCtc.length} active ${noCtc.length===1?'person has':'people have'} no salary set</b> and will not be paid at all this month.
     Locking does not stop you fixing that, but it is easier to fix now.</div></div>`:''}
   <p class="gr" style="font-size:12.5px;margin-top:12px">${t.list.length} people · gross ${inr(t.gross)} · net ${inr(t.net)}.</p>`,
  `<button class="btn g" onclick="closeModal()">Not yet</button>

function approveRun(mn){

function doApprove(mn){

  `<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>Type <b>${esc(meRec().n)}</b> exactly. Approving payroll should take a deliberate act.</div></div>`;
 PAYRUNS[mn].by=meRec().n; PAYRUNS[mn].at=fmtDate(NOW);

function publishRun(mn){

  `<p style="font-size:13.5px">Every person on the run can see their ${esc(mn)} payslip from their own account, immediately.</p>
   <p class="gr" style="font-size:12.5px">The bank file becomes available at the same time — ${inr(t.net)} across ${t.list.length} accounts, drawn on ${esc(PAYCFG.bankName)}.</p>`,

function openPayslip(id,mn){SEL.psId=id; SEL.psM=mn; go('payslip');}
const words=n=>{ /* amount in words, the way an Indian payslip states it */
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>x>99?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
 n=Math.round(n); if(!n) return 'Zero';
 const cr=Math.floor(n/10000000), lk=Math.floor(n%10000000/100000), th=Math.floor(n%100000/1000), rest=n%1000;
 return [cr?three(cr)+' Crore':'',lk?three(lk)+' Lakh':'',th?three(th)+' Thousand':'',rest?three(rest):'']
   .filter(Boolean).join(' ')+' Only';
};

const metres=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180;
 const dLat=t(c-a),dLng=t(d-b);
 const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLng/2)**2;
 return Math.round(2*R*Math.asin(Math.sqrt(h)));};

/* The browser can genuinely tell us where it is. It cannot tell us whose face
   this is, which is why one of these is real and the other is a note. */
function withLocation(then){
 if(!navigator.geolocation) return then(null,'This device cannot report a location');
 let done=false;
 const finish=(pos,err)=>{ if(done) return; done=true; then(pos,err); };
 setTimeout(()=>finish(null,'Location took too long'),4000);
 try{
  navigator.geolocation.getCurrentPosition(
   pos=>finish({lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)},null),
   err=>finish(null,err&&err.code===1?'Location permission was refused':'Location unavailable'),
   {enableHighAccuracy:true,timeout:3500,maximumAge:60000});
 }catch(e){ finish(null,'Location unavailable'); }
}
function punch(kind,loc,err){

 const inside=!!(near&&near.d<=near.s.radius);
 if(kind==='in'){
  const late=mins(now)-mins(sh.from);
  TODAYMARK[p.id]={in:now,out:null,late:late>TIMECFG.lateGraceMins?late:0,shift:sh.k,where,inside,acc:loc?loc.acc:null};
  PUNCHLOG.unshift({who:p.id,d:fmtDate(NOW),t:now,kind:'in',where,inside,acc:loc?loc.acc:null});
  toast(late>TIMECFG.lateGraceMins?`Checked in ${late} minutes after ${sh.from}`:'Checked in');
 }else{
  const m=TODAYMARK[p.id]; if(!m||!m.in) return toast('Check in first');
  m.out=now; m.outWhere=where;

 }

}

function restCheck(m){

 const end=m.out?mins(m.out):mins(hhmm(NOW));

/* — on-time delivery — */
/* This was the string "94.6%" on the front page. Every other figure in the app is
   derived from the data; a hand-typed one on the dashboard is the one number
   nobody can reconcile, and the first one to go stale. */
const ONTIMETARGET=98;
function onTime30(){
 const cut=NOW-30*86400000;
 const rows=DELIVERIES.filter(d=>d.d>=cut);
 if(!rows.length) return {pct:null,total:0,late:0,rows:[]};
 const late=rows.filter(d=>d.late);
 return {pct:(rows.length-late.length)/rows.length*100, total:rows.length, late:late.length, rows:late};
}
function onTimeDetail(){
 const o=onTime30();
 if(o.pct===null) return openModal('On-time delivery',
   `<p class="gr" style="font-size:13.5px;margin:0">Nothing has been delivered in the last thirty days, so there is no percentage to state.</p>`);
 const byStage={};
 o.rows.forEach(d=>{ let worst=null,ratio=0;
   ASSIGN_STAGES.forEach(st=>{ if(d.st[st]&&d.st[st]>ratio){ratio=d.st[st];worst=st;} });
   if(worst) byStage[worst]=(byStage[worst]||0)+1; });
 const ranked=Object.entries(byStage).sort((a,b)=>b[1]-a[1]);
 openModal(`On time — ${o.pct.toFixed(1)}% of ${o.total} deliveries`,
  mrows([['Delivered inside the promise',`over the last thirty days`,`${o.total-o.late}`,'ok'],
    ['Delivered late','the client was owed an explanation for each',`${o.late}`,o.late?'bad':'ok'],
    ['Against a target of',`${ONTIMETARGET}%`,`${(o.pct-ONTIMETARGET).toFixed(1)} pts`,o.pct<ONTIMETARGET?'bad':'ok']])
  +(ranked.length?`<h2 class="sec">Where the time went</h2>`
    +mrows(ranked.map(([st,n])=>[esc(st),'the stage that took longest on a late order',
      `${n} order${n===1?'':'s'}`, n>o.late/3?'bad':'gr'])):'')
  +mnote('The percentage is worked out from the deliveries themselves, not stored. If one stage dominates the list above, that is a budget or staffing problem rather than a person problem.'),
  `<button class="btn g" onclick="closeModal();SEL.rptab='Turnaround';go('reports')">Turnaround report</button>
   <button class="btn" onclick="closeModal()">Close</button>`);
}

/* — the five steps of a payroll month — */
/* A step that has happened opens what it produced. The step waiting to happen
   takes you to the button that does it, rather than doing it from here: locking
   and approving are one-way, and a progress strip is not where you commit to
   something one-way. A step that has not come yet says what has to happen first. */
function runStep(i){
 const mn=payMonth(), run=PAYRUNS[mn], si=stepIndex(run.state);
 const [name,what]=RUNSTEPS[i];
 const t=payTotals(mn);
 const noCtc=STAFF.filter(x=>x.active!==false&&!x.ctc);
 const noBank=paidStaff().filter(x=>!x.bank||!x.bank.acct);
 const noDoj=paidStaff().filter(x=>!x.doj);

 if(i>si){
  const blocking=RUNSTEPS.slice(si,i).map(x=>x[0]);
  return openModal(`${name} — not yet`,
   mrows([[esc(what),'what this step does',''],
     ['Waiting on',blocking.join(' → '),`${blocking.length} step${blocking.length===1?'':'s'}`,'gr'],
     ['This month is',esc(RUNSTATE[run.state][0].toLowerCase()),esc(mn),'gr']])
   +mnote(`${esc(RUNSTATE[run.state][2])} The steps run in order because each one depends on the last — computing against attendance that is still moving would produce a number that changes after you have read it.`),
   `<button class="btn g" onclick="closeModal();focusSec('prAction')">What is next</button>
    <button class="btn" onclick="closeModal()">Close</button>`);
 }

 if(i===si){                                   // the step waiting to happen
  toast(`${name} is the next step`);
  return focusSec('prAction');
 }

 /* done — open what it produced */
 if(i===0){ SEL.attab='This month'; return go('attend'); }
 if(i===1){ return pick('prtab','Register'); }
 if(i===2){
  SEL.prtab='The run'; go('payroll');
  const checks=noCtc.length+noBank.length+noDoj.length+t.lop.length;
  if(checks) return focusSec('prChecks');
  return openModal('Nothing was flagged',
   mrows([['Everyone has a salary','nobody was left out of the run',`${t.list.length} people`,'ok'],
     ['Everyone has a bank account','nobody was paid to a made-up account',`${t.list.length}`,'ok'],
     ['Nobody has an unpaid day','no payslip carries a deduction to explain','0','ok']])
   +mnote('Review is not a formality that passed — these are the four things that were actually checked, and all four were clear.'));
 }
 if(i===3) return openModal(`Approved — ${mn}`,
   mrows([['Signed off by',esc(run.by||'—'),esc(run.at||''),'ok'],
     ['What it committed to',`${t.list.length} people, ${inr(t.net)} net`,'',''],
     ['What it closed','attendance and salary changes for this month','','gr']])
   +mnote('Approving asks the person to type their own name, so the record says who — not just that it happened. A correction after this reopens the month rather than quietly editing it.'),
   `<button class="btn g" onclick="closeModal();pick('prtab','Register')">The register</button>
    <button class="btn" onclick="closeModal()">Close</button>`);
 return go('payslips');
}

 if(tab==='Late logins') return head+(()=>{

       ${a.flags.map(f=>`<div class="sd" style="margin-top:4px"><b>${esc(f[0])}</b> — ${esc(f[1])}</div>`).join('')}</span>
      <span><button class="btn g sm" onclick="openPerson('${p.id}')">Their record</button></span></div>`).join('')}
   </div></div>
   <p class="gr" style="font-size:12.5px;margin-top:10px">Patterns, not totals. Somebody who took three weeks in one go does not appear here; somebody who takes every third Monday does. The second is the one a manager can actually help with.</p>`
   :`<div class="card p"><p class="gr" style="font-size:13.5px;margin:0">No patterns worth raising. Absence is spread the way you would expect it to be.</p></div>`;})()}`;

 return head+`
  <div class="two">
   <div class="card p"><div class="lb">Sites and the geofence</div>
    ${SITES.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--hair)">
      <span><b>${esc(x.n)}</b><div class="gr" style="font-size:11.5px">${x.lat}, ${x.lng}</div></span>
      <b class="mono">${x.radius} m</b></div>`).join('')}
    <p class="gr" style="font-size:12.5px;margin-top:10px">A check-in outside every radius is still recorded — it is marked as away from site rather than refused. Refusing it would mean someone at a courthouse cannot start their day.</p></div>
   <div class="card p"><div class="lb">Face recognition</div>
    ${assume('Not built, and not something to fake','A browser can ask where a device is, and that is real above. It cannot tell you <b>whose face</b> this is without a camera, a model and somewhere to keep a biometric template.<br><br>Biometrics are also a different legal category from a punch time — under India\'s data protection law they need explicit consent, a stated purpose and a retention limit. <b>This is worth building properly with someone who knows that Act, or buying from a vendor who has.</b> A mock here would suggest a control that does not exist.')}
    <p class="gr" style="font-size:12.5px">What the geofence does give you: the check-in above records the device location and its accuracy, and flags anything outside the site radius.</p></div>
  </div>`;
};

S.leave=()=>{
 const f=SEL.lvf||'pending';
 const mine=!can('all');
 const scope=mine?LEAVE.filter(l=>l.who===ME.id):LEAVE;
 const rows=f==='all'?scope:scope.filter(l=>l.st===f);

 return pageHead('Leave',mine?(mgr?`Your requests and balances · approved by ${esc(mgr.n)}`:'Your requests and balances')

 +`<div class="kpis">

    return kcard({t:t.n,v:b.left,vc:b.left?'':'warn',

  </div>
  <p class="gr" style="font-size:12.5px;margin-top:10px">Balances are earned minus taken, computed from the requests below — not a number anyone typed in. ${mine?'':'Shown for you; open a person to see theirs.'}</p>

      ${soon.length?`<br><b>${soon.length} already approved:</b> ${soon.map(x=>`${esc(who(x.l.who))} from ${esc(fmtDate(x.l.from))}`).join(' · ')}. Worth arranging cover now rather than on the day.`:''}
      <div class="bs">The policy asks for at least ${LEAVEPOLICY.minCover} working per department, and is set to "${esc(CLASHRULES[LEAVEPOLICY.clashRule][0].toLowerCase())}".</div></div>
      <div class="ba"><button class="btn g sm" onclick="pick('lvsub','Policy')">The policy</button></div></div>`;})():''}
  ${!mine&&waitingOnMe.length?`<div class="bnr r" style="margin-top:14px"><span class="bi">◷</span><div>
   <div class="bt">${waitingOnMe.length} request${waitingOnMe.length===1?'':'s'} ${waitingOnMe.length===1?'is':'are'} yours to decide</div>
   ${esc(forMe.length)} people report to you: ${forMe.slice(0,6).map(x=>esc(x.n)).join(', ')}${forMe.length>6?' and others':''}.

  <div class="fbar" style="margin-top:16px">
   ${[['pending','Waiting'],['approved','Approved'],['rejected','Declined'],['all','All']].map(x=>
    `<button class="pill ${f===x[0]?'on':''}" aria-pressed="${f===x[0]}" onclick="pick('lvf','${x[0]}')">${esc(x[1])}
      <span class="n">${x[0]==='all'?scope.length:scope.filter(l=>l.st===x[0]).length}</span></button>`).join('')}</div>

  ${rows.length?`<div class="card"><div class="tsc"><div style="min-width:900px">

        ${l.clash.cover?`<div class="s">They say: ${esc(l.clash.cover)}</div>`:''}`:''}
       ${l.shortNotice!==null&&l.shortNotice!==undefined?`<div class="s warn">${l.shortNotice===0?'starting today':`${l.shortNotice} days notice`}</div>`:''}
       ${l.overBalance?`<div class="s warn">${r2(l.overBalance)} beyond balance — unpaid</div>`:''}</div>
      <div class="cell">${l.st==='pending'

            <button class="btn g sm" onclick="setLeave('${l.id}','rejected')">Decline</button><button class="btn sm" onclick="setLeave('${l.id}','approved')">Approve</button></span>`
           :`<span style="display:flex;gap:6px;align-items:center">${chip('Awaiting approval','r')}<button class="btn g sm" onclick="cancelLeave('${l.id}')">Cancel</button></span>`)
        : l.st==='approved'&&l.who===ME.id&&l.from>NOW
        ? `<span style="display:flex;gap:6px;align-items:center">${chip('Approved','v')}<button class="btn g sm" onclick="cancelLeave('${l.id}')">Cancel</button></span>`

  </div></div></div>
  ${rows.length>40?`<p class="gr" style="font-size:12.5px;margin-top:10px">Showing the 40 most recent of ${rows.length}.</p>`:''}`

  <div class="card p" style="margin-top:18px"><div class="lb">How each type behaves</div>
   ${LEAVETYPES.map(t=>`<div class="rw" style="padding:9px 0"><span>${chip(t.n,t.c)}</span>

     <span class="mono gr" style="font-size:11.5px">${t.annual?`${t.annual} a year`:'earned'}</span></div>`).join('')}
   <p class="gr" style="font-size:12.5px;margin-top:12px">Anything taken beyond the balance becomes unpaid leave, and shows on the payslip as a deduction rather than disappearing.</p></div>`;

function cancelLeave(id){
 const l=LEAVE.find(x=>x.id===id); if(!l) return;
 const past=l.from<NOW;
 openModal(past?'That leave has already started':'Cancel this leave?',
  past?`<p style="font-size:13.5px">It began on ${esc(fmtDate(l.from))}. Cancelling it now would rewrite attendance that has already been counted, and possibly a payslip that has already gone out.</p>
       <p class="gr" style="font-size:12.5px">Raise it as an attendance correction instead, so the change is recorded rather than silently applied.</p>`
      :`<p style="font-size:13.5px">${l.days} day${l.days===1?'':'s'} of ${esc((LEAVETYPES.find(t=>t.k===l.type)||{}).n||'')} from ${esc(fmtDate(l.from))}.</p>
        <p class="gr" style="font-size:12.5px">The balance goes straight back. Whoever approved it is not told automatically — worth a word if it was hard to arrange cover.</p>`,
  past?`<button class="btn g" onclick="closeModal()">Close</button>
        <button class="btn" onclick="closeModal();go('attend')">Attendance</button>`
      :`<button class="btn g" onclick="closeModal()">Keep it</button>
        <button class="btn" onclick="doCancelLeave('${id}')">Cancel the leave</button>`);
}
function doCancelLeave(id){const l=LEAVE.find(x=>x.id===id); if(!l) return;
 l.st='cancelled'; closeModal(); toast('Cancelled — balance restored'); go(view);}
function leavePolicyBody(){
 const P=LEAVEPOLICY;
 const num=(k,l,hint,suf)=>`<div class="fld"><label for="lp-${k}">${esc(l)}</label>

 return `<div class="card"><div class="ch"><h2>Leave types</h2>

   <div class="tb">${LEAVETYPES.map(t=>`<div class="trow" style="grid-template-columns:190px 110px 110px 120px 1fr 110px">

     <div class="cell"><div class="v gr" style="font-size:12.5px">${esc(t.d)}</div></div>
     <div class="cell"><span style="display:flex;gap:6px">
      <button class="btn g sm" onclick="editLeaveType('${t.k}')">Edit</button>
      ${LEAVE.some(l=>l.type===t.k)?'':`<button class="btn d sm" onclick="removeLeaveType('${t.k}')">Remove</button>`}</span></div></div>`).join('')}</div>
  </div></div></div>
  <p class="gr" style="font-size:12.5px;margin-top:10px">Changing a quota changes everyone's balance from now, because a balance is earned minus taken rather than a stored number. A type somebody has already used cannot be removed — the history would stop making sense.</p>

  <div class="two" style="margin-top:18px">
   <div class="card p"><div class="lb">When somebody applies</div><div class="frm">
     ${num('noticeDays','Notice normally expected','A request inside this is allowed, but flagged to the approver so it is a decision rather than a surprise.','days ahead')}

    </div>
    <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;padding:11px 13px;border:1px solid var(--hair);border-radius:9px;margin-top:12px">

     <span><b>Allow half days</b><div class="sd gr">Without them people take a whole day they did not need.</div></span></label>
   </div>
   <div class="card p"><div class="lb">When it would leave a department short</div>
    ${num('minCover','People who must stay working','Counted across the department for every day of the request.','at least')}
    <div style="display:grid;gap:8px;margin-top:12px">
     ${Object.entries(CLASHRULES).map(([k,v])=>`<label style="display:flex;align-items:flex-start;gap:10px;font-size:13.5px;padding:11px 13px;border:1px solid ${LEAVEPOLICY.clashRule===k?'var(--brand)':'var(--hair)'};border-radius:9px;background:${LEAVEPOLICY.clashRule===k?'var(--brandsoft)':'var(--card)'}">

       <span><b>${esc(v[0])}</b><div class="sd gr">${esc(v[1])}</div></span></label>`).join('')}</div>
    <p class="gr" style="font-size:12.5px;margin-top:12px">Blocking outright is the strictest and the most likely to be worked around — somebody will simply not record the day. "Ask for a reason" keeps the record honest and still puts the decision in front of the approver.</p>
   </div>
  </div>

  <h2 class="sec" id="tcLate">Late logins</h2>
  <div class="two">
   <div class="card p"><div class="lb">When a punch counts as late</div><div class="frm">
     <div class="fld"><label for="late-grace">Grace after the shift start</label>
      <div style="display:flex;align-items:center;gap:8px">
       <input class="inp mono" id="late-grace" type="number" min="0" step="5" value="${TIMECFG.lateGraceMins}" style="width:100px" onchange="setTimeCfg('lateGraceMins',this.value)">
       <span class="gr" style="font-size:12.5px">minutes</span></div>

      <div style="display:flex;align-items:center;gap:8px">

       <span class="gr" style="font-size:12.5px">per person</span></div>
      <div class="hint">Asking in advance stops a late punch counting towards a pattern. Beyond the allowance it is flagged rather than refused — somebody needing more has a shift that does not fit.</div></div>

   </div>
   <div class="card p"><div class="lb">What that rule produces right now</div>

       <p class="gr" style="font-size:12.5px;margin-top:12px">Widening the grace period does not erase anything already recorded — it changes what gets recorded from here.
        The log is under <b>Attendance → Late logins</b>.</p>`;})()}
   </div>
  </div>

  <h2 class="sec">Overtime</h2>
  <div class="two">
   <div class="card p"><div class="lb">How it is paid</div><div class="frm">
     <div class="fld"><label for="ot-rate">Rate</label>
      <div style="display:flex;align-items:center;gap:8px">
       <input class="inp mono" id="ot-rate" type="number" min="1" max="3" step="0.25" value="${TIMECFG.otRate}" style="width:100px" onchange="setTimeCfg('otRate',this.value)">
       <span class="gr" style="font-size:12.5px">× the ordinary hourly rate</span></div>
      <div class="hint">Worked out from each person's own salary, so it follows a raise without anyone updating a table.</div></div>
     <div class="fld"><label for="ot-after">Counts as overtime after</label>
      <div style="display:flex;align-items:center;gap:8px">
       <input class="inp mono" id="ot-after" type="number" min="60" step="30" value="${TIMECFG.otAfterMins}" style="width:100px" onchange="setTimeCfg('otAfterMins',this.value)">
       <span class="gr" style="font-size:12.5px">minutes in a day — ${r2(TIMECFG.otAfterMins/60)} hours</span></div></div>
     <div class="fld"><label for="ot-cap">Most in a month</label>
      <div style="display:flex;align-items:center;gap:8px">
       <input class="inp mono" id="ot-cap" type="number" min="0" step="60" value="${TIMECFG.otMonthlyCapMins}" style="width:100px" onchange="setTimeCfg('otMonthlyCapMins',this.value)">
       <span class="gr" style="font-size:12.5px">minutes — ${r2(TIMECFG.otMonthlyCapMins/60)} hours</span></div>

    </div>
    <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;padding:11px 13px;border:1px solid var(--hair);border-radius:9px;margin-top:12px">

   </div>

    ${(()=>{const claims=OT.filter(o=>o.st!=='rejected');

       <p class="gr" style="font-size:12.5px;margin-top:12px">Changing the rate above moves that figure for everyone at once. It is worth seeing before you save it.</p>`;})()}
   </div>

function setLeavePolicy(k,v){
 if(typeof LEAVEPOLICY[k]==='boolean') LEAVEPOLICY[k]=!!v;
 else if(typeof LEAVEPOLICY[k]==='number'){const n=parseFloat(v); if(!(n>=0)) return go(view); LEAVEPOLICY[k]=n;}
 else LEAVEPOLICY[k]=String(v);

/* One place that decides what a request means, used by the form, the send, and
   the record the approver reads. */
function leaveCheck(pid,k,d,from,to){
 const b=leaveBalance(pid)[k]||{left:0,earned:0};
 const cover=deptCover(pid,from,to), clash=clashesWith(pid,from,to);
 const t=LEAVETYPES.find(x=>x.k===k)||{n:k,annual:0};
 const short=cover?Math.max(0,LEAVEPOLICY.minCover-cover.left):0;
 /* whole days between today and the start date — comparing a date against a
    timestamp made a request starting today read as minus one day's notice */
 const notice=Math.round((midnight(from)-midnight(NOW))/86400000);
 const parts=[];
 let blocked=false, needReason=false;

 if(t.annual||k==='co'){
  parts.push(d>b.left
   ? `<div class="bnr d" style="margin:0 0 10px"><span class="bi">⚑</span><div>
      <b>${r2(d-b.left)} day${d-b.left===1?'':'s'} beyond your balance</b> — ${b.left} left of ${b.earned} earned.
      The excess is taken as unpaid leave and shows on your payslip as a deduction.</div></div>`
   : `<div class="bnr v" style="margin:0 0 10px"><span class="bi">✓</span><div>${r2(b.left-d)} day${b.left-d===1?'':'s'} would remain.</div></div>`);
 }
 if(d>LEAVEPOLICY.maxConsecutive)
  parts.push(`<div class="bnr r" style="margin:0 0 10px"><span class="bi">◷</span><div>
   <b>${d} days at once, against a normal maximum of ${LEAVEPOLICY.maxConsecutive}.</b>
   Send it if you need to, but talk to your manager as well — a form is not the right way to ask for this.</div></div>`);
 if(notice<LEAVEPOLICY.noticeDays&&notice>=0)
  parts.push(`<div class="bnr r" style="margin:0 0 10px"><span class="bi">◷</span><div>
   <b>${notice===0?'Starting today':`${notice} day${notice===1?'':'s'} notice`}, against ${LEAVEPOLICY.noticeDays} normally expected.</b>
   Allowed, and the approver will see that it was short notice.</div></div>`);

 if(cover&&(short>0||clash.length)){
  const names=clash.map(x=>`${who(x.who)} (${fmtDate(x.from)}–${fmtDate(x.to)})`);
  if(short>0){
   const rule=LEAVEPOLICY.clashRule;
   blocked = rule==='block';
   needReason = rule==='reason';
   parts.push(`<div class="bnr ${cover.left<=0?'d':'r'}" style="margin:0 0 10px"><span class="bi">⚑</span><div>
    <div class="bt">${cover.left<=0?`${esc(cover.dep)} would have nobody working`:`${esc(cover.dep)} would be down to ${cover.left} of ${cover.team}`}</div>
    ${names.length?`Already off across these dates: <b>${names.map(esc).join(', ')}</b>.`:''}
    The policy asks for at least ${LEAVEPOLICY.minCover} working.
    ${blocked?'<b>This request cannot be sent while that is true.</b> Agree cover with someone first, or pick different dates.'
      :needReason?'<b>You can still send it</b> — say below how the department will manage, and the approver will see it.'
      :'Worth agreeing cover before you send it.'}</div></div>`);
  } else {
   parts.push(`<div class="gr" style="font-size:12.5px;margin-bottom:10px">
    ${names.map(esc).join(', ')} ${clash.length===1?'is':'are'} also off then. ${esc(cover.dep)} keeps ${cover.left} of ${cover.team} — within policy.</div>`);
  }
 }
 return {html:parts.join(''),blocked,needReason,cover,clash,short,notice,
   overBalance:Math.max(0,d-(b.left||0))};
}
function saveLeave(){
 const k=document.getElementById('lvT').value, d=parseFloat(document.getElementById('lvD').value);
 const r=document.getElementById('lvR').value.trim();
 const err=document.getElementById('lvErr');
 if(!(d>0)) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>How long?</div></div>`;
 const fv=document.getElementById('lvFrom').value;
 const from0=fv?parseIso(fv):new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+LEAVEPOLICY.noticeDays);
 const to0=new Date(from0.getFullYear(),from0.getMonth(),from0.getDate()+Math.ceil(d)-1);
 const chk=leaveCheck(ME.id,k,d,from0,to0);
 const cover=document.getElementById('lvC')?document.getElementById('lvC').value.trim():'';
 if(chk.blocked) return err.innerHTML=`<div class="bnr d" style="margin:0"><span class="bi">⚑</span><div>
   <b>This cannot be sent as it stands.</b> ${esc(chk.cover.dep)} would be left below the cover the policy requires. Pick different dates, or agree with someone to swap.</div></div>`;
 if(chk.needReason&&!cover) return err.innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>
   Say how the department will manage. It is the question your approver would ask anyway, and answering it here saves a round trip.</div></div>`;
 if(!r) return document.getElementById('lvErr').innerHTML=`<div class="bnr r" style="margin:0"><span class="bi">⚠</span><div>Give a reason. Whoever approves it should not have to guess or ask.</div></div>`;
 LEAVE.unshift({id:'L'+(9000+LEAVE.length),who:ME.id,type:k,from:from0,to:to0,
   days:d,half:d===0.5,st:'pending',reason:r,by:null,at:null,
   clash:chk.short>0?{dep:chk.cover.dep,left:chk.cover.left,team:chk.cover.team,
     who:chk.clash.map(x=>who(x.who)),cover}:null,
   shortNotice:chk.notice<LEAVEPOLICY.noticeDays?chk.notice:null,
   overBalance:chk.overBalance||null});
 closeModal();
 toast(chk.short>0?'Sent — the approver is told it leaves the department short':'Sent for approval');
 go(view);
}

/* One row shape, used by the first paint and by every keystroke in the search,
   so a filtered row cannot drift from an unfiltered one. */
function psRows(list){
 const mn=payMonth();
 if(!list){
  const q=(SEL.psq||'').trim().toLowerCase();
  list=payTotals(mn).list;
  if(q) list=list.filter(x=>x.p.n.toLowerCase().includes(q)||x.p.dep.join(' ').toLowerCase().includes(q));
  if(SEL.psonly==='lop') list=list.filter(x=>x.a.lop>0);
 }
 if(!list.length) return `<div class="rw" style="padding:18px"><span></span><span class="gr" style="font-size:13.5px">Nobody matches that.</span><span></span></div>`;
 return list.map(x=>`<div class="trow" role="button" tabindex="0"

      return `<div style="display:grid;grid-template-columns:130px 1fr 110px;gap:12px;align-items:center;padding:7px 0;font-size:12.5px">
       <span><b>${esc(d)}</b></span>
       <span class="bar"><i style="width:${dept.tot?Math.round(((wk.stages[d]||{done:0,pend:0}).done+(wk.stages[d]||{done:0,pend:0}).pend)/dept.tot*100):0}%;background:var(--brand2)"></i></span>
       <span class="mono gr" style="text-align:right">${(wk.stages[d]||{done:0,pend:0}).done+(wk.stages[d]||{done:0,pend:0}).pend} of ${dept.tot}</span></div>`}).join('')
     ||`<p class="gr" style="font-size:12.5px;margin:0">You are not in a department, so nothing can be assigned to you.</p>`}
    <p class="gr" style="font-size:12.5px;margin-top:12px">Your share of what your department handled today.</p></div>
  </div>`;
};

/* ══════════ HOW I'M DOING ══════════
   A person's own view of their work. It leads with what is actionable — the
   reasons marks came off and the practice that prevents each one — because the
   score itself spans 0.06 across the whole company and ranks nobody. */
S.myperf=()=>{
 const m=meRec();
 const rng=rangeOf('q');
 const rows=QCLOG.filter(x=>x.onName===m.n&&inRange(x.d,rng));
 const teamRows=QCLOG.filter(x=>inRange(x.d,rng));
 const teamAvg=teamRows.length?teamRows.reduce((a,x)=>a+x.avg,0)/teamRows.length:0;
 const mineAvg=rows.length?rows.reduce((a,x)=>a+x.avg,0)/rows.length:null;
 const TW=stageWorkOf(DELIVERIES.filter(x=>inRange(x.d,rng)));
 const t=TW[m.n]||null;
 const allow=(QCRULES.find(r=>r.k==='see')||{}).on;

 if(!allow) return pageHead('How I’m doing','')
  +`<div class="card p" style="max-width:620px">
    <div class="bnr r" style="margin:0"><span class="bi">⚿</span><div>
     <div class="bt">Ratings are not shown to the person rated on this account</div>
     That is a company setting, not something about you. An admin turns it on under
     <b>Reports → Quality → How scoring works</b>, the rule
     "Scores are visible to the person rated".</div></div>
    <p class="gr" style="font-size:12.5px;margin-top:12px">Measuring someone against something they cannot see is the fastest way to make a quality score resented rather than useful — worth saying to whoever owns that setting.</p>
   </div>`;

 const below=rows.filter(x=>x.crit);
 const clean=rows.length-below.length;
 const reasons={}; below.forEach(x=>{ if(x.note) reasons[x.note]=(reasons[x.note]||0)+1; });
 const ranked=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
 const habits=ranked.filter(([,n])=>n>1), oneOffs=ranked.filter(([,n])=>n===1);
 const crit=['Accuracy','Completeness','Formatting'].map(c=>({c,
   n:below.filter(x=>x.crit===c).length,
   avg:rows.length?rows.reduce((a,x)=>a+x[{Accuracy:'acc',Completeness:'comp',Formatting:'fmt'}[c]],0)/rows.length:0}));
 const strongest=crit.filter(c=>c.n===0);
 /* is the same reason still happening, or has it stopped? */
 const half=new Date((rng.from.getTime()+rng.to.getTime())/2);
 const recent=below.filter(x=>x.d>=half), older=below.filter(x=>x.d<half);

 return pageHead('How I’m doing',`${esc(m.dep.join(' · ')||'no department')} · ${esc(rng.label)}`,
   `<button class="btn g" onclick="openPerson('${m.id}')">My profile</button>`)
 +rangeBar('q','these figures follow it')

 +`<div class="kpis">
   ${kcard({t:'Checks on your work',v:rows.length,d:esc(rng.label),
     on:"myChecks('all')",tip:'Every check in range'})}
   ${kcard({t:'Clean',v:clean,vc:'ok',d:`${rows.length?Math.round(clean/rows.length*100):0}% with nothing raised`,
     on:"myChecks('clean')",tip:'The ones with nothing raised'})}
   ${kcard({t:'Repeating',v:habits.length,vc:habits.length?'warn':'ok',cls:habits.length?'warnk':'',
     d:habits.length?'worth changing a habit for':'nothing is recurring',
     on:"myChecks('habit')",tip:'The ones worth changing a habit for'})}
   ${kcard({t:'Inside your budget',v:t?t.onBudget+'%':'—',vc:t?(t.vsPeers>=-5?'ok':'warn'):'',
     cls:t&&t.vsPeers<-5?'warnk':'',d:t?`others on the same stages: ${t.expected}%`:'no timed work in range',
     on:can('assign')?"focusSec('mfDept')":"budgetHelp()",tip:'How this compares'})}
  </div>

  ${mineAvg!==null?`<div class="card p" style="margin-top:16px"><div class="rw" style="background:var(--tint);border-radius:9px;padding:13px 15px">
   <span class="gr" style="font-size:14.5px">=</span>
   <span><b>Your score is ${mineAvg.toFixed(2)} — and on its own it does not mean much</b>
    <div class="sd">Across everyone here the scores run ${Math.min(...Object.values(QCLOG.reduce((a,x)=>{ (a[x.onName]=a[x.onName]||[]).push(x.avg); return a; },{})).map(l=>l.reduce((p,q)=>p+q,0)/l.length)).toFixed(2)} to ${Math.max(...Object.values(QCLOG.reduce((a,x)=>{ (a[x.onName]=a[x.onName]||[]).push(x.avg); return a; },{})).map(l=>l.reduce((p,q)=>p+q,0)/l.length)).toFixed(2)}. A gap that small is noise, not a ranking — which is why this page leads with reasons rather than with the number.</div></span></div></div>`:''}

  ${habits.length?`<h2 class="sec" id="mfHabits">Worth changing — ${habits.length} thing${habits.length===1?'':'s'} that came up more than once</h2>
   ${habits.map(([why,n])=>`<div class="card p" style="margin-bottom:12px">
     <div style="display:flex;gap:12px;align-items:flex-start">
      <span class="warn" style="font-size:17px;line-height:1.2">⚑</span>
      <div style="flex:1">
       <div style="font-size:14.5px;font-weight:650">${esc(why)}</div>
       <div class="gr" style="font-size:12.5px;margin-top:2px">${n} times in ${esc(rng.label)}${
         recent.filter(x=>x.note===why).length===0?' — <b class="ok">none in the more recent half</b>':
         older.filter(x=>x.note===why).length===0?' — <b class="warn">all of them recently</b>':''}</div>
       <div class="rw" style="background:var(--brandsoft);border-radius:9px;padding:12px 14px;margin-top:11px">
        <span class="brand" style="font-size:14.5px">→</span>
        <span><b>What to do differently</b><div class="sd">${esc(QCFIX[why]||'No practice recorded for this one yet.')}</div></span>
        <span></span></div>
       <div class="gr" style="font-size:11.5px;margin-top:9px">On ${below.filter(x=>x.note===why).map(x=>esc(x.order)).join(', ')}</div>
      </div></div></div>`).join('')}`
   :below.length?`<div class="card p" style="margin-top:16px"><p class="gr" style="font-size:12.5px;margin:0">
     Nothing has come up twice. Everything below is a one-off, and a one-off is not a habit worth changing your method for.</p></div>`
   :`<div class="card p" style="margin-top:16px"><p class="gr" style="font-size:12.5px;margin:0">
     Nothing was raised against your work in this range — all ${rows.length} checks came back clean.</p></div>`}

  ${oneOffs.length?`<h2 class="sec">Happened once — worth knowing, not worth worrying about</h2>
   <div class="card"><div class="rows" style="border:none;border-radius:0">
    ${oneOffs.map(([why])=>{const x=below.find(y=>y.note===why);
      return `<div class="rw"><span class="gr" style="font-size:14.5px">·</span>
       <span><b style="font-size:13.5px">${esc(why)}</b>
        <div class="sd gr">${esc(x.crit)} · ${esc(x.order)} · ${esc(x.dk)}</div>
        <div class="sd" style="margin-top:5px">${esc(QCFIX[why]||'')}</div></span>
       <span></span></div>`}).join('')}</div></div>`:''}

  <div class="two" style="margin-top:18px">
   <div class="card p"><div class="lb">Where your marks come off, and where they never do</div>
    ${crit.map(c=>`<div style="display:grid;grid-template-columns:118px 1fr 100px;gap:11px;align-items:center;padding:7px 0;font-size:12.5px">
      <span class="gr">${esc(c.c)}</span>
      <span class="bar"><i style="width:${below.length?Math.round(c.n/Math.max(1,below.length)*100):0}%;background:${c.n?'var(--warn)':'var(--ok)'}"></i></span>
      <span class="mono" style="text-align:right">${c.avg.toFixed(2)}${c.n?` <span class="gr">· ${c.n}</span>`:''}</span></div>`).join('')}
    ${strongest.length?`<div class="rw" style="background:var(--oksoft,var(--oktint));border-radius:9px;padding:11px 13px;margin-top:12px">
      <span class="ok" style="font-size:14.5px">✓</span>
      <span><b>${strongest.map(c=>esc(c.c)).join(' and ')} — nothing raised at all</b>
       <div class="sd">Across ${rows.length} checks. Worth knowing what you are already doing right, not just what you are not.</div></span><span></span></div>`:''}
   </div>
   <div class="card p"><div class="lb">Your time against the budget</div>
    ${t?`<div style="display:flex;align-items:baseline;gap:9px;margin:8px 0 10px">
      <b class="mono" style="font-size:26px">${t.ratio.toFixed(2)}×</b><span class="gr">of the time your stage is allowed, typically</span></div>
     <span class="bar" style="height:12px"><i style="width:${Math.min(100,Math.round(t.ratio*70))}%;background:${t.ratio>1?'var(--warn)':'var(--ok)'}"></i></span>
     <p class="gr" style="font-size:12.5px;margin-top:12px">${
       t.erratic?`Your typical order is comfortably inside budget. What costs you is the spread — ${t.over} of ${t.c} ran long. Those are worth a look: if the long ones have something in common, that is the thing to raise, not your pace.`
       :t.vsPeers>=5?`You come in ahead of others doing the same stages by ${t.vsPeers} points. Keep an eye on the defect count — time saved by skipping a check is not time saved.`
       :t.vsPeers<=-10?`Others on the same stages land inside budget ${t.expected}% of the time against your ${t.onBudget}%. That is a real gap, and it is worth asking whether the budget matches the work you are given before treating it as pace.`
       :`You track the budget about as closely as everyone else on the same stages.`}</p>
     <p class="gr" style="font-size:12.5px">The budget is your department's slice of the client's promise — set under Turnaround &amp; SLA, not by you.</p>`
     :`<p class="gr" style="font-size:12.5px;margin:0">No timed work in this range.</p>`}
   </div>
  </div>

  ${can('assign')?`<h2 class="sec" id="mfDept">Your department</h2>
   ${(()=>{const dept=m.dep[0]; const dRows=QCLOG.filter(x=>inRange(x.d,rng)&&STAFF.some(s=>s.n===x.onName&&s.dep.includes(dept)));
     const dR={}; dRows.filter(x=>x.note).forEach(x=>dR[x.note]=(dR[x.note]||0)+1);
     const top=Object.entries(dR).sort((a,b)=>b[1]-a[1]).slice(0,4);
     return `<div class="card p"><div class="lb">What ${esc(dept)} keeps losing marks on</div>
      ${top.length?top.map(([why,n])=>`<div class="rw" style="padding:9px 0">
        <span class="${n>2?'warn':'gr'}" style="font-size:14.5px">${n>2?'⚑':'·'}</span>
        <span><b style="font-size:13.5px">${esc(why)}</b><div class="sd gr">${n} across the department</div>
         <div class="sd" style="margin-top:4px">${esc(QCFIX[why]||'')}</div></span>
        <span class="mono gr">${n}</span></div>`).join('')
       :`<p class="gr" style="font-size:12.5px;margin:0">Nothing recurring in ${esc(dept)}.</p>`}
      <p class="gr" style="font-size:12.5px;margin-top:12px">The same mistake made by different people is a process problem, not a person problem — it usually means a step is missing from how the work is set up rather than from how it is done.</p></div>`;})()}`:''}`;
};

/* ══════════ STAFF PROFILE ══════════
   One person, everything about them. The figures already existed — they were just
   spread across four screens, so nobody could answer "how is she doing?" without
   opening three of them and holding the numbers in their head. */
function openPerson(id){SEL.person=id; SEL.ptab='Overview'; go('person');}

S.person=()=>{
 const p=STAFF.find(x=>x.id===SEL.person)||STAFF[0];
 if(!p) return gone('person','staff','Staff');
 const tab=SEL.ptab||'Overview';
 const wk=WORK[p.id]||{done:0,pend:0,tot:0,pct:0,items:[],stages:{}};
 const rng=rangeOf('q');
 const rows=QCLOG.filter(x=>x.onName===p.n&&inRange(x.d,rng));      // rated on their work
 const given=QCLOG.filter(x=>x.byName===p.n&&inRange(x.d,rng));     // ratings they handed out
 const TW=stageWorkOf(DELIVERIES.filter(x=>inRange(x.d,rng)));
 const t=TW[p.n]||null;
 const qavg=rows.length?rows.reduce((a,x)=>a+x.avg,0)/rows.length:null;
 const teamRows=QCLOG.filter(x=>inRange(x.d,rng));
 const teamAvg=teamRows.length?teamRows.reduce((a,x)=>a+x.avg,0)/teamRows.length:0;
 const sd=(qavg!==null&&t)?standing(qavg,t.vsPeers,teamAvg):null;
 const role=ROLELIST.find(x=>x.id===p.r);
 const dis=p.active===false;

 const head=`<div class="card p">
  <div class="ch" style="border:none;padding:0">
   <div style="display:flex;align-items:center;gap:14px">
    <span class="ava" style="width:52px;height:52px;font-size:17px">${initials(p.n)}</span>
    <div>
     <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:19px">${esc(p.n)}</h2>
      ${chip(roleName(p.r),p.r==='admin'?'b':p.r==='staff'?'n':'r')}
      ${dis?chip('Disabled','n'):chip(AVAIL[p.avail][0],AVAIL[p.avail][1])}
      ${sd?chip(sd[0],sd[1]):''}
     </div>
     <div class="gr" style="font-size:12.5px;margin-top:4px">
      ${p.dep.length?esc(p.dep.join(' · ')):'<span class="warn">in no department — cannot be assigned anything</span>'}
      ${p.e?` · <span class="mono">${esc(p.e)}</span>`:''}${p.mob?` · <span class="mono">${esc(p.mob)}</span>`:''}</div></div></div>
   <div class="r">
    <button class="btn g" onclick="editStaff('${p.id}')">Edit details</button>
    ${isAdmin()?`<button class="btn g" onclick="openCo('Roles')">Roles</button>`:''}</div></div>
  ${p.conflict?`<div class="bnr r" style="margin:14px 0 0"><span class="bi">⚖</span><div>
   <div class="bt">In a stage and its own QC</div>
   ${esc(p.n)} is in both Typing and Typing QC, so they could be asked to check their own typing. Assignment blocks it order by order, but the pairing itself is worth a decision.</div></div>`:''}
  ${dis?`<div class="bnr d" style="margin:14px 0 0"><span class="bi">⚑</span><div>
   <div class="bt">Disabled — takes no new work</div>
   Their history stays exactly as it is. Everything below still counts the work they did.</div></div>`:''}
 </div>`;

 let body;
 if(tab==='Overview'){
  body=`<div class="kpis" style="margin-top:16px">
   ${kcard({t:'Today',v:wk.tot,d:`of a ${p.cap} target`,on:"pick('ptab','Work')",tip:'Their day, stage by stage'})}
   ${kcard({t:'Completed',v:wk.done,vc:'ok',d:`${wk.pct}% of their day`,on:"pick('ptab','Work')",tip:'Their day, stage by stage'})}
   ${kcard({t:'On their desk',v:wk.pend,vc:wk.pend?'warn':'ok',cls:wk.pend?'warnk':'',d:'still to finish',
     on:"pick('ptab','Work')",tip:'What is still open'})}
   ${kcard({t:'Quality',v:qavg!==null?qavg.toFixed(2):'—',d:`${rows.length} rating${rows.length===1?'':'s'} · ${esc(rng.label)}`,
     on:"pick('ptab','Quality')",tip:'Every rating and why marks came off'})}
  </div>
  ${sd?`<div class="card p" style="margin-top:16px"><div class="rw" style="background:${sd[1]==='v'?'var(--oksoft,var(--oktint))':sd[1]==='d'?'var(--badtint)':'var(--warntint)'};border-radius:9px;padding:13px 15px">
   <span>${chip(sd[0],sd[1])}</span>
   <span><b>${esc(sd[2])}</b>
    <div class="sd">Quality ${qavg.toFixed(2)} against a team ${teamAvg.toFixed(2)}; inside budget on ${t.onBudget}% of ${t.c} stages where peers on the same stages manage ${t.expected}%.</div></span>
   <span><button class="btn g sm" onclick="pick('ptab','Quality')">The detail</button></span></div></div>`:''}
  <div class="two" style="margin-top:16px">
   <div class="card p"><div class="lb">Contact and emergency</div>
    ${[['Mobile',p.mob],['Email',p.e],['Address',p.addr]].filter(r=>r[1]).map(r=>
      `<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--hair)">
        <span class="gr">${esc(r[0])}</span><b style="text-align:right">${esc(r[1])}</b></div>`).join('')}
    ${p.emg?`<div class="rw" style="background:var(--badtint);border-radius:9px;padding:12px 14px;margin-top:12px">
      <span class="bad" style="font-size:14.5px">☎</span>
      <span><b>${esc(p.emg.n)} — ${esc(p.emg.rel)}</b><div class="sd mono">${esc(p.emg.mob)}</div>
       <div class="sd gr">Called first if something happens here.</div></span><span></span></div>`
     :`<div class="bnr r" style="margin-top:12px"><span class="bi">⚠</span><div>
       <b>No emergency contact on record.</b> This is the field nobody misses until the day it is needed.</div></div>`}
   </div>
   <div class="card p"><div class="lb">Statutory</div>
    ${[['PAN',p.pan],['UAN — provident fund',p.uan],['ESIC number',p.esicNo]].map(r=>

     <span style="display:flex;align-items:center;gap:9px">

      ${p.aadhaar&&!AADHAAR_SHOWN[p.id]?`<button class="btn g sm" onclick="revealAadhaar('${p.id}')">Show</button>`:''}</span></div>
    <div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px">
     <span class="gr">Bank</span><b class="mono">${p.bank?esc(p.bank.acct+' · '+p.bank.ifsc):'not on record'}</b></div>
    <p class="gr" style="font-size:12.5px;margin-top:10px">Aadhaar shows its last four by default. Anything more should be a deliberate act, and in a real deployment a logged one.</p>
   </div>
  </div>
  <div class="two" style="margin-top:16px">
   <div class="card p"><div class="lb">Where they work</div>
    ${p.dep.length?p.dep.map(d=>{const st=wk.stages[d]||{done:0,pend:0};

       <span class="mono gr" style="text-align:right">${st.done+st.pend} today${dept.staff?` · 1 of ${dept.staff.length}`:''}</span></div>`}).join('')
     :`<p class="gr" style="font-size:12.5px;margin:0">No department, so the assignment engine can never pick them. <button class="lnk" onclick="editStaff('${p.id}')">Fix that</button>.</p>`}
    <p class="gr" style="font-size:12.5px;margin-top:12px">A person in one department is a single point of failure for that stage on the day they are away.</p></div>
   <div class="card p"><div class="lb">Capacity</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 10px">
     <b class="mono" style="font-size:26px">${RUN.load[p.id]??0}</b><span class="gr">of ${p.cap} today</span></div>
    <span class="bar" style="height:12px"><i style="width:${p.cap?Math.min(100,Math.round((RUN.load[p.id]??0)/p.cap*100)):0}%;background:${(RUN.load[p.id]??0)>=p.cap?'var(--warn)':'var(--ok)'}"></i></span>
    <p class="gr" style="font-size:12.5px;margin-top:12px">${(RUN.load[p.id]??0)>=p.cap

      : `${p.cap-(RUN.load[p.id]??0)} more before the engine stops offering them work.`}</p>
    <p class="gr" style="font-size:12.5px">Their target is set on their record, not by the department.</p></div>
   ${p.dep.some(d=>COVSTAGES.includes(d))?`<div class="card p"><div class="lb">What they can be given</div>
    <div class="fld" style="margin-top:10px"><label for="pv-lvl">Level</label>
     <select class="inp" id="pv-lvl" onchange="setPersonLevel('${p.id}',this.value)">
      <option value=""${p.lvl?'':' selected'}>No level — takes anything</option>
      ${LEVELS.map(l=>`<option value="${l.id}"${p.lvl===l.id?' selected':''}>${esc(l.n)} — ${esc(covWord(l))}</option>`).join('')}</select>
     <div class="hint">${p.lvl?'Coverage comes from the level, so changing it here moves them, not the level.':'Not restricted — a candidate for anything in their department.'}</div></div>
    ${p.lvl?`<div class="rw" style="padding:11px 0;margin-top:6px"><span class="ok" style="font-size:14.5px">◈</span>
     <span><b>${esc(covWord(covOf(p.id)))}</b>
      <div class="sd">Shared with ${onLevel(p.lvl).length-1} other${onLevel(p.lvl).length-1===1?'':'s'} on ${esc((LEVELS.find(l=>l.id===p.lvl)||{}).n)}. Widen the level and they all move together.</div></span>
     <span><button class="btn g sm" onclick="pick('lvlSel','${p.lvl}');pick('atab','Levels');go('assign')">Open the level</button></span></div>`:''}
    <p class="gr" style="font-size:12.5px;margin-top:10px">Levels apply to ${esc(COVSTAGES.join(' and '))} only — the stages that need local knowledge. Typing and RTS work from what the searcher found.</p></div>`:''}
  </div>`;

 else if(tab==='Work'){

 }

 else if(tab==='Quality'){

   `<div class="card p" style="margin-top:16px"><p class="gr" style="font-size:12.5px;margin:0">Every rating in this range was a straight 5 on all three criteria.</p></div>`}
  <h2 class="sec">Every rating — ${esc(rng.label)}</h2>

    <div class="rw"><span class="${dis?'bad':'ok'}">${dis?'⚑':'✓'}</span><span><b>${dis?'Disabled':'Active'}</b>
      <div class="sd gr">${dis?'Takes no new work. History is kept.':'Counted in capacity and eligible for assignment.'}</div></span>

   </div>
   <p class="gr" style="font-size:12.5px;margin-top:12px">Disabling keeps every rating and every hour they worked. Deleting a person would silently rewrite the reports they appear in, which is why it is not offered.</p></div>`;
 }

 return backTo('Staff','staff')
  +pageHead(p.n,`${esc(p.dep.join(', ')||'no department')} · ${esc(roleName(p.r))}`,

     <button class="btn" onclick="editStaff('${p.id}')">Edit details</button>`)
  +head+tabbar(['Overview','Work','Quality','Access'],'ptab',tab)+body;
};

/* create a role mid-flow, without losing what has already been typed */
function newRoleFromStaff(id){
 SEL.staffDraft={
  n:val('s-n'), e:val('s-e'), r:val('s-r'),
  cap:Math.max(0,parseInt(val('s-c'),10)||0),
  avail:val('s-av')||'ok', active:val('s-ac')!=='0',
  dep:[...document.querySelectorAll('#mdb input[data-dep]')].filter(c=>c.checked).map(c=>c.dataset.dep)};
 SEL.roleBack=id===null||id===undefined?'new':id;
 editRole();
}
const val=x=>{const e=document.getElementById(x);return e?e.value.trim():'';};
function staffErr(msg){
 const e=document.getElementById('s-err');
 if(e)e.innerHTML=`<div class="bnr d" style="margin-bottom:14px"><span class="bi">⚑</span><div style="font-size:12.5px">${esc(msg)}</div></div>`;
}
function saveStaff(id){
 const n=val('s-n'), e=val('s-e').toLowerCase();
 if(!n){ staffErr('A name is required.'); document.getElementById('s-n').focus(); return; }
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ staffErr('That email does not look right.'); document.getElementById('s-e').focus(); return; }
 if(STAFF.some(s=>s.id!==id&&(s.e||'').toLowerCase()===e)){ staffErr(`${e} already belongs to someone here.`); return; }
 const dep=[...document.querySelectorAll('#mdb input[data-dep]')].filter(c=>c.checked).map(c=>c.dataset.dep);
 const r=val('s-r')||'staff', cap=Math.max(0,parseInt(val('s-c'),10)||0);
 const avail=val('s-av')||'ok', active=val('s-ac')!=='0';
 if(r!=='admin'&&!dep.length){ staffErr('Pick at least one department, or make them an admin.'); return; }
 const rec=STAFF.find(x=>x.id===id);
 const ctc=Math.max(0,parseInt(val('s-ctc'),10)||0);
 const doj=val('s-doj'), pan=val('s-pan').toUpperCase(), uan=val('s-uan');
 const acct=val('s-acct'), ifsc=val('s-ifsc').toUpperCase();
 if(doj&&!/^\d{2}\/\d{2}\/\d{4}$/.test(doj)){ staffErr(`A joining date should read ${fmtDate(NOW)} — the format this company uses everywhere.`); return; }
 if(pan&&!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan)){ staffErr('A PAN is five letters, four digits, then a letter.'); return; }
 if(ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){ staffErr('An IFSC is four letters, a zero, then six characters.'); return; }
 if(acct&&!ifsc){ staffErr('An account number without an IFSC cannot be paid into. Give both, or neither.'); return; }
 const aad=val('s-aad'), esicNo=val('s-esic'), mob=val('s-mob'), addr=val('s-addr');
 const emg={n:val('s-en'),rel:val('s-er'),mob:val('s-em')};
 if(aad&&!/^\d{4}\s?\d{4}\s?\d{4}$/.test(aad)){ staffErr('An Aadhaar number is twelve digits.'); return; }
 if(emg.n&&!emg.mob){ staffErr(`An emergency contact with no number cannot be called. Add ${emg.n}'s number, or leave the name blank too.`); return; }
 const pay={ctc,doj,pan,uan,esicNo,aadhaar:aad,mob,addr,emg:emg.n?emg:null,
   bank:acct?{acct,ifsc,name:n}:null};
 if(rec){ Object.assign(rec,{n,e,dep,r,cap,avail,active,...pay,
   conflict:dep.includes('Typing')&&dep.includes('Typing QC')}); }
 else { STAFF.push({id:newStaffId(),n,e,dep,r,cap,open:0,avail,active,...pay,
   conflict:dep.includes('Typing')&&dep.includes('Typing QC')}); }
 recompute(); closeModal(); go('staff');
}
function removeStaff(id){
 const s=STAFF.find(x=>x.id===id); if(!s) return;
 const held=RUN.assigns.filter(a=>a.who===id).length;
 openModal(`Remove ${s.n}?`,
  `<p style="font-size:13.5px">${held
    ? `They are carrying <b>${held} stage task${held===1?'':'s'}</b> today. Removing them leaves that work unassigned.`
    : 'They have no work assigned today.'}</p>
   <div class="bnr r" style="margin-top:14px"><span class="bi">⚑</span><div style="font-size:12.5px">
    <div class="bt" style="font-size:12.5px">Disabling is usually better than removing</div>
    A disabled person keeps their history and stops receiving work. Removing them erases the record of who did what.</div></div>`,

   <button class="btn g" onclick="disableStaff('${id}')">Disable instead</button>

function parseStaffCsv(txt){
 return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((line,i)=>{
  const p=line.split(/\s*[,\t]\s*/);
  const [n,e,r,cap,...deps]=p;
  const dep=(deps.join(',')||'').split(/\s*[|;]\s*/).map(x=>x.trim()).filter(Boolean);
  const row={line:i+1,n:n||'',e:(e||'').toLowerCase(),
   r:(r||'staff').toLowerCase().startsWith('a')?'admin':(r||'staff').toLowerCase().startsWith('l')?'lead':'staff',
   cap:Math.max(0,parseInt(cap,10)||16), dep:dep.filter(d=>STAGES.includes(d)),
   bad:dep.filter(d=>!STAGES.includes(d))};
  row.err = !row.n ? 'no name'
   : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(row.e) ? 'bad email'
   : STAFF.some(s=>(s.e||'').toLowerCase()===row.e) ? 'email already here'
   : row.bad.length ? `unknown department: ${row.bad.join(', ')}`
   : (row.r!=='admin'&&!row.dep.length) ? 'no department'
   : null;
  return row;
 });
}

function savePerm(k){

 if(!n){ pmErr('Some wording is required.'); return; }
 if(PERMS.some(x=>x.k!==k&&x.n.toLowerCase()===n.toLowerCase())){ pmErr(`There is already a permission worded \u201C${n}\u201D.`); return; }
 const rec=PERMS.find(x=>x.k===k);
 if(rec) rec.n=n;
 else{ let key=ltKey(n),b=2; while(PERMS.some(x=>x.k===key)) key=ltKey(n)+(b++);
  PERMS.push({k:key,n,sys:false}); }
 managePerms();
}

  `<p style="font-size:13.5px">${held.length?`It is ticked on <b>${esc(held.join(', '))}</b> and will come off ${held.length===1?'that role':'those roles'}.`:'No role has it ticked.'}</p>`,

function newDeptId(){let b=1;while(DEPTLIST.some(d=>d.id==='d'+b))b++;return 'd'+b;}
function editDept(id){
 const d=DEPTLIST.find(x=>x.id===id)||{n:'',desc:'',auto:true,pair:null,qc:false};
 const others=DEPTLIST.filter(x=>x.id!==id&&!x.pair);
 openModal(id?`Edit ${d.n}`:'Add a department',
  `<div id="d-err"></div>
   <div class="frm">

   <div class="fld"><label for="d-a">How work reaches it</label>

    <div class="hint">A QC stage never goes to whoever did the stage it checks.</div></div>
  </div>
  ${id?`<div class="bnr b" style="margin:16px 0 0"><span class="bi">◔</span><div style="font-size:12.5px">
   <b>${STAFF.filter(s=>s.dep.includes(d.n)&&s.active!==false).length} people</b> belong to ${esc(d.n)}${(DWORK[d.n]||{}).tot?`, carrying ${DWORK[d.n].tot} stage tasks today`:''}.</div></div>`
  :`<div class="bnr r" style="margin:16px 0 0"><span class="bi">⚑</span><div style="font-size:12.5px">
   <div class="bt" style="font-size:12.5px">A new department starts with nobody in it</div>
   If you make it part of the pipeline, every order will need it and none of them will find an owner until you add staff. Those show up as exceptions, not as silent failures.</div></div>`}`,
  `<button class="btn g" onclick="closeModal()">Cancel</button>
   ${id?`<button class="btn d" onclick="removeDept('${id}')">Remove</button>`:''}

function deptErr(m){const e=document.getElementById('d-err');
 if(e)e.innerHTML=`<div class="bnr d" style="margin-bottom:14px"><span class="bi">⚑</span><div style="font-size:12.5px">${esc(m)}</div></div>`;}
function saveDept(id){
 const n=val('d-n'), desc=val('d-d'), auto=val('d-a')==='1', pair=val('d-p')||null;
 if(!n){ deptErr('A name is required.'); const e=document.getElementById('d-n'); if(e)e.focus(); return; }
 if(DEPTLIST.some(x=>x.id!==id&&x.n.toLowerCase()===n.toLowerCase())){ deptErr(`There is already a department called ${n}.`); return; }
 if(pair===n){ deptErr('A department cannot check itself.'); return; }
 const rec=DEPTLIST.find(x=>x.id===id);
 if(rec){
  const old=rec.n;
  Object.assign(rec,{n,desc,auto,pair,qc:!!pair});
  if(old!==n){                                   // carry the rename through everything that referenced it
   STAFF.forEach(s=>{s.dep=s.dep.map(x=>x===old?n:x);});
   DEPTLIST.forEach(x=>{if(x.pair===old)x.pair=n;});
  }
 } else DEPTLIST.push({id:newDeptId(),n,desc,auto,pair,qc:!!pair});
 syncDepts(); recompute(); closeModal(); go('depts');
}
function removeDept(id){
 const d=DEPTLIST.find(x=>x.id===id); if(!d) return;
 const people=STAFF.filter(s=>s.dep.includes(d.n));
 const work=(DWORK[d.n]||{}).tot||0;
 const checkedBy=DEPTLIST.filter(x=>x.pair===d.n).map(x=>x.n);
 openModal(`Remove ${d.n}?`,
  `<p style="font-size:13.5px">${people.length?`<b>${people.length} ${people.length===1?'person belongs':'people belong'}</b> to it${work?`, carrying ${work} stage task${work===1?'':'s'} today`:''}.`:'Nobody belongs to it.'}</p>
   ${checkedBy.length?`<div class="bnr r" style="margin-top:14px"><span class="bi">⚑</span><div style="font-size:12.5px">
    <div class="bt" style="font-size:12.5px">${checkedBy.join(' and ')} check${checkedBy.length===1?'s':''} this stage</div>
    Removing it leaves ${checkedBy.length===1?'that QC stage':'those QC stages'} checking nothing, so the self-review rule stops applying to ${checkedBy.length===1?'it':'them'}.</div></div>`:''}
   ${people.length?`<div class="bnr d" style="margin-top:14px"><span class="bi">⚠</span><div style="font-size:12.5px">
    ${people.map(p=>esc(p.n)).join(', ')} will lose this department. Anyone left with none stops receiving work.</div></div>`:''}`,
  `<button class="btn g" onclick="closeModal()">Cancel</button><button class="btn d" onclick="reallyRemoveDept('${id}')">Remove ${esc(d.n)}</button>`);
}
function reallyRemoveDept(id){
 const d=DEPTLIST.find(x=>x.id===id); if(!d) return;
 STAFF.forEach(s=>{s.dep=s.dep.filter(x=>x!==d.n);});
 DEPTLIST.forEach(x=>{if(x.pair===d.n){x.pair=null;x.qc=false;}});
 DEPTLIST.splice(DEPTLIST.indexOf(d),1);
 syncDepts(); recompute(); closeModal(); go('depts');
}
function moveDept(id,dir){
 const i=DEPTLIST.findIndex(x=>x.id===id), j=i+dir;
 if(i<0||j<0||j>=DEPTLIST.length) return;
 [DEPTLIST[i],DEPTLIST[j]]=[DEPTLIST[j],DEPTLIST[i]];
 syncDepts(); recompute(); go('depts');
}
