<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Title CRM — multi-tenant production system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --nav:#131A2B;--nav2:#1B2438;--navtx:#94A3B8;--navon:#fff;
 --bg:#F6F7F9;--card:#fff;--ink:#0F172A;--gr:#64748B;--hair:#E6E9EF;
 --brand:#4F46E5;--brand2:#6366F1;--brandsoft:#EEF0FE;
 --ok:#0F7B4F;--oksoft:#E7F5EE;--warn:#B45309;--warnsoft:#FEF3E2;--bad:#BE2A2A;--badsoft:#FDECEC;
 --tint:#F8F9FC;--tint2:#F1F3F7;--rail:#E6E9EF;
 --oktint:#E7F5EE;--warntint:#FEF3E2;--badtint:#FDECEC;--flag:#FEF9EE;--flagline:#F0D9AE;
 --sh1:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
 --sh2:0 4px 10px rgba(15,23,42,.07),0 18px 44px rgba(15,23,42,.1);
 --mono:'IBM Plex Mono',ui-monospace,monospace}
body.dark{
 --bg:#0B1120;--card:#131C2E;--ink:#E8EDF6;--gr:#94A3B8;--hair:#25314A;
 --nav:#080D18;--nav2:#131C2E;--navtx:#8FA0BC;
 --brandsoft:#1E2544;--tint:#18223A;--tint2:#1B2540;--rail:#243050;
 --oksoft:#12301F;--oktint:#12301F;--warnsoft:#3A2A10;--warntint:#3A2A10;
 --badsoft:#3A1717;--badtint:#3A1717;--flag:#332711;--flagline:#7A5B23;
 --ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--brand:#818CF8;--brand2:#A5B4FC;
 --sh1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
 --sh2:0 4px 10px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.4);
}
body.dark .who{background:var(--card)}
body.dark input,body.dark select,body.dark textarea{background:var(--tint);color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;text-align:left}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gr{color:var(--gr)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.br{color:var(--brand)}
::selection{background:rgba(79,70,229,.18)}

/* ─── shell ─── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--navtx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.logo i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#818CF8);display:grid;place-items:center;font-style:normal;font-size:12.5px;flex:none;box-shadow:0 2px 8px rgba(79,70,229,.45)}
.tenant{margin:0 12px 14px;background:var(--nav2);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s}
.tenant:hover{background:#232E45}
.tenant .av{width:26px;height:26px;border-radius:5px;background:#334155;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.tenant .nm{min-width:0;flex:1}
.tenant .nm b{display:block;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenant .nm span{font-size:10.5px;color:var(--navtx)}
.tenant .cx{color:var(--navtx);font-size:10.5px;flex:none}
.navlbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#5A6B86;font-weight:700;padding:12px 20px 6px}
.side nav{flex:1;overflow-y:auto;padding-bottom:12px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 18px;font-size:13.5px;color:var(--navtx);border-left:2px solid transparent;transition:color .15s,background .15s}
.side nav button:hover{color:#CBD5E1;background:rgba(255,255,255,.04)}
.side nav button.on{color:var(--navon);background:rgba(99,102,241,.16);border-left-color:var(--brand2);font-weight:600}
.side nav button i{font-style:normal;font-size:13.5px;width:17px;text-align:center;flex:none;opacity:.9}
.side nav button .bdg{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--bad);color:#fff;padding:1px 6px;border-radius:99px;font-weight:700}
.me{border-top:1px solid rgba(255,255,255,.08);padding:11px 16px;display:flex;align-items:center;gap:9px;font-size:12.5px}
.me .av{width:27px;height:27px;border-radius:50%;background:#334155;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.me>span{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.me b{color:#fff;font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:10.5px}
.me .lo{margin-left:auto;color:var(--navtx);font-size:13.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--hair);padding:0 26px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.top .clock{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--gr);display:flex;align-items:center;gap:8px}
.top .clock b{color:var(--ink);font-weight:500}
.top .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14.5px;color:var(--gr);position:relative}
.top .ic:hover{background:var(--bg);color:var(--ink)}
.top .ic .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.wrap{padding:24px 26px 64px;max-width:1360px;width:100%}

/* ─── typography ─── */
h1.pg{font-size:23px;font-weight:600;letter-spacing:-.02em}
p.sub{font-size:13.5px;color:var(--gr);margin-top:3px}
.hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.hd .r{margin-left:auto;display:flex;gap:9px;align-items:center;flex:none}
h2.sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gr);font-weight:700;margin:26px 2px 11px}

/* ─── buttons ─── */
.btn{padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;white-space:nowrap;text-align:center;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(15,23,42,.16),0 3px 10px rgba(79,70,229,.24);transition:transform .14s,box-shadow .14s,filter .14s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,23,42,.16),0 7px 18px rgba(79,70,229,.3)}
.btn:active{transform:none}
.btn.g{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair),0 1px 2px rgba(15,23,42,.04)}
.btn.g:hover{background:var(--tint);filter:none;box-shadow:inset 0 0 0 1px #D6DBE5,0 3px 9px rgba(15,23,42,.07)}
.btn.d{background:var(--card);color:var(--bad);box-shadow:inset 0 0 0 1px #F3CFCF}
.btn.d:hover{background:var(--badsoft);filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important}

/* ─── cards ─── */
.card{background:var(--card);border:1px solid var(--hair);border-radius:13px;box-shadow:var(--sh1)}
.card.p{padding:19px 21px}
.card .ch{padding:15px 20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card .ch h2{font-size:14.5px;font-weight:600;margin:0}
.ch h2{font-weight:600}
#mdt{font-size:17px;font-weight:650;margin:0}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .cb{padding:19px 21px}
.lb{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gr);font-weight:700;margin-bottom:10px}

/* ─── KPI tiles ─── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:15px 17px;box-shadow:var(--sh1);transition:box-shadow .2s,transform .2s;cursor:pointer}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.kpi .t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gr);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .t .i{margin-left:auto;font-size:12.5px;opacity:.55}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.025em;margin-top:7px;line-height:1}
.kpi .d{font-size:11.5px;margin-top:6px;font-weight:500}
.kpi.alert{border-color:#F3CFCF;background:linear-gradient(180deg,var(--badtint),var(--card))}
.kpi.alert .v{color:var(--bad)}
.kpi.warnk{border-color:var(--flagline);background:linear-gradient(180deg,var(--flag),var(--card))}
.kpi.warnk .v{color:var(--warn)}

/* ─── pipeline ─── */
.pipe{display:flex;gap:7px;flex-wrap:wrap}
.pchip{background:var(--card);border:1px solid var(--hair);border-radius:9px;padding:9px 13px;display:flex;align-items:center;gap:9px;font-size:12.5px;box-shadow:var(--sh1);transition:box-shadow .16s,transform .16s,border-color .16s}
.pchip:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.pchip.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandsoft),var(--sh1)}
.pchip .dt{width:8px;height:8px;border-radius:50%;flex:none}
.pchip .n{font-family:var(--mono);font-size:12.5px;font-weight:600}
.pchip.zero{opacity:.5}

/* ─── tables ─── */
.tbl{background:var(--card);border:1px solid var(--hair);border-radius:13px;box-shadow:var(--sh1);overflow:hidden}
.tsc{overflow-x:auto}
.trow{display:grid;gap:13px;padding:12px 18px;align-items:center;border-top:1px solid var(--hair)}
.trow.h{border-top:none;background:var(--tint)}
.trow.h span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gr);font-weight:700}
.tb .trow{cursor:pointer;transition:background .12s,box-shadow .12s}
.tb .trow:hover{background:var(--tint);box-shadow:inset 3px 0 0 var(--brand2)}
.cell{min-width:0}
.cell .v{font-size:13.5px;overflow-wrap:anywhere}
.cell .v.mono{font-family:var(--mono);font-size:12.5px}
.cell .s{font-size:11.5px;color:var(--gr);margin-top:2px;overflow-wrap:anywhere}
.cell .s.bad{color:var(--bad);font-weight:500}
.empty{padding:46px 20px;text-align:center;color:var(--gr)}
.empty .ei{font-size:26px;opacity:.4;display:block;margin-bottom:9px}
.empty p{font-size:13.5px;margin-bottom:13px}

/* ─── chips ─── */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.n{background:var(--tint2);color:var(--gr)}
.chip.b{background:var(--brandsoft);color:var(--brand)}
.chip.v{background:var(--oksoft);color:var(--ok)}
.chip.r{background:var(--warnsoft);color:var(--warn)}
.chip.d{background:var(--badsoft);color:var(--bad)}
.chip.pl::before{display:none}

/* ─── due pill ─── */
.due{font-family:var(--mono);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.due.late{color:var(--bad)}.due.soon{color:var(--warn)}.due.ok{color:var(--ok)}
.due .sub{font-family:Inter;font-size:10.5px;font-weight:400;color:var(--gr)}

/* ─── assignee avatars ─── */
.asg{display:flex;gap:3px}
.ava{width:25px;height:25px;border-radius:50%;background:var(--brandsoft);color:var(--brand);display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--hair)}
.ava.none{background:transparent;border:1.5px dashed #C8CFDB;box-shadow:none;color:#C8CFDB}
.ava.self{box-shadow:0 0 0 1.5px var(--bad)}

/* ─── filter bar ─── */
.fbar{background:var(--card);border:1px solid var(--hair);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:var(--sh1);margin-bottom:14px}
.pill{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--gr);transition:background .13s,color .13s}
.pill:hover{background:var(--bg);color:var(--ink)}
.pill.on{background:var(--brandsoft);color:var(--brand);font-weight:600}
.pill.urg{color:var(--bad)}.pill.urg.on{background:var(--badsoft)}
.pill .n{font-family:var(--mono);font-size:11.5px;opacity:.75}
.fbar .sp{margin-left:auto;display:flex;align-items:center;gap:9px}
.inp{font-size:13.5px;padding:7px 11px;border-radius:9px;border:1px solid var(--hair);background:var(--tint);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
.inp:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brandsoft)}
.inp.mono{font-family:var(--mono)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:74px}
.fbar .inp{width:auto;min-width:170px}
.cnt{font-size:12.5px;color:var(--gr);margin:0 2px 12px;display:flex;align-items:center;gap:7px}
.cnt b{font-family:var(--mono);color:var(--ink);font-weight:600}

/* ─── forms ─── */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.fld{min-width:0}
.fld label{font-size:11.5px;font-weight:600;color:var(--gr);display:block;margin-bottom:5px}
.fld .hint{font-size:11.5px;color:var(--gr);margin-top:5px}
.fld .ro{padding:7px 11px;border-radius:9px;background:var(--tint2);color:var(--gr);font-size:13.5px;border:1px solid var(--hair)}
.seg{display:inline-flex;background:var(--tint2);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--gr);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.1)}

/* ─── tabs ─── */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--hair);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--gr);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.tabs .bdg{background:var(--brand);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

/* ─── banners ─── */
.bnr{border-radius:13px;padding:14px 17px;margin-bottom:16px;display:flex;align-items:flex-start;gap:13px;border:1px solid;font-size:13.5px}
.bnr .bi{font-size:17px;flex:none;line-height:1.3}
.bnr .bt{font-weight:600;margin-bottom:2px}
.bnr .bs{font-size:12.5px;color:var(--gr);margin-top:3px}
.bnr .ba{margin-left:auto;display:flex;gap:8px;flex:none}
.bnr.d{background:var(--badsoft);border-color:#F3CFCF}.bnr.d .bt{color:var(--bad)}
.bnr.r{background:var(--warnsoft);border-color:var(--flagline)}.bnr.r .bt{color:var(--warn)}
.bnr.v{background:var(--oksoft);border-color:#BFE3D0}.bnr.v .bt{color:var(--ok)}
.bnr.b{background:var(--brandsoft);border-color:#D5D8FB}.bnr.b .bt{color:var(--brand)}

/* ─── assumption flag ─── */
.asm{background:repeating-linear-gradient(135deg,var(--flag),var(--flag) 9px,var(--warntint) 9px,var(--warntint) 18px);border:1px dashed var(--flagline);border-radius:9px;padding:13px 16px;font-size:12.5px;margin-bottom:16px;display:flex;gap:11px}
.asm b{color:#92610A;display:block;margin-bottom:2px;font-size:12.5px}
.asm .ai{font-size:14.5px;flex:none}

/* ─── misc ─── */
.rows{display:grid;gap:1px;background:var(--hair);border-radius:9px;overflow:hidden;border:1px solid var(--hair)}
.rw{background:var(--card);padding:12px 16px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px}
.rw .sd{font-size:11.5px;color:var(--gr);margin-top:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:13.5px}
.kv dt{color:var(--gr);font-size:12.5px}
.kv dd{min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:5px;background:var(--rail);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--brand2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.mat{width:100%;border-collapse:collapse;font-size:12.5px}
.skip{position:absolute;left:-9999px;top:8px;z-index:80;background:var(--brand);color:#fff;
 padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600}
.skip:focus{left:246px}
.burger{display:none}
.who{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hair);border-radius:9px;
 padding:5px 11px 5px 6px;cursor:pointer;margin-left:4px}
.who:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(79,70,229,.10)}
.who:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button.ava{border:none;font:inherit;cursor:pointer;padding:0}
button.ava:hover{filter:brightness(1.08);box-shadow:0 0 0 2px var(--brandsoft)}
button.ava:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.corner{background:var(--brandsoft);color:var(--brand)}
.split{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--rail)}
.step{flex:1;min-width:140px;padding:9px 12px 9px 9px;border-radius:9px;text-align:left;display:block;
 transition:background .15s,box-shadow .15s}
.step:hover{background:var(--tint)}
.step:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.step .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.step .sn{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.step .sd2{display:block;font-size:12.5px;padding-left:30px;line-height:1.45}
.step.now{background:var(--tint2)}
.lit{animation:lit 1.5s ease-out}
@keyframes lit{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:0 0 0 3px transparent}}
.kpi.stat{background:transparent;border-color:transparent;box-shadow:none;padding-left:0;padding-right:0}
.kpi.stat .t{opacity:.85}
.kpis:has(.kpi.stat:first-child){gap:26px}
.kpi[role=button]{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.kpi[role=button]:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(79,70,229,.10)}
.kpi[role=button]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kpi.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.brand{color:var(--brand)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--nav);color:#fff;
 padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:550;box-shadow:0 8px 26px rgba(15,23,42,.28);
 opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90}
#toast.on{opacity:1;transform:translate(-50%,0)}
table.mat tr.clk{cursor:pointer}
table.mat tr.clk:hover td{background:var(--brandsoft)}
table.mat tr.clk:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.mat td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--hair)}
.mat th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gr);font-weight:700;background:var(--tint);white-space:nowrap}
.mat td.n{font-family:var(--mono);text-align:right}
.mat td.tot{font-family:var(--mono);text-align:right;font-weight:700;background:var(--tint)}
.mat tr:hover td{background:var(--tint)}
.stepn{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 0}
.stepn .sn{width:22px;height:22px;border-radius:50%;background:var(--brandsoft);color:var(--brand);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.stepn .sn.done{background:var(--oksoft);color:var(--ok)}
.stepn .sn.now{background:var(--brand);color:#fff}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;z-index:60;padding:20px;backdrop-filter:blur(3px)}

.modal{background:var(--card);border-radius:13px;box-shadow:0 24px 60px rgba(15,23,42,.3);max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal .mh{padding:19px 22px;border-bottom:1px solid var(--hair);display:flex;align-items:center}
.modal .mh h3{font-size:17px;font-weight:600}
.modal .mh .x{margin-left:auto;font-size:19px;color:var(--gr);width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.modal .mh .x:hover{background:var(--bg)}
.modal .mb{padding:21px 22px}
.modal .mf{padding:15px 22px;border-top:1px solid var(--hair);display:flex;gap:9px;justify-content:flex-end;background:var(--tint);border-radius:0 0 15px 15px}

main.anim>*{animation:fu .3s cubic-bezier(.2,.7,.3,1) both}
main.anim>*:nth-child(2){animation-delay:.04s}
main.anim>*:nth-child(3){animation-delay:.08s}
main.anim>*:nth-child(n+4){animation-delay:.12s}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:1080px){.two{grid-template-columns:1fr}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;z-index:60;width:262px;transform:translateX(-100%);
   transition:transform .22s ease;box-shadow:var(--sh2)}
 body.navopen .side{transform:none}
 body.navopen::after{content:'';position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:55}
 .burger{display:grid!important}
 .wrap{padding-left:16px;padding-right:16px}
 .who span:last-child{display:none}
}
@media(max-width:560px){
 .kpis{grid-template-columns:1fr 1fr}
 .frm{grid-template-columns:1fr}
 .hd{flex-direction:column;align-items:flex-start;gap:12px}
 .hd .r{width:100%;flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ══════════ helpers ══════════ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=(t,k)=>`<span class="chip ${k||'n'}">${esc(t)}</span>`;
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* Date policy — ONE format everywhere. MM/DD/YYYY, US legal convention.
   Deadlines are stated in ET (the client's zone) with the operator's local zone secondary. */
const TZ='ET', TZ2='IST';
const pad=n=>String(n).padStart(2,'0');
/* One format, company-wide. Effective dates are legally material, so this is a
   single setting rather than a per-screen choice — and it is honoured everywhere. */
let DATEFMT='MM/DD/YYYY';
const fmtDate=d=>DATEFMT==='DD/MM/YYYY'
  ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`
  : `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`;
const fmtTime=d=>{let h=d.getHours(),m=pad(d.getMinutes()),ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m} ${ap}`;};
const fmtDT=d=>`${fmtDate(d)} ${fmtTime(d)}`;
const NOW=new Date(2026,7,3,17,30); // Mon Aug 3 2026, 5:30 PM ET — fixed clock, end of the working day
const hrs=h=>new Date(NOW.getTime()+h*3600000);
function dueCell(d){
 const diff=(d-NOW)/3600000;
 const k=diff<0?'late':diff<4?'soon':'ok';
 const rel=diff<0?`${Math.abs(Math.round(diff))}h overdue`
  :diff<24?`in ${Math.round(diff)}h`:`in ${Math.round(diff/24)}d`;
 return `<span class="due ${k}">${fmtDate(d)} ${fmtTime(d)}<span class="sub">${rel}</span></span>`;
}
const initials=n=>n.split(/[\s.]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();

/* ══════════ tenant ══════════ */
const TENANTS=[
 {id:'ka',name:'Keystone Abstract',plan:'Professional · 12 seats',state:'PA'},
 {id:'ps',name:'Peach State Abstract',plan:'Professional · 8 seats',state:'GA'},
 {id:'bg',name:'Bluegrass Title Svc',plan:'Starter · 4 seats',state:'KY'},
 {id:'new',name:'+ Add a company',plan:'',state:''}];
let tenant=TENANTS[0];

/* ══════════ navigation ══════════ */
/* What each entry needs. Anything not listed is open to everyone signed in. */
const NAVPERM={assign:'assign',intake:'all',billing:'pricing',leads:'pricing',reports:'all',
 integ:'config',company:'people',dash:'all',mywork:null,repgen:null,orders:null,
 counties:null,linkcheck:null,myperf:null,mypay:null,
 payroll:'pricing',payslips:'pricing',attend:'all',leave:null,hiring:'people',petty:'pricing'};
function visibleNav(){
 return NAV.map(g=>({...g,t:g.t.filter(t=>{
   const need=NAVPERM[t[1]];
   if(t[1]==='mywork') return !can('all');            // leads and admins use the dashboard
   if(t[1]==='myperf') return meRec().dep.length>0;   // only people who do the work
   if(t[1]==='mypay')  return !can('pricing');        // payroll people use the run itself

   if(t[1]==='dash')   return can('all');
   return !need||can(need);
 })})).filter(g=>g.t.length);
}
const NAV=[
 {l:'Production',t:[['My work','mywork','◱'],['My payslips','mypay','₹'],['How I’m doing','myperf','★'],['Dashboard','dash','◱'],['Orders','orders','☰'],['Assignment','assign','⇄'],['Order intake','intake','✉'],['Report generator','repgen','✎']]},
 {l:'Business',t:[['Leads','leads','◎'],['Invoicing','billing','$']]},
 {l:'HRMS',t:[
   ['Attendance','attend','◷'],
   ['Leave','leave','◎'],
   ['Payroll','payroll','₹'],
   ['Payslips','payslips','▤'],
   ['Recruitment','hiring','⊕'],
   ['Petty cash','petty','◫']]},
 {l:'Reference',t:[['County coverage','counties','◈'],['Link monitor','linkcheck','◉']]},
 {l:'Insight',t:[['Reports','reports','▤']]},
 {l:'Configure',t:[['Integrations','integ','⚯'],['Company','company','⚙']]}];

const S={};
let view='dash', PREVVIEW='dash', SEL={}, PILLS={};
function pick(k,v){SEL[k]=v;go(view);}
function setPill(id,k){PILLS[id]=k;go(view);}

/* ══════════ shared components ══════════ */
function table(c){
 const act=c.active||'all';
 /* A row can belong to more than one filter — an invoice is both owing and
    overdue — so k may be a key or a list of them. */
 const rows=act!=='all'?c.rows.filter(r=>Array.isArray(r.k)?r.k.includes(act):r.k===act):c.rows;
 const den=act==='all'?(c.total??c.rows.length):((c.pills||[]).find(p=>p.key===act)?.count??rows.length);
 const tm=c.cols.map(x=>`minmax(${x.w||100}px,${x.f||1}fr)`).join(' ');
 const pills=(c.pills||[]).map(p=>`<button class="pill ${p.urgent?'urg':''} ${p.key===act?'on':''}" aria-pressed="${p.key===act}" onclick="setPill('${c.id}','${p.key}')">${esc(p.label)}${p.count!=null?`<span class="n">${p.count}</span>`:''}</button>`).join('');
 const bar=(pills||c.search)?`<div class="fbar">${pills}<div class="sp">${(c.filters||[]).map(f=>`<select class="inp" aria-label="${esc(f[0])}" onchange="pick('${f[1]}',this.value)">${f[2].map(o=>`<option value="${esc(o[0])}"${SEL[f[1]]===o[0]||(!SEL[f[1]]&&o[0]==='all')?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`).join('')}${c.search?`<input class="inp" placeholder="${esc(c.search)}" aria-label="${esc(c.search)}" oninput="tsearch(this)">`:''}</div></div>
 <p class="cnt"><span>ⓘ</span> Showing <b>${rows.length}</b> of <b>${den}</b> ${esc(c.noun||'orders')}</p>`:'';
 const head=`<div class="trow h" style="grid-template-columns:${tm}">${c.cols.map(x=>`<span>${esc(x.l)}</span>`).join('')}</div>`;
 const rowAct=r=>r.oc?`onclick="${r.oc}" onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();${r.oc}}"`:r.go?`onclick="go('${r.go}')" onkeydown="if(event.key==='Enter'){event.preventDefault();go('${r.go}')}"`:'';
 const body=rows.length?rows.map(r=>`<div class="trow" style="grid-template-columns:${tm}" ${(r.go||r.oc)?`role="button" tabindex="0" ${rowAct(r)}`:''}>${r.c.map(x=>`<div class="cell">${x.chip?chip(x.v,x.chip):x.raw?x.v:`<div class="v ${x.mono?'mono':''}">${esc(x.v)}</div>`}${x.s?`<div class="s ${x.bad?'bad':''}">${esc(x.s)}</div>`:''}</div>`).join('')}</div>`).join('')
  :`<div class="empty"><span class="ei">☰</span><p>${esc(c.emptyText||'No rows match this filter.')}</p></div>`;
 return `${bar}<div class="tbl"><div class="tsc"><div style="min-width:${c.min||860}px">${head}<div class="tb">${body}</div></div></div></div>`;
}
function tsearch(inp){
 const q=inp.value.trim().toLowerCase();
 let el=inp.closest('.fbar'); el=el&&el.nextElementSibling;
 while(el&&!(el.classList&&el.classList.contains('tbl')))el=el.nextElementSibling;
 if(!el)return;
 el.querySelectorAll('.tb .trow').forEach(r=>{r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none';});
}
const pageHead=(t,sub,actions)=>`<div class="hd"><div><h1 class="pg">${esc(t)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div>${actions?`<div class="r">${actions}</div>`:''}</div>`;
/* Workload lives inside Reports now, so its own page titles step down to section
   headings — one page, one <h1>. */
let EMBED=false;
const wHead=(t,sub,actions)=>EMBED
 ? `<div class="ch" style="border:none;padding:2px 0 14px"><div><h2 style="margin:0;font-size:17px">${esc(t)}</h2>${sub?`<div class="gr" style="font-size:12.5px;margin-top:3px">${esc(sub)}</div>`:''}</div>${actions?`<div class="r">${actions}</div>`:''}</div>`
 : pageHead(t,sub,actions);
/* ══════════ export ══════════
   A real file, built from whatever is on screen after the filters. Exporting
   something different from what you are looking at is worse than not exporting. */
let LASTCSV=null;                                     // kept so it can be checked
function toCSV(rows){
 const q=v=>{const t=v===null||v===undefined?'':String(v);
   return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t;};
 return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function downloadCSV(name,rows){
 const csv=toCSV(rows);
 LASTCSV={name,rows,csv};
 try{
  const blob=new Blob([`﻿${csv}`],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},0);
 }catch(e){ /* no download in this environment — the data is still built */ }
 toast(`${name} — ${rows.length-1} row${rows.length===2?'':'s'}`);
 return csv;
}
/* a quiet confirmation, rather than a modal that has to be dismissed */
/* Each export builds from the same filtered data the screen is showing. */
const dstamp=()=>`${NOW.getFullYear()}-${pad(NOW.getMonth()+1)}-${pad(NOW.getDate())}`;
function exportOrders(){
 const sf=SEL.ofStaff||'all', df=SEL.ofDept||'all', pf=SEL.ofPr||'all', cf=SEL.ofCl||'all';
 const list=ORDERS.filter(o=>(sf==='all'||Object.values(o.a).includes(sf))&&(df==='all'||!!o.a[df])
   &&(pf==='all'||o.pr===pf)&&(cf==='all'||o.cl===cf));
 downloadCSV(`orders-${dstamp()}.csv`,
  [['Order','Client','Product','Property','County','State','Stage','Due','Received','Fee',...STAGES],
   ...list.map(o=>[o.id,o.cl,o.pr,o.prop,o.co,o.st,st(o.stt),fmtDT(o.due),fmtDT(o.recv),o.fee,
     ...STAGES.map(g=>o.a[g]?who(o.a[g]):'')])]);
}
function exportClients(){
 downloadCSV(`clients-${dstamp()}.csv`,
  [['Client','Code','Active','Orders','Invoiced','Total','Paid','Outstanding','Terms','Email','Phone'],
   ...CLIENTS.map(c=>[c.n,c.dn,c.active===false?'no':'yes',c.orders,c.inv,c.total,c.paid,r2(c.total-c.paid),c.terms,c.e,c.p])]);
}
function exportStaff(){
 downloadCSV(`staff-${dstamp()}.csv`,
  [['Name','Email','Departments','Role','Daily target','Assigned today','Completed','Pending','Availability','Active'],
   ...STAFF.map(p=>{const wk=WORK[p.id]||{done:0,pend:0,tot:0};
     return [p.n,p.e,p.dep.join(' | '),roleName(p.r),p.cap,wk.tot,wk.done,wk.pend,AVAIL[p.avail][0],p.active===false?'no':'yes'];})]);
}
function exportInvoices(){
 const fc=SEL.ivc||'all', fm=SEL.ivm||'all', fs=PILLS.billing||'all';
 const list=INVOICES.filter(i=>(fc==='all'||i.cl===fc)&&(fm==='all'||i.m===fm)&&(fs==='all'||i.st===fs));
 downloadCSV(`invoices-${dstamp()}.csv`,
  [['Invoice','Client','Code','Month','Issued','Orders','Amount','Paid','Outstanding','Status'],
   ...list.map(i=>[i.id,i.cl,i.code,i.m,fmtDate(i.issued),i.orders,i.amt,i.paid,r2(i.amt-i.paid),ISTATUS[i.st][0]])]);
}
function exportCounties(){
 downloadCSV(`county-coverage-${dstamp()}.csv`,
  [['County','State','Index from',...LINKTYPES.map(t=>t.n),...LINKTYPES.map(t=>`${t.n} status`)],
   ...COUNTIES.map(c=>[c.n,c.st,c.idx||'',
     ...LINKTYPES.map(t=>(c.links&&c.links[t.k]&&c.links[t.k].u)||''),
     ...LINKTYPES.map(t=>LSTATE[(c.links&&c.links[t.k]&&c.links[t.k].s)||'none'][0])])]);
}
function exportReport(){
 const tab=SEL.rptab||'Received';
 if(tab==='Received'){
  const os=dayOrders();
  return downloadCSV(`received-${dstamp()}.csv`,
   [['Client','Received',...STAGES,'Completed','WIP'],
    ...[...new Set(os.map(o=>o.cl))].sort().map(c=>{const m=os.filter(o=>o.cl===c), d=m.filter(o=>!curStage(o)).length;
      return [c,m.length,...STAGES.map(g=>m.filter(o=>curStage(o)===g).length),d,m.length-d];})]);
 }
 if(tab==='Assigned'){
  const as=dayAssigns(), prs=PRODUCTS.map(p=>p.id).filter(id=>as.some(a=>a.o.pr===id));
  return downloadCSV(`assigned-${dstamp()}.csv`,
   [['Department','Staff',...prs,'Total'],
    ...ASSIGN_STAGES.flatMap(d=>STAFF.filter(x=>x.dep.includes(d)).map(x=>{
      const his=as.filter(a=>a.stage===d&&a.who===x.id);
      return [d,x.n,...prs.map(p=>his.filter(a=>a.o.pr===p).length),his.length];}))]);
 }
 if(tab==='Turnaround'){
  const r=rangeOf('t');
  return downloadCSV(`on-time-${dstamp()}.csv`,
   [['Delivered','Order','Client','Product','Promise hrs','Took hrs','Late',...ASSIGN_STAGES.map(x=>`${x} hrs`)],
    ...DELIVERIES.filter(x=>inRange(x.d,r)).map(x=>[x.dk,x.id,x.cl,x.pr,x.slaH,r2(x.hrs),x.late?'yes':'no',
      ...ASSIGN_STAGES.map(g=>r2(x.st[g]||0))])]);
 }
 if(tab==='Quality'){
  const r=qcRange();
  return downloadCSV(`quality-${dstamp()}.csv`,
   [['Date','Order','Client','Product','Stage','Worked by','Rated by','Accuracy','Completeness','Formatting','Defect','Reason'],
    ...QCLOG.filter(x=>inRange(x.d,r)).map(x=>[x.dk,x.order,x.cl,x.pr,x.stage,x.onName,x.byName,x.acc,x.comp,x.fmt,x.defect?'yes':'no',x.note||''])]);
 }
 const byDept=tab==='By department';
 return downloadCSV(`${byDept?'department':'staff'}-workload-${dstamp()}.csv`,
  [[byDept?'Department':'Staff','Completed','Pending','Total','% complete'],
   ...(byDept?DEPTS.map(d=>[d.d,d.done,d.pend,d.tot,d.pct])
             :WORKED.map(x=>[x.s.n,x.done,x.pend,x.tot,x.pct]))]);
}
function exportAbstract(kind){
 const rows=[['Section','Field','Value','Flag']];
 RSECT.forEach(sec=>sec[1].forEach(f=>rows.push([sec[0],f[0],f[1],f[2]||''])));
 if(kind==='json'){
  const obj={}; RSECT.forEach(sec=>{obj[sec[0]]=Object.fromEntries(sec[1].map(f=>[f[0],f[1]]));});
  const txt=JSON.stringify(obj,null,2);
  LASTCSV={name:`abstract-${dstamp()}.json`,rows,csv:txt};
  try{const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=LASTCSV.name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}catch(e){}
  return toast(`${LASTCSV.name} — ${rows.length-1} fields`);
 }
 return downloadCSV(`abstract-${dstamp()}.csv`,rows);
}
/* Saying plainly what is missing beats a box that pretends something happened. */
function notBuilt(what,needs){
 openModal(`${what} export is not built yet`,
  `<p style="font-size:13.5px">Producing a ${esc(what)} needs <b>${esc(needs)}</b>, which I do not have.</p>
   <p class="gr" style="font-size:12.5px">CSV and JSON carry the same fields and are working now — every value on this screen, section by section. Send me one of your finished reports and the ${esc(what)} version becomes a formatting job rather than a guess.</p>`,
  `<button class="btn g" onclick="closeModal()">Close</button>
   <button class="btn" onclick="closeModal();exportAbstract('csv')">Export CSV instead</button>`);
}
function exportEverything(){
 exportOrders(); exportClients(); exportStaff(); exportInvoices(); exportCounties();
 toast('Five files — orders, clients, staff, invoices, county coverage');
}
/* ── actions that used to be alerts, now doing the thing ── */
let ORDNOTES={};
function addOrderNote(id){
 const el=document.getElementById('ordNote'); const v=(el&&el.value||'').trim();
 if(!v) return toast('Nothing to add — type the note first');

function dryRun(draft){

  const at=RULES.findIndex(x=>x.k==='prefer');
  const tmp={id:'__draft',n:draft.n,k:draft.k,on:true,cond:draft.cond,pool:draft.pool};
  RULES.splice(at<0?RULES.length:at,0,tmp);
  undo=()=>{const i=RULES.findIndex(x=>x.id==='__draft'); if(i>=0) RULES.splice(i,1);};
 }
 const r=runDay(DAY);
 if(undo) undo();
 const today=r.assigns.filter(a=>a.today).length, ex=r.exc.filter(e=>e.today).length;
 const live=RUN.assigns.filter(a=>a.today).length;
 openModal(draft&&draft.n?`Dry run — ${draft.n}, not saved`:'Dry run — nothing was changed',
  `<div class="kpis" style="grid-template-columns:1fr 1fr">
    <div class="kpi"><div class="t">Would place</div><div class="v">${today}</div>
     <div class="d ${today===live?'gr':today>live?'ok':'warn'}">${today===live?'the same as now':`${today>live?'+':''}${today-live} against now`}</div></div>
    <div class="kpi ${ex?'warnk':''}"><div class="t">Would leave unplaced</div><div class="v">${ex}</div>
     <div class="d gr">${ex===RUN.exc.filter(e=>e.today).length?'unchanged':'different from now'}</div></div>
   </div>
   <p class="gr" style="font-size:12.5px;margin-top:12px">Run against today's ${RUN.today.length} orders with the rules exactly as they stand. No queue was touched — this is what <i>would</i> happen.</p>`,

 if(PASTDUE) out.push({sev:'bad',t:`${PASTDUE} order${PASTDUE===1?'':'s'} past due`,d:'The client is already owed an explanation',go:'orders'});
 const doomed=ORDERS.filter(o=>!o.done&&o.due>=NOW&&orderPlan(o).doomed);
 if(doomed.length) out.push({sev:'bad',t:`${doomed.length} order${doomed.length===1?'':'s'} cannot finish in time`,
   d:'Not late yet — but the stages still to run need more time than the promise has left',go:'orders'});
 const slipping=ORDERS.filter(o=>!o.done&&!orderPlan(o).doomed&&orderPlan(o).behind);
 if(slipping.length) out.push({sev:'warn',t:`${slipping.length} order${slipping.length===1?'':'s'} behind an internal checkpoint`,
   d:'Still recoverable, but the slack is going',go:'orders'});
 if(RUN.exc.length) out.push({sev:'warn',t:`${RUN.exc.length} stages could not be assigned`,d:'Waiting on a person to place them',go:'assign'});
 const fu=FOLLOWUP(); if(fu) out.push({sev:'warn',t:`${fu} lead${fu===1?'':'s'} need following up`,d:'Flagged, or gone quiet on their own',go:'leads'});
 const thin=DEPTLIST.filter(d=>STAFF.filter(x=>x.dep.includes(d.n)&&x.active!==false&&x.avail==='ok').length===0);
 if(thin.length) out.push({sev:'bad',t:`${thin.map(d=>d.n).join(', ')} has nobody available`,d:'Any order needing that stage has nowhere to go',go:'depts'});
 return out;

/* ══════════ PAYROLL ══════════
   Salary is derived from one number — the CTC on a person's record — through a
   structure that follows the 50% wage rule in the new labour codes: basic must be
   at least half of the total. Everything else on a payslip falls out of that,
   attendance, and the statutory settings below. Nothing is typed twice. */
let PAYCFG={
 currency:'INR', sym:'₹',
 basicPct:50,                    // labour codes: basic must be >= 50% of CTC
 hraPctOfBasic:40,
 pfPct:12, pfWageCeiling:15000,  // EPF: 12% of basic, capped at a 15,000 wage
 pfOnFullBasic:false,            // some employers contribute on the whole basic
 esiPct:0.75, esiGrossLimit:21000,
 ptState:'Karnataka', ptAmount:200,
 gratuityPct:4.81,               // provisioned monthly, paid at exit
 regime:'new',
 payDay:1,                       // salary credited on the 1st of the following month
 bankName:'HDFC Bank', bankAcct:'50200012345678'};

/* New-regime slabs, FY 2025-26. Illustrative — confirm against your provider. */
const TAXSLABS=[[400000,0],[800000,5],[1200000,10],[1600000,15],[2000000,20],[2400000,25],[Infinity,30]];
const STDDED=75000;
/* The old regime still exists, and for anyone with real deductions it can win.
   Which one applies is the employee's choice, so it has to be theirs to make. */
const OLDSLABS=[[250000,0],[500000,5],[1000000,20],[Infinity,30]];
const OLDSTD=50000;
const DECLTYPES=[
 {k:'80c',n:'80C — PF, insurance, ELSS, tuition',cap:150000,d:'Your own provident fund already counts towards this.'},
 {k:'80d',n:'80D — health insurance premium',cap:25000,d:'Higher if a parent over sixty is covered.'},
 {k:'hra',n:'House rent paid',cap:0,d:'Exempt up to the least of three formulas. Needs the landlord\'s PAN above a lakh a year.'},
 {k:'home',n:'24(b) — home loan interest',cap:200000,d:'On a self-occupied property.'},
 {k:'80ccd',n:'80CCD(1B) — extra NPS',cap:50000,d:'On top of 80C.'}];
let DECLS={};            // staffId -> {k: amount}
let DECLSTATE={};        // staffId -> 'draft' | 'submitted' | 'verified'
function declTotal(id){const d=DECLS[id]||{};
 return DECLTYPES.reduce((a,t)=>a+Math.min(d[t.k]||0,t.cap||Infinity),0);}
function taxUnder(regime,gross12,id){
 if(regime==='new'){
  const ti=Math.max(0,gross12-STDDED);
  let tax=0,prev=0;
  for(const [cap,rate] of TAXSLABS){ if(ti>prev) tax+=(Math.min(ti,cap)-prev)*rate/100; prev=cap; if(ti<=cap) break; }
  if(ti<=1200000) tax=0;
  return Math.round(tax*1.04);
 }
 const ti=Math.max(0,gross12-OLDSTD-declTotal(id));
 let tax=0,prev=0;
 for(const [cap,rate] of OLDSLABS){ if(ti>prev) tax+=(Math.min(ti,cap)-prev)*rate/100; prev=cap; if(ti<=cap) break; }
 if(ti<=500000) tax=0;
 return Math.round(tax*1.04);
}
let REGIME={};           // staffId -> 'new' | 'old'
const regimeOf=id=>REGIME[id]||PAYCFG.regime;

const inr=n=>PAYCFG.sym+Math.round(n).toLocaleString('en-IN');
const inr2=n=>PAYCFG.sym+(Math.round(n*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

/* One CTC in, a full structure out. */
function structureOf(p){
 const ctc=p.ctc||0, m=ctc/12;
 const basic=Math.round(m*PAYCFG.basicPct/100);
 const hra=Math.round(basic*PAYCFG.hraPctOfBasic/100);
 const pfWage=PAYCFG.pfOnFullBasic?basic:Math.min(basic,PAYCFG.pfWageCeiling);
 const epfEr=Math.round(pfWage*PAYCFG.pfPct/100);
 const grat=Math.round(basic*PAYCFG.gratuityPct/100);
 /* CTC = gross + employer PF + gratuity, so special allowance is the balance */
 const special=Math.max(0,Math.round(m-epfEr-grat-basic-hra));
 const gross=basic+hra+special;
 return {ctc,monthly:Math.round(m),basic,hra,special,gross,epfEr,grat,pfWage};
}
/* Annual tax under the new regime, spread evenly across twelve months. */
function annualTax(gross12){
 const ti=Math.max(0,gross12-STDDED);
 let tax=0, prev=0;
 for(const [cap,rate] of TAXSLABS){ if(ti>prev) tax+=(Math.min(ti,cap)-prev)*rate/100; prev=cap; if(ti<=cap) break; }
 if(ti<=1200000) tax=0;                        // 87A rebate
 return Math.round(tax*1.04);                  // + 4% cess
}

/* Who approves this person's leave. A lead in their own department if there is
   one, otherwise the company admin — so a request always has a named owner
   rather than landing in a queue anybody might pick up. */
function managerOf(p){
 if(!p) return null;
 if(p.mgr){ const m=STAFF.find(x=>x.id===p.mgr); if(m) return m; }
 const lead=STAFF.find(x=>x.r==='lead'&&x.active!==false&&x.id!==p.id&&x.dep.some(d=>p.dep.includes(d)));

/* ── the month's attendance, which is what makes a payslip differ from a contract ── */
const PAYMONTHS=['Mar 2026','Apr 2026','May 2026','Jun 2026','Jul 2026'];
const MONTHDAYS={'Mar 2026':31,'Apr 2026':30,'May 2026':31,'Jun 2026':30,'Jul 2026':31};
let _aseed=760315;
const arnd=()=>{_aseed=(_aseed*1103515245+12345)%2147483648; return _aseed/2147483648;};
let ATT={};
/* How many of the month's working days this person was actually employed for. */
function payableDays(p,mn,working){
 if(!p.doj) return working;
 const [m,d,y]=p.doj.split('/').map(Number);
 const [mon,yr]=mn.split(' ');
 const mi=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mon)+1;
 if(y>+yr||(y==+yr&&m>mi)) return 0;             // had not joined yet
 if(y<+yr||(y==+yr&&m<mi)) return working;       // already here for the whole month
 const days=MONTHDAYS[mn];
 return Math.max(0,Math.round(working*(days-d+1)/days));   // joined during this month
}
function makeAttendance(){
 const out={};
 PAYMONTHS.forEach(mn=>{
  out[mn]={};
  const days=MONTHDAYS[mn];
  const hol=holidaysIn(mn).filter(h=>!h.opt).length;
  const working=days-Math.floor(days/7)-hol;      // a rest day a week, less the holidays
  STAFF.forEach(p=>{
   const r=arnd();
   const lop = r<0.72?0 : r<0.90?1 : r<0.97?2 : 3;
   const paidLeave = arnd()<0.45?Math.ceil(arnd()*2):0;
   /* somebody who joined mid-month was not there for the whole of it */
   const pay=payableDays(p,mn,working);
   out[mn][p.id]={days,working,hol,lop,paidLeave,payable:pay,
     joined:pay<working, present:Math.max(0,pay-lop-paidLeave)};
  });
 });
 return out;
}

/* ── one payslip ── */
function payslipOf(p,mn){
 const st=structureOf(p), a=(ATT[mn]||{})[p.id]||{days:30,working:26,lop:0,paidLeave:0,present:26};
 const perDay=st.gross/a.working;
 /* unpaid days, plus any part of the month before they joined */
 const unpaid=a.lop+Math.max(0,a.working-(a.payable??a.working));
 const lopAmt=Math.round(perDay*unpaid);
 const f=a.working?1-unpaid/a.working:1;
 const basic=Math.round(st.basic*f);
 const hra=Math.round(st.hra*f);
 const special=Math.round(st.special*f);
 const gross=basic+hra+special;
 const pfWage=PAYCFG.pfOnFullBasic?basic:Math.min(basic,PAYCFG.pfWageCeiling);
 const epf=Math.round(pfWage*PAYCFG.pfPct/100);
 const esi=gross<=PAYCFG.esiGrossLimit?Math.round(gross*PAYCFG.esiPct/100):0;
 const pt=gross>0?PAYCFG.ptAmount:0;
 const tds=Math.round(taxUnder(regimeOf(p.id),st.gross*12,p.id)/12);
 const arr=arrearsFor(p.id,mn).reduce((a,x)=>a+x.amt,0);
 const cl=claimsFor(p.id,mn).reduce((a,x)=>a+x.amt,0);
 const ln=loanFor(p.id);
 const emi=ln?Math.min(ln.emi,ln.amt-ln.paid):0;
 const ded=epf+esi+pt+tds+emi;
 const ot=otPay(p,mn), otm=otMinsFor(p.id,mn);
 const earnings=[['Basic',basic],['House rent allowance',hra],['Special allowance',special],
   ...(ot?[[`Overtime — ${Math.floor(otm/60)}h ${pad(otm%60)}m approved`,ot]]:[]),
   ...(arr?[['Arrears — '+arrearsFor(p.id,mn)[0].what,arr]]:[])];
 const grossPay=gross+arr+ot;
 return {p,mn,st,a,perDay,lopAmt,unpaid,arr,ot,otm,claims:cl,emi,loan:ln,
   earn:earnings,
   ded:[['Provident fund (employee)',epf],['Professional tax — '+PAYCFG.ptState,pt],
        ...(esi?[['ESI (employee)',esi]]:[]),['Income tax (TDS)',tds],
        ...(emi?[['Advance recovered',emi]]:[])],
   reimb:claimsFor(p.id,mn).map(c=>[c.what,c.amt]),
   gross:grossPay,epf,esi,pt,tds,totalDed:ded,net:grossPay-ded+cl,
   employer:[['Provident fund (employer)',st.epfEr],['Gratuity provision',st.grat]]};
}
/* Year to date, for the payslip footer — the figure people actually check. */
function ytd(p,mn){
 const upto=PAYMONTHS.slice(0,PAYMONTHS.indexOf(mn)+1);
 return upto.reduce((acc,m)=>{const s=payslipOf(p,m);
   acc.gross+=s.gross; acc.ded+=s.totalDed; acc.net+=s.net; acc.tds+=s.tds; return acc;},
   {gross:0,ded:0,net:0,tds:0});
}

/* The run itself: a month moves through these and cannot go back without a reason. */
/* Gratuity: fifteen days of last-drawn basic per completed year, after five.
   The rule is in the Act; what it needs from us is a joining date. */
function yearsServed(p){
 if(!p.doj) return null;
 const [m,d,y]=p.doj.split('/').map(Number);
 return (NOW-new Date(y,m-1,d))/(365.25*24*3600*1000);
}
function settlement(p,lastDay){
 const st=structureOf(p), a=(ATT[PAYMONTHS[PAYMONTHS.length-1]]||{})[p.id]||{working:26};
 const yrs=yearsServed(p);
 const perDay=st.gross/Math.max(1,a.working);
 const dayOfMonth=lastDay?lastDay.getDate():NOW.getDate();
 const salary=Math.round(perDay*Math.round(a.working*dayOfMonth/30));
 const bal=leaveBalance(p.id);
 const encash=Math.round(bal.pl.left*st.basic/26);
 const grat=(yrs!==null&&yrs>=5)?Math.round(st.basic*15/26*Math.floor(yrs)):0;
 const ln=loanFor(p.id);
 const advance=ln?-(ln.amt-ln.paid):0;
 const lines=[
  ['Salary to the last working day',salary],
  [`Leave encashment — ${bal.pl.left} day${bal.pl.left===1?'':'s'} of paid leave`,encash],
  [yrs===null?'Gratuity — no joining date on record'
    :yrs<5?`Gratuity — ${yrs.toFixed(1)} years served, under the five-year threshold`
    :`Gratuity — ${Math.floor(yrs)} completed years at 15 days of basic`,grat],
  ...(advance?[['Advance outstanding, recovered',advance]]:[])];
 return {lines,yrs,total:lines.reduce((a2,l)=>a2+l[1],0),st,bal};
}

/* How the engine is run, as opposed to what it decides. These three were drawn as
   segmented controls and wired to nothing — three settings that looked adjustable
   and were not. They are real now, and where the prototype cannot actually behave

let ENGINE={trigger:'arrival', commit:'auto', onChange:'new'};
const ENGINEOPTS={

   ['hourly','Every hour','Work sits unplaced for up to an hour. Quieter, but the board is behind for most of it.'],

 commit:[['auto','Automatically','Assignments take effect immediately. Exceptions are the only thing that waits for a person.'],

/* ══════════ WHO CAN WORK WHAT ══════════
   Nobody searches every state and nobody types every product. Until now the engine
   assumed anyone in a department could take anything in it, and the three
   hand-written routing rules (LIEN typing, PA searches, Alaska) were the same idea
   written out one case at a time. This is that idea as data instead.

   Coverage is held per person and read by two rules. It is deliberately coarse at
   the top — a person covers whole states — because that is how experience actually
   accumulates: somebody learns Pennsylvania, not Cambria County. Where you need it
   finer, naming counties inside a state narrows them to exactly those. */
/* ── Levels ──────────────────────────────────────────────────────────────
   Thirteen coverage records is thirteen things to keep current, and they drift.
   A level is one coverage shared by everyone on it: widen Level 2 and every
   Level 2 person moves that night. The level is the source of truth — a person's
   profile shows which level they are on, not a tick list of their own, so two
   people on the same level always cover the same thing. That is what makes the
   level a usable answer to "who can do this?".

   The cost is deliberate: there is no way to grant one person a single extra
   state. If somebody genuinely covers more, they are on a different level — or
   the level they are on is wrong. */
let LEVELS=[
 {id:'l1',n:'Level 1',note:'Learning. Current owner searches in the counties they have been shown.',
  states:['PA','GA'],counties:{PA:['Cambria','Luzerne']},products:['COS']},
 {id:'l2',n:'Level 2',note:'Confident on the standard products across the states we work most.',
  states:['PA','GA','CT','KY','TN'],counties:{},products:['COS','TOS','Update','PRLP','LIEN','10Y','20Y']},
 {id:'l3',n:'Level 3',note:'Everything, including the long searches and the courthouse states.',
  states:'all',counties:{},products:'all'}];
const COVSTAGES=['Search','Search QC'];
const levelOf=id=>{const p=STAFF.find(x=>x.id===id); return p&&p.lvl?LEVELS.find(l=>l.id===p.lvl)||null:null;};
const NOLIMIT={states:'all',counties:{},products:'all'};
/* Somebody with no level is not restricted. Defaulting the other way would mean a
   new joiner can be given nothing until an admin remembers to grade them. */
const covOf=id=>levelOf(id)||NOLIMIT;
/* Every state, not only the ones we happen to hold counties for. A level has to be
   able to say "Ohio" before a single Ohio county is on file — otherwise you cannot
   grade somebody for work you are about to start taking. */
const US_STATES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',
 CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',
 ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',
 MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',
 MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',
 NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',
 PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',
 UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};
const stateName=st=>US_STATES[st]||st;
const EVERYSTATE=()=>Object.keys(US_STATES);
/* The states we actually hold counties for. Gap analysis uses this — asking whether
   anybody covers a county we have never heard of would report 3,000 false gaps. */
const ALLSTATES=()=>[...new Set(COUNTIES.map(c=>c.st))].sort();
const countiesIn=st=>COUNTIES.filter(c=>c.st===st).map(c=>c.n).sort();

/* Does this person cover this state, and — if counties were named — this county?
   Naming no counties for a state means the whole state, not none of it. */
function coversPlace(id,st,co){
 const c=covOf(id);
 if(c.states!=='all'&&!c.states.includes(st)) return false;
 const named=c.counties&&c.counties[st];
 if(!named||!named.length) return true;
 return !co||named.includes(co);
}
const coversProduct=(id,pr)=>{const c=covOf(id); return c.products==='all'||c.products.includes(pr);};
const levelOpen=l=>l.states==='all'&&l.products==='all'
  &&!Object.values(l.counties||{}).some(v=>v&&v.length);
const coversAll=id=>levelOpen(covOf(id));

function covWord(c){
 const st=c.states==='all'?'every state':`${c.states.length} state${c.states.length===1?'':'s'}`;
 const narrowed=Object.entries(c.counties||{}).filter(([,v])=>v&&v.length);
 const co=narrowed.length?` (${narrowed.map(([k,v])=>`${k}: ${v.length} count${v.length===1?'y':'ies'}`).join(', ')})`:'';
 const pr=c.products==='all'?'every product':`${c.products.length} product${c.products.length===1?'':'s'}`;
 return `${st}${co} · ${pr}`;
}
/* A level read back as a sentence. The pills say what is ticked; this says what
   that means, which is the thing somebody actually wants to check before saving. */
function levelSentence(l){
 const prods=l.products==='all'?'Every product':(l.products.length?l.products.join(', '):'No products');
 if(!l.products||(!l.products.length&&l.products!=='all')) return 'Covers nothing — no products ticked, so nobody on this level can be given anything.';
 if(l.states!=='all'&&!l.states.length) return `${prods}, but no states ticked — so nobody on this level can be given anything.`;
 const states=l.states==='all'?ALLSTATES():l.states;
 const where=states.map(st=>{

/* Where the company has nobody at all — the number that becomes exceptions tomorrow. */

  for(const st of ALLSTATES()) for(const co of countiesIn(st)){

/* ── putting existing people onto levels ──
   Everyone already had their own coverage. Rather than wipe it, each person is put
   on the level that matches it most closely, and anything that changed as a result
   is recorded so it can be looked at rather than discovered later. */
let LEVELMOVES=[];
function fitLevels(prev){
 LEVELMOVES=[];
 const score=(c,l)=>{
  const states=c.states==='all'?ALLSTATES():c.states;
  const lstates=l.states==='all'?ALLSTATES():l.states;
  const prods=c.products==='all'?PRODUCTS.map(p=>p.id):c.products;
  const lprods=l.products==='all'?PRODUCTS.map(p=>p.id):l.products;
  const overlap=(a,b)=>a.filter(x=>b.includes(x)).length;
  const union=(a,b)=>new Set([...a,...b]).size;
  return overlap(states,lstates)/union(states,lstates)
       + overlap(prods,lprods)/union(prods,lprods);
 };
 STAFF.filter(p=>p.dep.some(d=>COVSTAGES.includes(d))).forEach(p=>{
  const had=prev[p.id]||NOLIMIT;
  const best=LEVELS.slice().sort((a,b)=>score(had,b)-score(had,a))[0];
  p.lvl=best.id;
  const before=covWord(had), after=covWord(best);
  if(before!==after) LEVELMOVES.push({id:p.id,n:p.n,before,after,lvl:best.n});
 });
}

let RULES=[
 {id:'r1',n:'Department membership',k:'block',lock:true,on:true,
  when:'always',then:'Only a member of that stage’s department may take it'},
 {id:'r2',n:'Availability',k:'block',on:true,
  when:'always',then:'Skip anyone on leave or off shift'},
 {id:'r3',n:'Daily target',k:'block',on:true,
  when:'always',then:'Never load anyone past their target'},
 {id:'r4',n:'Self-review',k:'block',lock:true,on:true,
  when:'stage is a QC stage',then:'Never the person who did the paired stage'},
 /* The condition is data, not a closure and not prose. It used to be free text
    beside a hand-written match(), which meant a rule somebody typed in the editor
    could never actually run — the text was a label and the logic was in code. */
 {id:'r5',n:'LIEN typing group',k:'route',on:true,
  cond:{product:'LIEN',stage:'Typing'}, pool:['sk','pn','bn']},
 /* These two replace three hand-written cases — "PA searches to PA-experienced",
    "Alaska needs a courthouse searcher", and the same idea for any state anyone
    adds next. They read each person's coverage rather than carrying a list. */
 {id:'r6',n:'State and county coverage',k:'cover',on:true,
  when:`stage is ${COVSTAGES.join(' or ')}`,then:'Only someone who covers that state, and that county if counties were named',
  stages:COVSTAGES},
 {id:'r7',n:'Product coverage',k:'cover',on:true,
  when:`stage is ${COVSTAGES.join(' or ')}`,then:'Only someone who works that product',
  stages:COVSTAGES},
 {id:'r8',n:'Fill the emptiest first',k:'prefer',lock:true,on:true,
  when:'always',then:'Pick whoever is furthest below their target'}];
const ruleOn=id=>{const r=RULES.find(x=>x.id===id);return r&&r.on;};
/* A condition is three optional tests. Leaving one blank means "any", so an empty
   condition matches everything — which the editor warns about rather than allows
   by accident. */
function ruleMatches(r,o,stage){
 if(r.match) return r.match(o,stage);              // the built-ins still carry their own
 const c=r.cond||{};
 if(c.stage&&c.stage!==stage) return false;
 if(c.product&&c.product!==o.pr) return false;
 if(c.state&&c.state!==o.st) return false;
 return true;
}
/* What a rule reads as, derived from the condition rather than typed alongside it —
   so the sentence on the Rules tab can never disagree with what the engine does. */
function ruleWhen(r){
 if(r.when) return r.when;
 const c=r.cond||{}, bits=[];
 if(c.stage) bits.push(`stage is ${c.stage}`);
 if(c.product) bits.push(`product is ${c.product}`);
 if(c.state) bits.push(`state is ${c.state}`);
 return bits.length?bits.join(' and '):'always';
}
function ruleThen(r){
 if(r.then) return r.then;
 if(r.k==='route') return r.pool&&r.pool.length
   ? `Only ${r.pool.map(who).join(' · ')}`
   : 'Nobody — every matching order becomes an exception';
 if(r.k==='block') return 'Remove everyone this matches from consideration';
 return 'Prefer whoever this matches';
}

/* ── the day: orders arrive 10–15 an hour, and are assigned the moment they land ── */
const DAYCOUNT=5;                                    // today and the four days before it
const dayDate=i=>new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-(DAYCOUNT-1-i));
const dayKey=d=>fmtDate(d);
/* the mix is weighted so it reads like a real day's intake rather than a round robin */
const PRODMIX=['COS','COS','COS','COS','Update','Update','TOS','PRLP','LIEN','10Y','20Y','30Y','40Y','FS+'];
const CLIENTMIX=['MGR','MGR','MGR','MGR','MGR','CSS','CSS','NJ','Morris James','NTC'];
function makeDay(){
 const states=['PA','GA','CT','KY','TN','AK'];
 /* an order without a county cannot be judged against a county rule, and every
    real order has one — the property sits somewhere */
 const cosIn={}; states.forEach(st=>cosIn[st]=COUNTIES.filter(c=>c.st===st).map(c=>c.n));
 const hours=[9,10,11,12,13,14,15,16,17];
 const perDay=[[9,10,8,11,9,8,10,9,7],[10,11,9,12,10,9,11,10,8],[8,9,7,10,8,7,9,8,6],
               [11,12,10,13,11,10,12,11,9],[10,11,9,12,10,9,11,10,8]];
 let n=0; const days=[];
 for(let di=0;di<DAYCOUNT;di++){
  const date=dayDate(di), arrivals=[];
  hours.forEach((h,hi)=>{
   const list=[];
   for(let i=0;i<perDay[di][hi];i++,n++){
    const recv=new Date(date.getFullYear(),date.getMonth(),date.getDate(),h,0);
    list.push({id:`4193${String(101+n).padStart(3,'0')}-1`, hr:h, date, dk:dayKey(date),
     today:di===DAYCOUNT-1, recv,
     pr:PRODMIX[n%PRODMIX.length], st:states[n%states.length], cl:CLIENTMIX[n%CLIENTMIX.length],
     co:(cosIn[states[n%states.length]]||['—'])[n%(cosIn[states[n%states.length]]||['—']).length]});
   }
   arrivals.push({hr:h,orders:list});
  });
  days.push({date,dk:dayKey(date),arrivals});
 }
 return days;
}

/* Applies the rules in order and records WHY each choice was made. */
function runDay(days){
 const load={}, fired={}, narrowed={};
 /* How often a rule was consulted, and how often it actually changed the answer.
    A rule checked 2,160 times that never removed anybody is doing nothing, and
    the count on its own hides that. */
 RULES.forEach(r=>{fired[r.id]=0; narrowed[r.id]=0;});
 const assigns=[], exc=[]; let hourly=[], avoided=0;
 const deptOut=[...new Set(STAGES.filter(g=>{
   const m=STAFF.filter(s=>s.dep.includes(g));
   return m.length&&m.every(s=>s.avail!=='ok');}))];

 for(const day of days){
 /* A daily target resets each morning, so each day is dealt afresh. */
 STAFF.forEach(s=>load[s.id]=s.open);
 const dayHourly=[];
 for(const slot of day.arrivals){
  const hStart=Object.fromEntries(STAFF.map(s=>[s.id,load[s.id]]));
  for(const o of slot.orders){
   const onOrder={}, trace=[];
   for(const stage of ASSIGN_STAGES){
    let pool=STAFF.filter(s=>s.dep.includes(stage));
    trace.push({r:'r1',left:pool.length,note:`${pool.length} in ${stage}`}); fired.r1++;
    narrowed.r1+=pool.length;                       // summed, so it can be reported as an average
    if(!pool.length){ exc.push({o,stage,dk:day.dk,today:o.today,why:'no-dept',t:`Nobody belongs to ${stage}`,trace}); continue; }

    // routing rules narrow the pool before any constraint on load
    for(const r of RULES.filter(x=>x.k==='route'&&x.on&&(x.cond||x.match))){
     if(ruleMatches(r,o,stage)){
      const before=pool.length;
      pool=pool.filter(s=>r.pool.includes(s.id));
      fired[r.id]++; if(before!==pool.length) narrowed[r.id]++;
      trace.push({r:r.id,left:pool.length,note:`${r.n} — ${before} → ${pool.length}`});
     }
    }
    if(!pool.length){ exc.push({o,stage,dk:day.dk,today:o.today,why:'no-dept',t:`A routing rule left nobody eligible`,trace}); continue; }

    /* Coverage — who is qualified for this place and this product. Applied before
       availability and load on purpose: someone who does not cover Alaska is not
       "unavailable", they were never a candidate, and the exception should say
       that rather than blaming the roster. */
    if(ruleOn('r6')&&COVSTAGES.includes(stage)){
     const b=pool.length; pool=pool.filter(x=>coversPlace(x.id,o.st,o.co)); fired.r6++;
     if(b!==pool.length) narrowed.r6++;
     if(b!==pool.length) trace.push({r:'r6',left:pool.length,note:`${stage} — covers ${o.co}, ${o.st} — ${b} → ${pool.length}`});
     if(!pool.length){
      const stateOnly=STAFF.filter(x=>x.dep.includes(stage)&&x.active!==false&&coversPlace(x.id,o.st,null));
      exc.push({o,stage,dk:day.dk,today:o.today,why:'coverage',
       t:`Nobody in ${stage} covers ${o.co}, ${o.st}`,
       near:stateOnly.map(x=>x.id), trace}); continue; }
    }
    if(ruleOn('r7')&&COVSTAGES.includes(stage)){
     const b=pool.length; pool=pool.filter(x=>coversProduct(x.id,o.pr)); fired.r7++;
     if(b!==pool.length) narrowed.r7++;
     if(b!==pool.length) trace.push({r:'r7',left:pool.length,note:`${stage} — works ${o.pr} — ${b} → ${pool.length}`});
     if(!pool.length){
      const placeOK=STAFF.filter(x=>x.dep.includes(stage)&&x.active!==false&&coversPlace(x.id,o.st,o.co));
      exc.push({o,stage,dk:day.dk,today:o.today,why:'coverage',
       t:`Nobody in ${stage} who covers ${o.st} works ${o.pr}`,
       near:placeOK.map(x=>x.id), trace}); continue; }
    }

    if(ruleOn('r2')){ const b=pool.length; pool=pool.filter(s=>s.avail==='ok'&&s.active!==false); fired.r2++;
     if(b!==pool.length) narrowed.r2++;
     if(b!==pool.length) trace.push({r:'r2',left:pool.length,note:`availability — ${b} → ${pool.length}`}); }
    if(!pool.length){ exc.push({o,stage,dk:day.dk,today:o.today,why:'unavailable',t:`Everyone eligible for ${stage} is on leave or off shift`,trace}); continue; }

    if(ruleOn('r3')){ const b=pool.length; pool=pool.filter(s=>load[s.id]<s.cap); fired.r3++;
     if(b!==pool.length) narrowed.r3++;
     if(b!==pool.length) trace.push({r:'r3',left:pool.length,note:`at target — ${b} → ${pool.length}`}); }
    if(!pool.length){ exc.push({o,stage,dk:day.dk,today:o.today,why:'capacity',t:`Everyone eligible for ${stage} is at their daily target`,trace}); continue; }

    const paired=PAIRS[stage];
    if(ruleOn('r4')&&paired){ const b=pool.length; pool=pool.filter(s=>onOrder[paired]!==s.id); fired.r4++;
     if(b!==pool.length){ avoided++; narrowed.r4++; trace.push({r:'r4',left:pool.length,note:`self-review — skipped ${who(onOrder[paired])}`}); } }
    if(!pool.length){ exc.push({o,stage,dk:day.dk,today:o.today,why:'self',t:`The only person with room did the ${paired}`,trace}); continue; }

    pool.sort((a,b)=>(load[a.id]/a.cap)-(load[b.id]/b.cap)); fired.r8++;
    const p=pool[0];
    trace.push({r:'r8',left:1,note:`emptiest — ${who(p.id)} at ${load[p.id]}/${p.cap}`});
    load[p.id]++; onOrder[stage]=p.id;
    assigns.push({o,stage,who:p.id,hr:slot.hr,dk:day.dk,today:o.today,trace:trace.slice()});
   }
   o.plan=onOrder; o.trace=trace;
  }
  dayHourly.push({hr:slot.hr,n:slot.orders.length,
   used:Object.fromEntries(STAFF.map(s=>[s.id,load[s.id]-hStart[s.id]])),
   load:{...load}});
 }
 hourly=dayHourly;                                   // the Live view always shows today
 }
 const orders=days.flatMap(d=>d.arrivals.flatMap(a=>a.orders));
 return {assigns,exc,load,fired,narrowed,hourly,avoided,deptOut,orders,
  today:orders.filter(o=>o.today),
  days:days.map(d=>({date:d.date,dk:d.dk,n:d.arrivals.reduce((a,x)=>a+x.orders.length,0)})),
  total:orders.length*ASSIGN_STAGES.length};
}

/* ══════════ progress ══════════
   Stages complete in order, roughly one every 1.5h after the order arrives.
   An order that landed at 9:00 has had most of the day; one at 17:00 has barely started. */
const STAGE_HOURS=1.5;
const stageIdx=s=>ASSIGN_STAGES.indexOf(s);
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const ageHrs=o=>Math.round((midnight(NOW)-midnight(o.date))/36e5)+(NOW.getHours()+NOW.getMinutes()/60-o.hr);
const doneCount=o=>Math.max(0,Math.min(ASSIGN_STAGES.length,Math.floor(ageHrs(o)/STAGE_HOURS)));
const isDone=(o,stage)=>stageIdx(stage)<doneCount(o);
/* complete · waiting · progress — the three states a board can show */
const orderState=o=>{const d=doneCount(o);
  return d>=ASSIGN_STAGES.length?'complete':d===0?'waiting':'progress';};

/* per-person: what they finished today, what is still on their desk */
function staffWork(){
 const m={};
 STAFF.filter(s=>s.dep.length).forEach(s=>m[s.id]={s,done:0,pend:0,items:[],stages:{}});
 RUN.assigns.filter(a=>a.today).forEach(a=>{
  const r=m[a.who]; if(!r) return;
  const fin=isDone(a.o,a.stage);
  fin?r.done++:r.pend++;
  r.stages[a.stage]=r.stages[a.stage]||{done:0,pend:0};
  fin?r.stages[a.stage].done++:r.stages[a.stage].pend++;
  r.items.push({o:a.o,stage:a.stage,fin,hr:a.hr});
 });
 Object.values(m).forEach(r=>{r.tot=r.done+r.pend; r.pct=r.tot?Math.round(r.done/r.tot*100):0;});
 return m;
}
let DAY=makeDay();
let RUN=runDay(DAY);
let BATCH=RUN.today;
let WORK=staffWork();
let WORKED=Object.values(WORK).filter(r=>r.tot>0).sort((a,b)=>b.tot-a.tot);
let TOT_DONE=WORKED.reduce((a,r)=>a+r.done,0);
let TOT_PEND=WORKED.reduce((a,r)=>a+r.pend,0);

/* per-department: the same question asked of a team rather than a person */
function deptWork(){
 const m={};
 STAGES.forEach(d=>m[d]={d,done:0,pend:0,unplaced:0,items:[],people:{},
   auto:ASSIGN_STAGES.includes(d),
   staff:STAFF.filter(s=>s.dep.includes(d)),
   cap:STAFF.filter(s=>s.dep.includes(d)&&s.avail==='ok').reduce((a,s)=>a+s.cap,0),
   load:STAFF.filter(s=>s.dep.includes(d)&&s.avail==='ok').reduce((a,s)=>a+RUN.load[s.id],0)});
 RUN.assigns.filter(a=>a.today).forEach(a=>{
  const r=m[a.stage]; if(!r) return;
  const fin=isDone(a.o,a.stage);
  fin?r.done++:r.pend++;
  r.people[a.who]=r.people[a.who]||{done:0,pend:0};
  fin?r.people[a.who].done++:r.people[a.who].pend++;
  r.items.push({o:a.o,who:a.who,fin,hr:a.hr});
 });
 RUN.exc.filter(e=>e.today).forEach(e=>{ if(m[e.stage]) m[e.stage].unplaced++; });
 Object.values(m).forEach(r=>{
  r.tot=r.done+r.pend;
  r.pct=r.tot?Math.round(r.done/r.tot*100):0;
  r.avail=r.staff.filter(s=>s.avail==='ok').length;
 });
 return m;
}

let DEPTS=STAGES.map(d=>DWORK[d]);

 RUN=runDay(DAY); BATCH=RUN.today;

}

/* ══════════ STAGE BUDGETS ══════════
   The client is promised a total. That total has to be divided between the
   departments, or Search can burn 23 of 24 hours and leave the rest of the
   pipeline an hour it cannot possibly work in.

   Shares are a PERCENTAGE of the clock, not fixed hours, so one setting covers a
   4-hour rush and a 48-hour full search. A buffer is held back at the end so the
   last stage does not land exactly on the client's deadline. */
let BUDGET={
 buffer:10,                                          // % of the clock kept in reserve
 base:{Search:50,'Search QC':11,Typing:25,'Typing QC':10,RTS:4},
 over:[{pr:'40Y',shares:{Search:62,'Search QC':10,Typing:18,'Typing QC':7,RTS:3}},
       {pr:'FS+',shares:{Search:60,'Search QC':10,Typing:20,'Typing QC':7,RTS:3}}]};

/* departments can be added, renamed or removed — the budget has to follow */
function syncBudget(){
 const fix=sh=>{const out={};
   ASSIGN_STAGES.forEach(st=>out[st]=typeof sh[st]==='number'?sh[st]:0);
   return out;};
 BUDGET.base=fix(BUDGET.base);
 BUDGET.over.forEach(o=>o.shares=fix(o.shares));
}
budgetHook=syncBudget; syncBudget();
const sharesFor=pr=>{const o=BUDGET.over.find(x=>x.pr===pr); return o?o.shares:BUDGET.base;};
const shareTotal=sh=>ASSIGN_STAGES.reduce((a,st)=>a+(sh[st]||0),0);
const budgetOK=sh=>Math.round(shareTotal(sh))===100;

/* the checkpoint each department must hit, expressed as hours from arrival */
let _cpCache={};
const cpKey=(h,pr)=>`${h}|${pr}|${BUDGET.buffer}|${JSON.stringify(sharesFor(pr))}`;
function checkpoints(slaH,pr){
 const k=cpKey(slaH,pr); if(_cpCache[k]) return _cpCache[k];
 return _cpCache[k]=_checkpoints(slaH,pr);
}
function _checkpoints(slaH,pr){
 const win=slaH*(1-BUDGET.buffer/100), sh=sharesFor(pr);
 let cum=0;
 return ASSIGN_STAGES.map(st=>{const h=win*(sh[st]||0)/100; cum+=h;
   return {stage:st,pct:sh[st]||0,hours:h,by:cum};});
}
const slaHours=o=>{
 const r=SLA.find(x=>x.cl===o.cl&&x.pr===o.pr)
       ||SLA.find(x=>x.cl===o.cl&&x.pr==='Any')
       ||SLA.find(x=>x.pr===o.pr&&isDefaultRule(x))
       ||SLA.find(isDefaultRule);
 return r?r.h:24;};

/* how far an order has actually got: the last stage with a person on it */
const ownersOf=o=>o.a||o.plan||{};
/* Board orders carry a due date; generated ones derive it from arrival + the SLA
   in force, which is not known until the SLA table below has been declared. */
const dueOf=o=>o.due||(o.recv?new Date(o.recv.getTime()+slaHours(o)*36e5):NOW);
const curIdx=o=>{ if(o.done) return ASSIGN_STAGES.length;
 const own=ownersOf(o);
 let last=-1; ASSIGN_STAGES.forEach((st,i)=>{ if(own[st]) last=i; }); return last; };
const curStageOf=o=>{const i=curIdx(o); return i<0?ASSIGN_STAGES[0]:i>=ASSIGN_STAGES.length?null:ASSIGN_STAGES[i];};

/* ── the part that answers "we found out at hour 23" ──
   For every order: which checkpoints have been missed, how much budgeted time the
   remaining stages still need, and whether the promise is already unreachable. */
function orderPlan(o){
 const h=slaHours(o), cps=checkpoints(h,o.pr), i=curIdx(o);
 const elapsed=(NOW-o.recv)/36e5;
 const rows=cps.map((c,idx)=>({...c,
   at:new Date(o.recv.getTime()+c.by*36e5),
   done:idx<i, current:idx===i,
   behind: idx>=i && elapsed>c.by}));
 /* What the rest of the pipeline still needs. The stage in progress is not owed its
    whole slice — only the part of its slice it has not already used. Counting the
    full slice would flag an order three hours into a healthy Search. */
 const at=Math.max(0,i);
 const left = at>=cps.length ? 0                     // every stage is behind it; nothing left to do
   : Math.max(0,cps[at].by-elapsed) + cps.slice(at+1).reduce((a,c)=>a+c.hours,0);
 const remaining=h-elapsed;                          // hours until the client deadline
 return {slaH:h, rows, elapsed, needs:left, remaining,
   behind: rows.some(r=>r.behind),
   /* not enough clock left to do the remaining work at its own budgeted pace */
   doomed: !o.done && left>remaining,
   short: r2(left-remaining)};
}
const atRisk=o=>!o.done&&orderPlan(o).doomed;

const MONTHS=['Mar 2026','Apr 2026','May 2026','Jun 2026','Jul 2026','Aug 2026'];
const MWEIGHT=[0.14,0.16,0.15,0.19,0.22,0.14];
const r2=n=>Math.round(n*100)/100;
function makeInvoices(){
 const out=[]; let n=401;
 CLIENTS.filter(c=>c.total>0).forEach(c=>{
  let alloc=0, paidLeft=c.paid;
  MONTHS.forEach((m,i)=>{
   const amt = i===MONTHS.length-1 ? r2(c.total-alloc) : r2(c.total*MWEIGHT[i]);
   alloc=r2(alloc+amt);
   const paid=r2(Math.min(amt,paidLeft));          // oldest invoices settle first
   paidLeft=r2(paidLeft-paid);
   out.push({id:`INV-2026-0${n++}`,cl:c.n,code:c.dn,m,mi:i,amt,paid,
    orders:Math.max(1,Math.round(c.orders*MWEIGHT[i])),
    issued:new Date(2026,2+i,1),
    st: amt===0?'paid' : paid>=amt ? 'paid' : paid>0 ? 'part' : (i<=3?'overdue':'open')});
  });
 });

}

/* date range — filters on the issue date. The month dropdown is a shortcut that sets it,
   so the two controls can never contradict each other. */
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const monthBounds=m=>{const i=MONTHS.indexOf(m);return [iso(new Date(2026,2+i,1)),iso(new Date(2026,3+i,0))];};
function invInRange(i,from,to){
 if(!from&&!to) return true;
 if(from&&i.issued<parseIso(from)) return false;
 if(to){const e=parseIso(to); e.setHours(23,59,59); if(i.issued>e) return false;}
 return true;
}
/* which month, if any, the current range exactly matches */
function rangeMonth(from,to){
 if(!from&&!to) return 'all';
 for(const m of MONTHS){const [a,b]=monthBounds(m); if(a===from&&b===to) return m;}
 return 'custom';
}
const RPRESETS=[
 ['All time',null,null],
 ['This month',...monthBounds('Aug 2026')],
 ['Last 3 months',monthBounds('Jun 2026')[0],monthBounds('Aug 2026')[1]],
 ['Year to date',monthBounds('Mar 2026')[0],monthBounds('Aug 2026')[1]]];

/* ══════════ what a workload card opens ══════════

function workFocus(key,f,mode){
 const all=RUN.assigns.filter(a=>a.today).map(a=>({...a,fin:isDone(a.o,a.stage)}));
 const exc=RUN.exc.filter(e=>e.today);
 if(f==='exc'){
  const causes={}; exc.forEach(e=>{(causes[e.why]=causes[e.why]||[]).push(e);});
  const CAUSE={capacity:['Everyone eligible was already at their daily target',
      'Raise the target, add someone to that department, or accept the queue.'],
    unavailable:['Everyone eligible was on leave or off shift','Cover, or a rule that routes elsewhere when a department is empty.'],
    'no-dept':['Nobody belongs to that department','Add a member, or the stage cannot run at all.'],
    self:['The only person free had already done the paired stage','Self-review is blocked, so the work waited rather than being checked by its author.']};
  return focusHead(key,`${exc.length} stage${exc.length===1?'':'s'} the engine could not place`,
    'These are not lost — they are waiting for a person to place them by hand. Grouped by why, because each cause has a different fix.')
   +Object.entries(causes).sort((a,b)=>b[1].length-a[1].length).map(([why,list])=>{
     const c=CAUSE[why]||[why,''];
     return `<h2 class="sec">${esc(c[0])} — ${list.length}</h2>
      <div class="bnr r"><span class="bi">◷</span><div><div class="bt">What would clear these</div>${esc(c[1])}</div></div>
      ${flWrap(760,flHead('160px 140px 150px 1fr',['Order','Stage','Client','What happened'])
       +`<div class="tb">${list.map(e=>flRow('160px 140px 150px 1fr',[
         `<div class="v mono" style="font-size:12.5px">${esc(e.o.id)}</div><div class="s">${esc(e.o.pr)}</div>`,
         `<div class="v" style="font-size:12.5px">${esc(e.stage)}</div>`,
         `<div class="v" style="font-size:12.5px">${esc(e.o.cl)}</div>`,
         `<div class="v" style="font-size:12.5px">${esc(e.t)}</div>`])).join('')}</div>`)}`;}).join('')
   +`<p class="gr" style="font-size:12.5px;margin-top:10px">Every one of these arrived today and found no home. The Assignment screen shows the full decision trail for any of them.</p>`;
 }
 if(f==='idle'){
  const roster=STAFF.filter(x=>x.dep.length);
  const busy=roster.filter(x=>(WORK[x.id]||{pend:0}).pend>0);
  const idle=roster.filter(x=>!busy.includes(x));
  return focusHead(key,`${busy.length} of ${roster.length} have work in hand`,
    idle.length?`${idle.length} finished everything assigned to them, or were never given any. Those are two different situations and the list separates them.`
      :'Nobody is sitting without work.')
   +`<h2 class="sec">Nothing on their desk — ${idle.length}</h2>
   ${idle.length?flWrap(720,flHead('200px 190px 130px 1fr',['Person','Departments','Today','Why'])
     +`<div class="tb">${idle.map(x=>{const wk=WORK[x.id]||{done:0,tot:0};
       return flRow('200px 190px 130px 1fr',[
        `<div style="display:flex;align-items:center;gap:8px"><button class="ava" title="Open ${esc(x.n)}" onclick="openPerson('${x.id}')">${initials(x.n)}</button><div class="v">${esc(x.n)}</div></div>`,
        `<div class="v gr" style="font-size:12.5px">${esc(x.dep.join(', '))}</div>`,
        `<div class="v mono">${wk.tot||0}</div><div class="s">${wk.done||0} done</div>`,
        x.avail!=='ok'?`<div class="v warn" style="font-size:12.5px">${esc(AVAIL[x.avail][0])} — not eligible today</div>`
        :wk.tot?`<div class="v ok" style="font-size:12.5px">finished all ${wk.tot} of theirs</div>`
        :`<div class="v bad" style="font-size:12.5px">never given anything — capacity going unused</div>`]);}).join('')}</div>`)
    :`<div class="card p"><p class="gr" style="font-size:12.5px;margin:0">Everyone has something in hand.</p></div>`}
   <h2 class="sec">Working now — ${busy.length}</h2>
   ${flWrap(680,flHead('200px 190px 110px 1fr',['Person','Departments','In hand','Progress'])
    +`<div class="tb">${busy.sort((a,b)=>(WORK[b.id].pend)-(WORK[a.id].pend)).map(x=>{const wk=WORK[x.id];
      return flRow('200px 190px 110px 1fr',[
       `<div style="display:flex;align-items:center;gap:8px"><span class="ava">${initials(x.n)}</span><div class="v">${esc(x.n)}</div></div>`,
       `<div class="v gr" style="font-size:12.5px">${esc(x.dep.join(', '))}</div>`,
       `<div class="v mono warn">${wk.pend}</div>`,
       `<div class="split" style="margin-top:5px">
         <span style="width:${wk.pct}%;background:var(--ok)"></span><span style="width:${100-wk.pct}%;background:var(--warn)"></span></div>
        <div class="s">${wk.pct}% of ${wk.tot} complete</div>`]);}).join('')}</div>`)}
   <p class="gr" style="font-size:12.5px;margin-top:10px">"Nobody idle" counts people holding unfinished work. Someone who cleared their queue is not idle in any way worth worrying about — someone who was never given any is.</p>`;
 }
 const list=(f==='done'?all.filter(a=>a.fin):f==='pend'?all.filter(a=>!a.fin):all)

 const groups=mode==='dept'?ASSIGN_STAGES:[...new Set(list.map(a=>a.who))];

       `<div class="v" style="font-size:12.5px">${esc(a.o.cl)}</div>`,
       `<div class="v" style="font-size:12.5px">${esc(mode==='dept'?who(a.who):a.stage)}</div>`,

  +`<p class="gr" style="font-size:12.5px;margin-top:10px">Ordered by arrival time, because that is the order the engine placed them in.</p>`;
}

}
